   story:{src:'kian',t:'I’ve been paid for everything I’ve ever done. But more than half of it needed chasing, because clients didn’t pay on the date we agreed. I never demand the money on the spot. When they say “two weeks”, I say I’ll check in in two weeks, and I do, every time. It rarely makes either side happy. I’m fine with that: being paid is my right, and if you think it’s okay to drag me on for months, that’s my red line.'},
   tech:'warm-then-firm',
   practice:{scene:'Your invoice was due two weeks ago. [[They still haven’t paid.]] You call them.',scen:'difficult',who:'A client · two weeks late',job:'A late invoice',pos:'',role:'A friendly client who drags payments when nobody follows up. You commit to a specific date if asked clearly and calmly. You test whether they will really check in.',line:'“Oh hi! Sorry, things have been crazy here. Can you give us a bit more time?”'}},
  {id:'market-rate',cat:'client',title:'“The market rate is lower than that”',
   feel:'And now you feel like you have to defend your worth.',moment:'You quoted your price. The client has done some research: [[“Others charge much less for this.”]]',
   most:'Defending your price line by line. Or matching the lower number to keep them.',
   fails:'Market rate is just what other people agreed to. Argue about it and you’ve made it the rule.',
   k:'“That may be true for some. My price is for it being right the first time, on the date we agree. If budget is the main thing, here’s what I can do for less.”',
   principle:'Market rate is a reference, not a rule.',
   then:'Talk about what they get from you, then offer a smaller version at a lower number. Never just drop the price. The exception: starting out, collecting work matters more than the rate.',
   story:null,tech:'give-to-get',
   practice:{scene:'You quoted Lena for packaging design for three teas. She has looked up other designers online, and [[she thinks you charge too much]].',scen:'ground',who:'Lena · runs a small tea brand',moment:'She has compared quotes online.',job:'Packaging design for three teas',pos:'¥8,000. Lowest you’ll accept: ¥7,000',line:'“I checked around online. The market rate for this kind of design is about ¥5,000. Why is yours so much higher?”'}},
  {id:'big-name',cat:'client',title:'A big name offers you very little money',
   feel:'You’re flattered. And a little insulted.',moment:'A famous studio wants you on their project. [[The pay is a fraction of your rate.]] “It’ll look great on your CV.”',
   most:'Saying yes at once because of the name. Or saying no without thinking it through.',
   fails:'Big projects have big teams to feed. Unless you’re at the top, the name pays in reputation, not money. And the low rate tends to stick.',
   k:'“I’d love to be part of it. At this budget I can do the main pieces; for the full scope, my rate is X. Which works better for you?”',
   principle:'Weigh the name against the pay, out loud.',
   then:'Decide what the name is worth to you before the call. If you take less, get something back: credit, a reference, a smaller scope.',
   story:{src:'kian',t:'Early in my career I worked on Dishonored, which went on to win a BAFTA. I was paid ten dollars an hour. Twelve years later, people still say “wow” when they hear I worked on it. It was fun. It was also ten dollars an hour.'},
   tech:'give-to-get',
   practice:{scene:'A producer from a famous game studio wants you for sound design on their next game. You’d love it on your CV, but [[the pay is a fraction of your rate]].',scen:'bargain',who:'Sam · producer at a famous game studio',moment:'They know their name is worth a lot to you.',job:'Sound design for a big-name game',pos:'¥800 a day. Lowest you’ll accept: ¥600',line:'“Our budget is ¥300 a day. But honestly, imagine having our studio on your CV.”'}},
  {id:'walk-away',cat:'client',title:'A client you should walk away from',
   feel:'You’re fed up, and not sure you’re allowed to be.',moment:'Third round of “small changes”, a lower budget than agreed, and [[now they want it by Monday]].',
   most:'Saying yes again and resenting every hour. Or going quiet and hoping they disappear.',
   fails:'Every yes teaches them the line keeps moving. And ghosting does more damage to your name than a clear no.',
   k:'“I don’t think I’m the right fit for this version of the project. Here’s everything I’ve done so far, and I’m happy to hand it over cleanly.”',
   principle:'Not every client is your client.',
   then:'Know your walk-away point before you talk. Leave politely, finish clean. Not every client is your client.',
   story:null,tech:'walk-away',
   practice:{scene:'Kevin runs a small startup. You’ve already done three rounds of changes on his logo. Now he wants more changes, by Monday, and [[he’s cutting the budget]].',scen:'difficult',who:'Kevin · founder of a small startup',moment:'This is the third round of changes, and the budget just dropped.',job:'A logo that has been through three rounds',pos:'',line:'“Just a few more small changes. And we need it by Monday. Oh, and the budget got cut, sorry.”'}},
  {id:'team-pay',cat:'disagree',title:'Your team pushes back on pay and revisions',
   feel:'And part of you agrees with them.',moment:'You brought people in to help on a big job. Now one of them says: [[“For what we’re paid, this many revisions is too much.”]]',
   most:'Pulling rank: “That’s the job.” Or promising money you don’t have.',
   fails:'Pull rank and you lose their goodwill when you need it most. Promise money you can’t pay and you lose their trust.',
   k:'“You’re right, this is more than we planned. Let me see what I can add. If the budget really can’t move, you’re first on my list for the next job, and I’ll hold the client to two more rounds.”',
   principle:'If money fixes it, pay. If it can’t, give something real instead.',
   then:'A bit less profit beats a war mid-job. Promise only what you’ll deliver.',
   story:{src:'kian',t:'I took on a big conference job: the opening films for a three-day tech event. Too much for one person, so I brought in two sound designers and two mix engineers. More people, more problems: complaints about pay, frustration at revisions. Talking to the client took most of my time. The result was outstanding, and learning to manage people turned me into an audio director.'},
   tech:'warm-then-firm',
   practice:{scene:'You brought Ben, a sound designer, onto a big project. The client keeps asking for changes, and this is the fifth round this week. [[Ben has had enough.]]',scen:'conflict',who:'Ben · a sound designer on your team',moment:'It’s the fifth round of revisions this week.',role:'You are Ben, a sound designer on the speaker’s team; the speaker leads the team. You feel overworked and underpaid, and you are venting.',line:'“Honestly, for what we’re being paid, five rounds of changes in one week is too much.”'}},
  {id:'delegate',cat:'work',title:'You need to hand off work, but you don’t trust it to be done right',
   feel:'So you keep doing it all yourself, and you’re exhausted.',moment:'The job is too big for you alone. You need help, but [[you worry it won’t meet your standard or your deadline]].',
   most:'Doing it all yourself, late into the night. Or handing it off with “just do your best.”',
   fails:'Do it all yourself and you burn out, and cap how much work you can take. Hand it off vaguely and you get vague work back.',
   k:'“Here’s the part I need from you, here’s what great looks like, and I need it by Thursday at noon. Ask me anything before you start.”',
   principle:'Hand off the work. Keep the standard by saying what good looks like.',
   then:'Give one clear piece, an example of what good looks like, and a deadline with a check-in halfway.',
   story:{src:'kian',t:'Early on, I did nearly everything myself. I didn’t trust others to meet my standard or my deadlines, and keeping all the money was appealing. Late nights, every time. When a job was finally too big, I reluctantly brought in four people. Best decision I could have made: I could focus on the music and the client, and it led to bigger work.'},
   tech:'bottom-line-first',
   practice:{scene:'You just hired Leo, a freelancer, to help on a big project. It’s his first day and you need to brief him on his part. [[You’re worried he won’t get it right.]]',scen:'feedback',who:'Leo · a freelancer you just hired',moment:'You are briefing him on his first piece of the project.',role:'You are Leo, a freelancer the speaker just hired. You are keen but unsure what they want.',line:'“Hi! So, what exactly do you need from me on this project?”'}},
  {id:'nervous',cat:'work',title:'You’re scared of looking stupid if you speak up',
   feel:'And the longer you wait, the harder it gets.',moment:'The meeting goes quiet. You have a view, and [[your heart is racing]].',
   most:'Waiting until you are completely sure. Then the moment passes.',
   fails:'The moment rarely comes back. And every time you stay quiet, the next time gets harder.',
   k:'“Can I add one thing? I think we’re missing the customer’s side of this.” One sentence is enough to start.',
   principle:'Fear means you’re trying something new. Do it anyway, small.',
   then:'Prepare one sentence before the meeting. Say it in the first ten minutes, before the nerves build up.',
   story:{src:'kian',t:'Years into my career, I started making videos about my work. I was scared of being laughed at and of making mistakes on camera. That was the point. The older we get, the more comfortable we become, and the less we try. Each video made the next one easier.'},
   tech:'bottom-line-first',
   practice:{scene:'You’re in a team meeting. Your manager asks for opinions and the room goes quiet. You have an idea, but [[your heart is racing]].',scen:'meeting',who:'Your manager · weekly team meeting',moment:'The room has gone quiet. You have a view, and your heart is racing.',line:'“Anyone else? Any thoughts before we move on?”'}},
  {id:'what-you-do',cat:'job',title:'“So, what do you do?”',
   feel:'And you watch their eyes glaze over.',moment:'Someone useful asks the simplest question, and [[you answer with your job title and a list of skills]].',
   most:'“I’m a designer. I do branding, web, some motion…”',
   fails:'A title and a list are forgettable. People remember what you do for someone, not what you call yourself.',
   k:'“I help small brands look bigger than they are. Mostly packaging and their first website.”',
   principle:'Say what they get, not what you do.',
   then:'Then stop. Let them ask the next question.',
   story:null,tech:'their-problem',
   practice:{scene:'You’re at an industry event. A friend just introduced you to a marketing director, someone who could hire you. [[She asks what you do.]]',scen:'intro',who:'A marketing director at an industry mixer',moment:'You have just been introduced.',line:'“Nice to meet you. So what is it you do, exactly?”'}},
  {id:'known-for-one',cat:'job',title:'People only know you for one thing',
   feel:'You’re proud of it. You’re also so much more than that.',moment:'Someone recognizes you from one big project, and [[the whole conversation stays there]].',
   most:'Talking about that project for ten minutes. Or brushing it off.',
   fails:'Stay there and you’re stuck as “the person who did that”. Brush it off and you waste the door it opens.',
   k:'“Yes, that was me. These days I spend most of my time on X, which is why I wanted to meet you.”',
   principle:'Use the label to open the door. Then say what’s next.',
   then:'Give the old project one sentence. Then bridge to what you want them to remember now.',
   story:{src:'kian',t:'I scored Wolf Warrior, a blockbuster action film. For years, all I had to say was “I did the music for Wolf Warrior,” and doors opened. But the label never quite peeled off, even when I wanted to be known for other work. Big projects define you, for better and for worse.'},
   tech:'pivot',
   practice:{scene:'At an industry dinner, a producer realizes you worked on a famous project years ago. [[She only wants to talk about that one.]]',scen:'intro',who:'A producer at an industry dinner',moment:'She has just realized you worked on a famous project.',line:'“Wait, you did the music for that film? That’s amazing. What are you working on now?”'}},
  {id:'career-change',cat:'job',title:'Explaining a career change',
   feel:'You can feel the doubt in the room.',moment:'An interviewer looks at your background: “This is quite a jump. [[Why should we take the risk?]]”',
   most:'Apologizing for your past, or listing every course you took to catch up.',
   fails:'Apologize and your past becomes a weakness. A list of courses doesn’t show why you’d be good.',
   k:'“Music taught me to tell a story in thirty seconds. That’s most of what this job is, so it’s less of a jump than it looks.”',
   principle:'Your past is the seed. Connect the dots for them.',
   then:'Pick the one skill that carries over. Give one example of it.',
   story:{src:'book',t:'Three people who started out in music: one became a full-time tattoo artist, one manages real estate, one is a creative director at Google. None of them planned it. Each grew a new career out of an interest they kept alive alongside music.'},
   tech:'star',
   practice:{scene:'You’re in a job interview for a role outside your old field. The hiring manager sees your background and [[isn’t sure you fit]].',scen:'interview',who:'The hiring manager · second round',moment:'Your background is in a different field.',line:'“Your background is in music, but this is a marketing role. Why should we hire you for this?”'}},
  {id:'all-over',cat:'job',title:'“Your CV is all over the place”',
   feel:'And suddenly you’re not sure yourself.',moment:'The interviewer sees five different kinds of work and asks [[what your real specialty is]].',
   most:'Picking one skill and hiding the rest. Or listing everything.',
   fails:'Hide your skills and you throw away what makes you different. List them all and you look unfocused.',
   k:'“They all serve one thing: I can take an idea from sketch to finished product on my own. Most teams need three people for that.”',
   principle:'Stack your skills into one story.',
   then:'Name the one result your skills add up to. Then give one example.',
   story:{src:'kian',t:'When I was employed, I used maybe 20% of what I could do. When I went freelance, I built my own website, pitched my own clients and wrote my own copy. Ordinary skills, stacked together, became a brand no one else had.'},
   tech:'rule-of-3',
   practice:{scene:'In a first interview, the interviewer looks at your CV. You’ve done many different kinds of work, and [[they can’t tell what you’re best at]].',scen:'interview',who:'The interviewer · first round',moment:'They are looking at your CV.',line:'“Your CV is all over the place. What is your actual specialty?”'}},
  {id:'one-project',cat:'job',title:'“Apart from that one project, what else?”',
   feel:'And you worry there isn’t enough behind it.',moment:'You led with your one impressive project. The interviewer wants to know [[what’s behind it]].',
   most:'Talking about the big project again, in more detail.',
   fails:'One big project can look like luck. They want to know you can do it again.',
   k:'“That’s the one people know. Behind it are about twenty smaller projects in two years, which is why I can adapt fast.”',
   principle:'Show the pattern, not just the peak.',
   then:'Name your range in one sentence. Then one quick example that’s different from the big one.',
   story:{src:'kian',t:'My first job was at a small outsourcing studio that survived by taking every project it could. In two years I worked on almost two dozen titles, from mobile games to award winners. The volume proved I was adaptable and reliable, which is hard to show with one big project and nothing to compare it to.'},
   tech:'star',
   practice:{scene:'You’re in your final interview, and you just talked about your best-known project. The interviewer is impressed, but [[wants to know what else you have]].',scen:'interview',who:'The interviewer · final round',moment:'You just talked about your best-known project.',line:'“Great project. But apart from that one, what else have you done?”'}},
  {id:'teaching',cat:'people',title:'Teaching someone new',
   feel:'And you feel your patience slipping.',moment:'You have to train a new colleague or a student. You know the material. [[They look lost.]]',
   most:'Starting with everything you know, in the order you learned it.',
   fails:'Content without connection doesn’t land. People learn from someone they feel gets them.',
   k:'“Before we start: what do you already know, and what would make today worth it for you?”',
   principle:'Connection before content.',
   then:'Ask first. Teach one thing. Check it landed. Then the next.',
   story:{src:'kian',t:'At sixteen, I was asked to start teaching at the guitar shop, with no experience at all. It took trial and error and watching my co-workers. The biggest lesson: connecting with my students mattered as much as the teaching itself.'},
   tech:null,
   practice:{scene:'Mia is your new intern and it’s her first day. You’re in charge of getting her started. [[She looks completely lost.]]',scen:'intro',who:'Mia · your new intern, first day',moment:'You are her first point of contact.',line:'“Hi! I’m Mia. So… where do I even start?”'}},
  // ── Starting out (from Kian’s answers, Oct 20) ──
  {id:'teacher-favor',cat:'start',title:'Asking a teacher for a big favor',
   feel:'You feel like you’re bothering them.',moment:'You need a recommendation letter. Your teacher is busy, and [[you’re not that close]].',
   most:'A quick message the night before the deadline: “Can you write me a letter?”',
   fails:'It reads like an order, not a request. Busy people say yes to whoever makes it easy, and shows they value their time.',
   k:'“I know you’re busy, and I’d really appreciate your help with a recommendation letter. I’ll send you everything you need, and I’d love to buy you a coffee to say thanks.”',
   principle:'Admit you need help. Offer something back.',
   then:'Ask early. Put everything they need in one message. Thank them after, whatever the result.',
   story:null,tech:'good-question',
   practice:{scene:'You need a recommendation letter for a school application in three weeks. Your teacher is busy and [[you’re not that close]]. You catch them after class.',scen:'smalltalk',who:'Your teacher · after class',moment:'You need a recommendation letter in three weeks.',role:'You are a busy teacher. You like the student but don’t know them well. You are willing to help if they make it easy and are polite; a vague or last-minute ask makes you hesitate.',line:'“Hi, did you want to ask me something?”'}},
  {id:'group-project',cat:'start',title:'A group project member does nothing',
   feel:'And you can feel the grade slipping.',moment:'Two weeks to the deadline. One member hasn’t said a word in the group chat, and [[hasn’t done a thing]].',
   most:'Complaining in a side chat. Or doing their part yourself and resenting it.',
   fails:'Complaining fixes nothing. Doing it all yourself burns you out, and teaches them it works.',
   k:'“You’d be great on the visuals, you’ve got the eye for it. Want to own that part? Tell me what you need from us.”',
   principle:'Draw out the shy ones. Route around the lazy ones.',
   then:'Quiet people often just need to feel seen, so give them something hands-on. If they still do nothing, hand them one small task and don’t spend more energy than it’s worth.',
   story:null,tech:'labeling',
   practice:{scene:'Your group project is due in two weeks. One member [[hasn’t done anything]] and barely replies in the group chat. You call them.',scen:'conflict',who:'Your group member · a quick call',moment:'They haven’t done anything yet, and the deadline is in two weeks.',role:'You are the quiet group member who hasn’t contributed. You are shy and unsure where to start, not lazy. If the speaker makes you feel useful and gives you a clear part, you open up; if they attack you, you go quiet.',line:'“Oh, hey. Sorry, I’ve been kind of busy lately.”'}},
  {id:'internship',cat:'job',title:'An internship interview with little experience',
   feel:'And you’re sure everyone else has more to show.',moment:'The interviewer looks at your CV: [[“You don’t have much experience yet. Why should we take you?”]]',
   most:'Apologizing for not having experience. Or overselling skills you don’t have.',
   fails:'Training you costs them time. What they’re really asking is whether you’ll make that time worth it.',
   k:'“I don’t have much experience yet, but here are three projects I did on my own because I couldn’t stop. I learn fast, I’m happy to take direction, and I’ll make your time training me worth it.”',
   principle:'Show enthusiasm, and show you’ll take direction.',
   then:'Bring your own projects, even small ones. If you can’t show enthusiasm now, they’ll wonder if you’ll enjoy the job at all.',
   story:{src:'kian',t:'My first job was an unpaid internship at a game sound design outsourcing studio in Boston. I found it through the career center at Berklee, sent an email, prepared my portfolio from my graduation work and the Video Game Orchestra, and went in showing I was keen to learn. I treated every lesson as the most valuable thing I had. I wasn’t the only one who applied. I got in through luck, attitude, and having something to show.'},
   tech:'their-problem',
   practice:{scene:'You’re interviewing for an internship at a small design studio. You don’t have much work experience yet, and [[the interviewer can see it]].',scen:'interview',who:'The interviewer · a small studio',moment:'They are looking at your CV.',role:'You run a small studio and are interviewing for an intern. Training costs you time. You want enthusiasm, a good attitude and willingness to take direction.',line:'“You don’t have much experience yet. Why should we take you as our intern?”'}},
  {id:'nothing-to-show',cat:'job',title:'You turn up with nothing to show',
   feel:'You meant to bring it. Now you’re hoping they won’t ask.',moment:'The studio owner smiles: [[“So, can I see some of your work?”]] Your portfolio is at home.',
   most:'“I didn’t bring it, but I can email it to you.”',
   fails:'It says you didn’t prepare. If you didn’t care enough to bring it, why would they care enough to ask again?',
   k:'“Yes. Here are two pieces on my phone. The full portfolio is on my site, and I’ll send you the link today.”',
   principle:'Have something to show. Walking in empty-handed says you don’t care.',
   then:'Keep two pieces on your phone, always. Treat every meeting like it’s the one that counts.',
   story:{src:'kian',t:'Before I graduated, I half-heartedly tried for an internship at an audio production studio. I went in with no website and no portfolio, and said I’d email them. The boss was nice enough to show me his studio. I sent something afterwards, and that was that. Looking back, I didn’t look like I cared, and I wasn’t prepared.'},
   tech:'star',
   practice:{scene:'You’re visiting a studio you’d love to intern at. The owner is friendly, and then [[asks to see your work]].',scen:'interview',who:'The studio owner · a quick visit',moment:'They just asked to see your work.',role:'You own a small studio and are open to an intern. You are friendly but notice who came prepared. You warm up if they show something now; you lose interest at excuses.',line:'“So, can I see some of your work?”'}},
  {id:'best-package',cat:'job',title:'They have candidates just as good as you',
   feel:'You’re good. So are the others. What makes the difference?',moment:'Final round. The hiring manager says: [[“Honestly, we’ve seen people with similar skills. Why you?”]]',
   most:'Listing more skills, louder.',
   fails:'When the skills are close, more skills don’t decide it. They’re picking who they want to work with every day.',
   k:'“You’ve seen my work. On top of it, you get someone who cares about this project, takes direction well, and is easy to work with.”',
   principle:'Skills get you on the list. Attitude gets you picked.',
   then:'Show the attitude, don’t claim it. Ask about their project, be reasonable on terms, and follow up when you say you will.',
   story:{src:'kian',t:'When I applied for my first in-house game job, at Spicy Horse in Shanghai, I had everything on the list: English and Mandarin, music, sound design, implementation, and a long list of credits. Years later my boss told me why he picked me. People as good or slightly better had applied from around the world, but many didn’t seem to care or made unreasonable requests. I thought I was the best at what I did. He said I had the best package, and my attitude made it.'},
   tech:'their-problem',
   practice:{scene:'Final round for a job you really want. The hiring manager tells you [[the others are just as skilled]].',scen:'interview',who:'The hiring manager · final round',moment:'They have several candidates with similar skills.',role:'You are choosing between equally skilled candidates. You care most about attitude and whether they will be easy to work with every day. Skill lists and demands put you off.',line:'“Honestly, we’ve seen people with similar skills. Why should we pick you?”'}},
  {id:'first-pay',cat:'start',title:'Your first salary offer is low',
   feel:'You’re grateful for the offer, and a little deflated.',moment:'You got the job. Then the number arrives, and [[it’s lower than you hoped]].',
   most:'Demanding the market rate. Or losing sleep over whether it’s fair.',
   fails:'At the start they usually have other options. Push hard and it can cost you the job. And the job, the work you collect, is what you need most right now.',
   k:'“I’m really excited about this role. Is there any flexibility on the starting pay? If not, could we review it after three months, once you’ve seen my work?”',
   principle:'Starting out, collect work first. It’s what you’ll bargain with later.',
   then:'Ask once, politely. If it’s a no and the work is good, take it, and get a review date in writing. Press for money once you have work to show. Unless you’re sure you’re their only option.',
   story:null,tech:'give-to-get',
   practice:{scene:'You got your first job offer. You’re excited, but [[the salary is lower than you hoped]]. The hiring manager calls to go through it.',scen:'tough',who:'The hiring manager · on a call',moment:'They just made you an offer.',role:'You are the hiring manager making a junior offer. Your budget is tight but you can review pay after a few months if they ask well. You don’t respond to demands.',line:'“So that’s the offer: ¥8,000 a month to start. Does that work for you?”'}},
  {id:'below-market',cat:'start',title:'Your first paid job is below market rate',
   feel:'You’re glad to be paid. And you wonder if you’re being taken for a ride.',moment:'Your first real client. You looked it up, and [[their offer is half the market rate]].',
   most:'Holding out for the market rate. Or saying yes and stewing over it.',
   fails:'They have dozens of people like you to choose from. Push hard and they pick someone else. Say yes and resent it, and it shows in the work.',
   k:'“Okay, ¥3,000 works for me. In return, I’d like my name in the credits and the right to show it in my portfolio.”',
   principle:'Starting out, collect work first. Get something back for the low rate.',
   then:'Take it if the work is worth showing, and get something back: credit, the right to show it, a review next time. Once you have a body of work, that’s your leverage.',
   story:{src:'kian',t:'Students ask me if they’re being paid fairly. Everyone should be. But if there’s one time you can afford to be undercut, it’s at the start, not mid-career. Most of us graduate with little to show, unless you’re Justin Bieber. Think of a small city-state between big empires: you have little to bargain with, unless you sit between empires that need you. So I tell my younger self: collect work first. The portfolio is what you bargain with later.'},
   tech:'give-to-get',
   practice:{scene:'Your first real client wants a short video edited. You looked it up, and [[their offer is half the market rate]].',scen:'bargain',who:'A small agency · your first paid job',moment:'They made you an offer below market rate.',job:'Editing a short promo video',pos:'Their offer: ¥3,000 (market is about ¥6,000). What you want back: credit and the right to show it',role:'A friendly agency producer with a fixed budget and plenty of other freelancers to call. You won’t raise the fee much, but you will happily give credit, portfolio rights, or a better rate next time if asked clearly.',line:'“We can offer ¥3,000 for this one. Does that work for you?”'}},
  {id:'critique',cat:'start',title:'A review where they tear your work apart',
   feel:'Your face burns. You want to explain everything.',moment:'Portfolio review. The panel goes through your work one piece at a time, and [[they don’t like most of it]].',
   most:'Defending every choice: “What I was going for was…”',
   fails:'Explaining sounds like arguing. It makes you look hard to work with, and that sticks longer than any piece of work.',
   k:'“Thank you, that’s really useful. If you were me, what’s the first thing you’d fix?”',
   principle:'Take criticism with grace. Don’t defend, ask.',
   then:'Listen. Ask one question that helps you get better. Thank them. Handling your emotions is often worth more than your skills.',
   story:null,tech:'good-question',
   practice:{scene:'It’s your portfolio review. Two senior reviewers have just looked through your work, and [[they don’t like most of it]].',scen:'tough',who:'The review panel · your portfolio review',moment:'They have just been through your work.',role:'You are a senior reviewer. You are blunt but fair, and you respect students who take criticism well. If the speaker argues or over-explains, you get shorter with them.',line:'“Honestly, most of this feels unfinished. What were you going for here?”'}},
  {id:'senior-event',cat:'people',title:'Talking to someone senior at an industry event',
   feel:'And suddenly you feel very junior.',moment:'At an industry event, someone whose work you admire is standing alone. [[This is your chance.]]',
   most:'Gushing praise. Or freezing and walking past.',

  st.addEventListener('pointerdown',e=>{const f=front();if(!f||!f.contains(e.target))return;x0=e.clientX;y0=e.clientY;dx=0;drag=true;lock=null;V._dkDragged=false;});
  st.addEventListener('pointermove',e=>{if(!drag)return;const ddx=e.clientX-x0,ddy=e.clientY-y0;
    if(lock===null&&(Math.abs(ddx)>8||Math.abs(ddy)>8))lock=Math.abs(ddx)>Math.abs(ddy)?'x':'y';
    if(lock!=='x')return;dx=ddx;V._dkDragged=Math.abs(dx)>8;const f=front();f.style.transition='none';f.style.transform='translateX('+dx+'px) rotate('+(dx/22)+'deg)';});
  const end=()=>{if(!drag)return;drag=false;if(lock!=='x')return;
    if(dx<-60)next();else if(dx>60)back();else{const f=front();f.style.transition='transform .25s';f.style.transform='none';}
    setTimeout(()=>{V._dkDragged=false;},60);};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('click',e=>{if(V._dkDragged)return;const f=front();if(e.target===st||(f&&!f.contains(e.target)&&e.target.closest('.dk-card')))next();});
}

function _tourEnd(t,m){S.tourDone=true;save();if(t){t.classList.add('out');setTimeout(()=>t.remove(),450);}
  if(m){m.querySelectorAll('.tour-dim').forEach(e=>e.classList.remove('tour-dim'));m.classList.remove('tour-iso');m.style.transform='';m.classList.add('tour-grow');m.classList.remove('tour-mini');setTimeout(()=>m.classList.remove('tour-grow'),800);}}
// Fade everything in the hub except the part (and the boxes that hold it)
function _tourIsolate(m,el){m.querySelectorAll('.tour-dim').forEach(e=>e.classList.remove('tour-dim'));if(!el)return;
  let n=el;while(n&&n!==m){const p=n.parentElement;if(!p)break;[...p.children].forEach(c=>{if(c!==n)c.classList.add('tour-dim');});n=p;}}
function hubTour(i){
  const HUB_TOUR=(typeof _isLite==='function'&&_isLite())?HUB_TOUR_LITE:HUB_TOUR_PRO;
  const m=document.querySelector('main.hub');if(!m){S.tourDone=true;save();return;}
  let t=document.querySelector('.tour');
  if(!t){t=document.createElement('div');t.className='tour tour2';t.innerHTML='<div class="tour-top"><span><b>GROUND</b> · A QUICK TOUR</span><button class="tour-skip">Skip</button></div><img class="tour-k" alt=""><div class="tour-bub"><b></b><p></p></div><div class="tour-foot"><div class="tour-dots">'+HUB_TOUR.map(()=>'<i></i>').join('')+'</div><button class="tour-next">Next</button></div>';
    document.body.appendChild(t);m.classList.add('tour-mini');
    t._img={};HUB_TOUR_PRO.concat(HUB_TOUR_LITE).forEach(x=>{const im=new Image();im.src=(typeof ART!=='undefined'?ART:'art/')+'kpose/'+x.pose+'.webp';t._img[x.pose]=im;});
    t.querySelector('.tour-skip').addEventListener('click',()=>_tourEnd(t,m));}
  const st=HUB_TOUR[i];if(!st){_tourEnd(t,m);return;}
  const el=st.sel?document.querySelector(st.sel):null;if(st.sel&&!el){_tourEnd(t,m);return;}
  const last=i===HUB_TOUR.length-1;
  t.querySelectorAll('.tour-dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
  const nx=t.querySelector('.tour-next');nx.textContent=last?'Got it':i===0?'Show me':'Next';nx.onclick=()=>{if(last)_tourEnd(t,m);else hubTour(i+1);};
  const k=t.querySelector('.tour-k'),bub=t.querySelector('.tour-bub');k.classList.add('hide');bub.classList.add('hide');
  const W=window.innerWidth,H=window.innerHeight,cw=Math.min(W,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-w'))||430),cl=(W-cw)/2;
  // K and the text box come first; the featured part fades in after them
  const first=!m.classList.contains('tour-wait')&&!t._started;t._started=true;
  m.classList.add('tour-wait');
  clearTimeout(t._tw);clearTimeout(t._tw2);
  t._tw=setTimeout(()=>{
  // Lift the part out: measure it in the real hub, then move and scale the whole hub so the part lands centre stage
  const keepT=m.style.transition;m.style.transition='none';
  if(el){
    const keep=m.style.transition;m.style.transition='none';const tf=m.style.transform;m.style.transform='none';m.classList.remove('tour-mini');
    const M=m.getBoundingClientRect(),R=el.getBoundingClientRect();m.classList.add('tour-mini');m.style.transform=tf;void m.offsetWidth;m.style.transition=keep;
    const maxW=cw-48,maxH=H*.36;let sc=Math.min(st.fit||1,maxW/R.width,maxH/R.height);
    const cx=R.left-M.left+R.width/2,cy=R.top-M.top+R.height/2;
    if(st.sel==='#dk-deck')sc=Math.min(sc,(H*.30)/R.height);
    const Dx=st.pose==='left'?cl+cw*.38:cl+cw/2,Dy=st.pose==='squat'?H*.52:st.sel==='#dk-deck'?H*.27:H*.34;
    m.classList.add('tour-iso');m.style.transformOrigin='0 0';m.style.transform='translate('+(Dx-M.left-sc*cx)+'px,'+(Dy-M.top-sc*cy)+'px) scale('+sc+')';
    _tourIsolate(m,el);
  }else{m.classList.remove('tour-iso');m.style.transform='';m.style.transformOrigin='';_tourIsolate(m,null);}
  void m.offsetWidth;m.style.transition=keepT;
  {
    const r=el?el.getBoundingClientRect():m.getBoundingClientRect();
    k.src=(typeof ART!=='undefined'?ART:'art/')+'kpose/'+st.pose+'.webp';bub.querySelector('b').textContent=st.t;bub.querySelector('p').textContent=st.b;
    const kw=Math.min(150,cw*.38),kh=kw*540/480;let kx,ky;
    // Welcome and the deck: the part on top, then K and the text box side by side underneath, never on top of it
    if(!el||st.sel==='#dk-deck'){kx=cl+8;ky=Math.min(r.bottom+12,H-kh-92);}
    else if(st.pose==='squat'){kx=r.left+r.width*.6-kw/2;ky=r.top-kh+3;}
    else if(st.pose==='left'){kx=Math.min(r.right+6,cl+cw-kw-4);ky=r.top+r.height/2-kh*.24;}
    else{kx=Math.max(cl+6,r.left-kw*.78);ky=r.bottom+4;}
    Object.assign(k.style,{width:kw+'px',left:kx+'px',top:ky+'px'});
    // bubble: below the part when there is room, else beside K
    bub.style.width=(cw-32)+'px';const bh=bub.offsetHeight||120;let bx=cl+16,by;
    if(!el||st.sel==='#dk-deck'){bub.style.width=(cw-kw-16)+'px';bx=kx+kw-4;by=ky+Math.max(0,(kh-(bub.offsetHeight||bh))*.35);}
    else if(st.pose==='squat')by=r.bottom+18;
    else by=Math.max(r.bottom,ky+kh)+14;
    by=Math.max(70,Math.min(by,H-(bub.offsetHeight||bh)-100));
    Object.assign(bub.style,{left:bx+'px',top:by+'px'});
    const pre=t._img&&t._img[st.pose];const show=()=>{k.classList.remove('hide');bub.classList.remove('hide');t._tw2=setTimeout(()=>m.classList.remove('tour-wait'),first?700:520);};
    (pre&&pre.decode?pre.decode():Promise.resolve()).then(()=>k.decode?k.decode():0).catch(()=>{}).then(show);
  }
  },first?60:280);
}

function codeFieldHtml(id,sec){return '<div class="inline-in"><label class="lab" for="'+id+'" style="position:absolute;left:-9999px">Code</label><input class="inp code" id="'+id+'" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="GRD-XXXX-XX" maxlength="11"><button class="btn '+(sec?'btn-sec':'btn-pri')+'" data-codeuse="'+id+'">Use</button></div><div id="'+id+'-msg"></div>';}
function wireCodeField(root,id,after){
  const inp=root.querySelector('#'+id),btn=root.querySelector('[data-codeuse="'+id+'"]'),msg=root.querySelector('#'+id+'-msg');
  if(!inp||!btn)return;
  inp.addEventListener('input',()=>{const n=inp.value.toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/^GRD/,'').slice(0,6);inp.value='GRD'+(n.length?'-'+n.slice(0,4):'')+(n.length>4?'-'+n.slice(4):'');inp.classList.remove('ok','bad');msg.innerHTML='';});
  inp.addEventListener('focus',()=>{if(!inp.value)inp.value='GRD-';});
  const use=async()=>{
    const code=inp.value.trim();if(!/^GRD-[0-9A-Z]{4}-[0-9A-Z]{2}$/.test(code)){inp.classList.add('bad');msg.innerHTML='<div class="note err" role="alert" style="margin-top:10px">'+ic('warn','s')+'<div><b>I don’t recognize that code.</b><span>Check each letter and try again.</span></div></div>';return;}
    btn.disabled=true;btn.textContent='…';
    const r=await redeemCode(code);
    btn.disabled=false;btn.textContent='Use';
    if(r.ok){inp.classList.add('ok');msg.innerHTML='<div class="note ok" role="status" style="margin-top:10px">'+ic('check','s')+'<div><b>Code accepted.</b><span>'+(r.days?'Ground Pro for '+r.days+' days. Enjoy it.':r.sessions+' practice sessions added. Enjoy them.')+'</span></div></div>';if(after)setTimeout(after,900);return;}
    inp.classList.add('bad');
    const R={used:['This code is already used on another phone.','Each code works on one phone. If it’s yours, message me.','err'],expired:['This code has ended.','Message me and I’ll send you a new one.','warn'],not_found:['I don’t recognize that code.','Check each letter and try again.','err']};
    const x=R[r.reason]||(/^server|fetch/.test(r.reason)?['Couldn’t check the code.','Check your connection and try again.','warn']:R.not_found);
    if(r.reason==='expired'){inp.classList.remove('bad');inp.style.border='1.5px solid var(--warn)';}
    msg.innerHTML='<div class="note '+x[2]+'" role="alert" style="margin-top:10px">'+ic(x[2]==='warn'?'clock':'warn','s')+'<div><b>'+escHtml(x[0])+'</b><span>'+escHtml(x[1])+'</span></div></div>';
  };
  btn.addEventListener('click',use);inp.addEventListener('keydown',e=>{if(e.key==='Enter')use();});
}

const DESK_ROUTES={
  advice:{t:'Get K’s advice',ic:'info',p:'p-lav',say:'You want to know what to do.'},
  reply:{t:'Read it with K',ic:'reply',p:'p-lav',say:'You have a message to answer.'},
  practice:{t:'Practice it',ic:'talk',p:'p-teal',say:'You have a conversation coming up.'},
  pitch:{t:'Build my pitch',ic:'pitch',p:'p-org',say:'You have something to present.'},
  quick:{t:'Quick answer',ic:'quick',p:'p-pink',say:'You need a sharp answer to one question.'}
};
// Offline guess: good enough to route when K can't be reached
function _deskGuess(text){
  const s=String(text||'').toLowerCase();
  const quoted=/[“"「]/.test(text)||/^(hi|hello|dear|hey)\b/.test(s)||/\b(replied|messaged|emailed|texted|sent me|wrote|asked me)\b/.test(s);
  let scen='conflict';
  if(/interview/.test(s))scen='interview';
  else if(/\b(price|discount|budget|cheaper|rate|quote|invoice|pay)\b/.test(s))scen='bargain';
  else if(/\b(boss|manager|team lead|supervisor)\b/.test(s)&&/(disagree|wrong|mistake|push back|deadline|decid|wants us|plan)/.test(s))scen='disagree';
  else if(/\b(feedback|tell (him|her|them))\b/.test(s))scen='feedback';
  else if(/\b(say no|turn down|decline|favor|favour|extra work)\b/.test(s))scen='sayno';
  else if(/\b(meeting|update|stand-?up)\b/.test(s))scen='meeting';
  else if(/\b(party|date|networking|event|stranger|small talk)\b/.test(s))scen='smalltalk';
  else if(/\b(introduce|introduction)\b/.test(s))scen='intro';
  else if(/\b(client)\b/.test(s))scen='difficult';
  let route='practice';
  const asks=/(what should i|what do i|how do i|how should i|best way|don.?t know|not sure|help me|advice|messed up|screwed up|made a mistake|my fault|went wrong|angry|upset|furious|disappointed)/.test(s);
  if(asks&&!quoted)route='advice';
  else if(/\b(pitch|presentation|present|investors|demo day|keynote|speech)\b/.test(s))route='pitch';
  else if(quoted)route='reply';
  const who=/\b(client|customer)\b/.test(s)?'client':/\b(interview)\b/.test(s)?'interviewer':/\b(boss|manager|colleague|teammate|co-?worker)\b/.test(s)?'boss':'new';
  const want=/\b(price|discount|cheaper|budget)\b/.test(s)?'price':/\b(no|decline|can.?t)\b/.test(s)?'no':/\b(time|later|deadline)\b/.test(s)?'time':/\b(mistake|sorry|wrong)\b/.test(s)?'fix':'well';
  return {route,scenario:scen,why:DESK_ROUTES[route].say,who:'',moment:'',line:'',rwho:who,rwant:want,reply_text:''};
}
async function deskRead(){
  const ta=document.getElementById('desk-text');const text=String((ta&&ta.value)||V.deskText||'').trim();
  if(text.length<8){showToast('Tell K a little more first.');if(ta)ta.focus();return;}
  V.deskText=text;V.deskErr=null;
  let r=null;
  if(_aiOn()){
    V.deskBusy=true;V.deskRoute=null;go('askk');
    const scenes=Object.keys(TT_REAL).map(k=>k+' ('+TT_REAL[k].name+')').join(', ');
    const sys='You are the front desk of a communication coaching app. A person describes a situation. Decide which tool helps them most, and fill it in.\n'+
      'Tools: "advice" (they are asking what to do, something has gone wrong, emotions are high, or they need a plan before any words: choose this whenever they ask for guidance rather than a draft or a rehearsal; it is the safe default), "reply" (they received a message and need to answer it: the text contains or describes what someone said to them, and the answer is written), "practice" (a spoken conversation is coming up or keeps happening: they want to rehearse it with K playing the other person), "pitch" (they must present or pitch something to a group or a decision maker), "quick" (they want a strong short answer to one question they expect to be asked).\n'+
      'Practice scenarios (pick the closest key): '+scenes+'.\n'+
      'Reply with JSON only, no markdown: {"route":"advice|reply|practice|pitch|quick","why":"one short sentence to them, starting with You, saying what you understood and what kind of problem it really is when that is not what it looks like (for example a communication problem, not a skills problem; a timing problem, not a price problem), under 22 words","scenario":"a practice key","who":"who they will talk to: name or role, who they are, one telling detail, under 14 words","moment":"where they are and what is at stake, under 30 words","line":"the first thing the other person will say, spoken, in curly quotes, under 25 words","reply_text":"for reply: the message they received, copied word for word if it is in their text, else empty","rwho":"client|boss|interviewer|new","rwant":"price|no|time|more|fix|well","pitch_line":"for pitch: what they are pitching, in one line","pitch_room":"client|investors|boss|panel","question":"for quick: the question they expect, in curly quotes"}';
    try{const raw=await callCoach(sys,'THEIR SITUATION:\n'+text,{json:true,maxTokens:420,featureId:'desk-route',noLang:true});r=_jsonFrom(raw);if(!DESK_ROUTES[r.route])throw new Error('K gave an answer the app couldn’t use');}catch(e){V.deskBusy=false;V.deskErr=e;render();return;}
    V.deskBusy=false;render();
  }
  if(!r)r=_deskGuess(text);
  if(r.route==='practice'&&!TT_REAL[r.scenario])r.scenario=_deskGuess(text).scenario;
  V.deskRoute=r;
  if(r.route==='advice'){deskGo('advice');return;}
  if(V.view!=='askk')go('askk');else render();
}
// Ask K: a full page. While K reads it, a full loading screen; then what K heard and where to go.

  let h='<main class="scr p-blue askk-scr">'+gBar('Ask K','hub');
  const r=V.deskRoute;
  if(V.deskErr){h+=renderAIError(V.deskErr,'askk-retry')+'<div class="push"></div>';}
  else if(V.deskBusy||!r){h+=kWritingHtml('K is reading it…','Working out what will help most.');}
  else{const main=DESK_ROUTES[r.route]||DESK_ROUTES.practice;
    const scName=r.route==='practice'&&TT_REAL[r.scenario]?TT_REAL[r.scenario].name:'';

    h+='<div class="askk-body"><div class="g-block askk-heard"><div class="g-k">'+kav()+'<span class="g-kick">Here’s what I heard</span></div><div class="askk-why">'+escHtml(_clean(r.why)||main.say)+'</div>'+(scName?'<p class="askk-sc">'+escHtml(scName)+(r.who?' · '+escHtml(_clean(r.who)):'')+'</p>':'')+'</div>'+
      '<div class="askk-you"><small>You wrote</small><p>'+escHtml(_kShort(V.deskText||'',220))+'</p></div></div>';

  h+='</main>';
  app.innerHTML=h;
  const rt=app.querySelector('[data-act="askk-retry"]');if(rt)rt.addEventListener('click',()=>{V.deskErr=null;deskRead();});
  const m=app.querySelector('[data-act="askk-main"]');if(m)m.addEventListener('click',()=>deskGo(V.deskRoute.route));
  app.querySelectorAll('[data-desk]').forEach(b=>b.addEventListener('click',()=>deskGo(b.dataset.desk)));
  const body=app.querySelector('.askk-body');if(body)_fillZoom([body],()=>document.scrollingElement.scrollHeight<=window.innerHeight,1.3);
}

  const scName=r.route==='practice'&&TT_REAL[r.scenario]?TT_REAL[r.scenario].name:'';

  openSheet(h,{wire:sh=>sh.querySelectorAll('[data-desk]').forEach(b=>b.addEventListener('click',()=>{closeSheet();deskGo(b.dataset.desk);}))});

function deskGo(route){
  const r=Object.assign({},V.deskRoute||{}),text=V.deskText||'';
  if(route==='advice'){V.adv={text,data:null,loading:true,err:null,scen:TT_REAL[r.scenario]?r.scenario:_deskGuess(text).scenario};go('advice');deskAdvice();return;}
  if(route==='reply'){
    if(!_canReply()){openLimitSheet('reply');return;}
    const msg=_clean(r.reply_text)&&r.reply_text.length>6?r.reply_text:text;
    RP={step:'paste',text:msg,who:RP_WHO.some(w=>w[0]===r.rwho)?r.rwho:'client',want:RP_WANT.some(w=>w[0]===r.rwant)?r.rwant:'well',draft:null,loading:false,err:null,tone:null,guard:null};
    V._rpRestore=false;go('reply');rpDraft();return;
  }
  if(route==='practice'){
    if(typeof PLAN_ON!=='undefined'&&PLAN_ON){if(_practicesLeft()<=0){openPlanSheet('practice');return;}}else if(!_canStartSession()){openLimitSheet('month');return;}
    let k=TT_REAL[r.scenario]?r.scenario:_deskGuess(text).scenario;
    RW.scenario=k;RW.goal=_rwGoalOf(k).k;RW.tougher=false;_rwResetConvo();RW.fromReply=null;RW.fromCase=null;RW.prevFix='';
    RW.context=text.slice(0,400);
    const _n=x=>String(x||'').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,' ').trim();
    {const nl=_n(r.line),nt=_n(text);if(nl.length>8&&nt.length>8&&(nt.includes(nl)||nl.includes(nt.slice(0,40))))r.line='';}
    const line=_clean(r.line),fromK=!!(line&&r.who);
    // No scene from K (offline): build it from their own words, never a random one
    const OPEN={disagree:'“You wanted a word?”',conflict:'“Hey, what’s up?”',feedback:'“You wanted to talk?”',sayno:'“So, can you take it on?”',bargain:'“So, what’s your price?”',ground:'“Can you do any better than that?”',difficult:'“We need to talk about this.”',proposal:'“So, what do you propose?”',interview:'“So, tell me about yourself.”',intro:'“So, what do you do?”',meeting:'“Okay, you’re up.”',tough:'“So, what happened?”',smalltalk:'“Hi! How do you know the host?”',pitch:'“Okay, you have a minute. Go.”'};
    if(!(line&&r.who)){r.who=RW_ROLE[k]||'The other person';r.moment=_kShort(text,200);r.line=OPEN[k]||'“So, what’s on your mind?”';}
    {const line=_clean(r.line);
      RW.question=/^[“"]/.test(line)?line:'“'+line+'”';RW.source='desk';
      _rwCast(_rwIsClient(k)?{c:_clean(r.who),job:_clean(r.moment)||_kShort(text,160),pos:(k==='bargain'||k==='ground'||k==='proposal')&&S.rwPrice?S.rwPrice+(S.rwLowest?'. Lowest you’ll accept: '+S.rwLowest:''):''}:{who:_clean(r.who),moment:_clean(r.moment)});
      if(fromK){RW.who=_clean(r.who)+(_clean(r.moment)?'. '+_clean(r.moment):'');if(!['bargain','ground','proposal'].includes(k))RW.secret=null;}
      RW.phase='brief';go('real');
    }
    return;
  }
  if(route==='pitch'){
    PI.phase='setup';PI.line=_clean(r.pitch_line)||text.slice(0,140);
    if(PI_ROOMS.some(x=>x[0]===r.pitch_room))PI.room=r.pitch_room;
    go('pitch');return;
  }
  if(route==='quick'){
    const q=_clean(r.question);
    if(q){QA.q=/^[“"]/.test(q)?q.replace(/^[“"]|[”"]$/g,''):q;QA.goal=null;QA.phase='q';QA.take=null;QA.notes=null;QA.strong=null;}
    go('quick');return;
  }
}

// ── K's advice: read the situation, then what to do, what to say, the principle ──
async function deskAdvice(){
  const A=V.adv;if(!A)return;
  if(!_aiOn()){A.loading=false;A.data=null;A.err='offline';render();return;}
  const cases=CASES.map(c=>c.id+': '+c.title+' (principle: '+c.principle+')').join('\n');
  const sys=K_VOICE+'\nSomeone has brought you a real situation and wants to know what to do. Coach them the way you coach: calm, direct, warm, practical. No blame, no lecture, no therapy talk.\n\n'+K_CLIENT_VIEW+'\n'+K_CONFLICT_VIEW+'\n'+K_PEOPLE_VIEW+'\n'+K_PLAIN+
    '\n\nThe library cases and their principles (use the closest one if it truly fits):\n'+cases+'\n'+TECH_LIST+
    (A.asked?'':'\n\nIf you do not know enough to give useful advice (what actually happened, who is involved, what is at stake), do not guess and do not give generic advice: reply with JSON {"need":"one short, specific question to them, under 20 words"} instead, and nothing else.')+
    '\n\nOtherwise reply with JSON only, no markdown: {"read":"what is really going on and what matters most right now, 1–2 sentences, said to them","steps":["3 short steps in order, each starting with a verb, each under 20 words"],"say":"the first words they could actually say or write to open, spoken, under 40 words","avoid":"the one thing not to do, under 18 words","principle":"the principle underneath, 3–8 plain words","case":"the closest library case id, or empty","next":"practice if a spoken conversation is still ahead and worth rehearsing; reply if they need to write a message; none if neither fits (for example the moment has passed and what they need is a plan)","ask":"one short question you would ask them to help better, if something important is missing; else empty","practice":{"scenario":"if next is practice: the closest practice key from: '+Object.keys(TT_REAL).join(', ')+'","who":"who they will talk to, under 12 words","moment":"what is at stake in that conversation, under 25 words","line":"the first thing that person will say to them, spoken, in curly quotes, under 25 words. Never the user\u2019s own words"}}';
  try{
    const raw=await callCoach(sys,'THEIR SITUATION:\n'+A.text+nbContext('real'),{json:true,maxTokens:700,featureId:'desk-advice'});
    let j;try{j=_jsonFrom(raw);}catch(_){j=_jsonFrom(await callCoach(sys,'THEIR SITUATION:\n'+A.text+'\n\nReply with valid JSON only.',{json:true,maxTokens:700,featureId:'desk-advice',grace:true}));}
    if(j&&j.need&&!A.asked&&!j.read){A.need=_clean(j.need);A.loading=false;if(V.view==='advice')render();return;}
    const steps=(Array.isArray(j.steps)?j.steps:[]).map(_clean).filter(Boolean).slice(0,4);
    if(!j.read||!steps.length)throw new Error('Unexpected answer');
    const px=j.practice&&typeof j.practice==='object'&&TT_REAL[j.practice.scenario]?{scenario:j.practice.scenario,who:_clean(j.practice.who),moment:_clean(j.practice.moment),line:_clean(j.practice.line)}:null;
    A.data={read:_clean(j.read),steps,say:_clean(j.say),avoid:_clean(j.avoid),principle:_clean(j.principle),case:_case(j.case)?j.case:'',next:['reply','practice','none'].includes(j.next)?j.next:'none',ask:_clean(j.ask||''),px};A.thread=[];
    nbAdd({cat:'reply',title:_kShort(A.text,80),sub:'K’s advice',fix:A.data.principle,worked:'',fb:'',_noNote:true});
  }catch(e){A.err=e;}
  A.loading=false;if(V.view==='advice')render();
}
function _adviceCases(scen){
  const m=CASES.filter(c=>c.practice&&c.practice.scen===scen);
  return (m.length?m:CASES.filter(c=>c.cat===(_rwGoalOf(scen)||{}).k)).slice(0,2);
}

    h+='<div class="stack" style="gap:10px">'+cs.map(c=>{const cc=_caseCat(c.cat);return '<button class="lib-row '+cc.c+'" data-case="'+c.id+'"><span class="lib-dot"></span><span class="lib-t"><small>'+escHtml(cc.t)+'</small><b>'+escHtml(c.title)+'</b><span>'+escHtml(c.principle)+'</span></span>'+ic('chev','s')+'</button>';}).join('')+'</div>';
    h+='<div class="push"></div>'+(A.err!=='offline'?gCta('Try again','adv-retry'):'');
  }
  h+='</main>';
  app.innerHTML=h;wireCommon(app);
  app.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>openCase(b.dataset.case)));
  const on=(s,f)=>{const el=app.querySelector(s);if(el)el.addEventListener('click',f);};

// ── Follow-ups with K about the same situation ──
function openAdvFollow(){
  const A=V.adv;if(!A||!A.data)return;A.thread=A.thread||[];
  const draw=sh=>{
    const d=A.data;let h='<div class="g-k">'+kav()+'<span class="g-kick">Ask K</span></div><div class="af-th">';

    sh.innerHTML='<div class="grab"></div>'+h;

        const ctx='THEIR SITUATION:\n'+A.text+'\n\nYOUR ADVICE:\n'+d.read+'\nSteps: '+d.steps.join(' / ')+(d.say?'\nSay first: '+d.say:'')+(d.ask?'\nYou asked them: '+d.ask:'')+'\n\nTHE CHAT SO FAR:\n'+A.thread.map(x=>'Them: '+x.q+(x.a?'\nYou: '+x.a:'')).join('\n')+'\n\nYour reply:';

function _caseForMe(){
  const ks=_sugKeys();if(!ks.length)return null;
  const seen=_casesSeen(),st=_P().stage;
  // What they said is hard comes first; their career stage fills in once those are read
  let ids=[];ks.forEach(k=>SUG_MAP[k].cases.forEach(id=>{if(!ids.includes(id))ids.push(id);}));
  const extra=st==='freelance'?{cat:'client',why:'for freelancers'}:(st==='student'||st==='jobhunt'||st==='switch')?{cat:'job',why:'for getting in'}:null;
  const d=new Date();const n=d.getFullYear()*400+d.getMonth()*31+d.getDate();
  let pool=ids.map(_case).filter(c=>c&&!seen[c.id]);
  if(!pool.length&&extra){const ex=CASES.filter(c=>c.cat===extra.cat&&!seen[c.id]);if(ex.length){const c=ex[n%ex.length];return {c,why:extra.why};}}
  if(!pool.length)pool=ids.map(_case).filter(Boolean);
  const c=pool[n%pool.length];
  const k=ks.find(k=>SUG_MAP[k].cases.includes(c.id))||ks[0];
  return {c,why:'for '+SUG_MAP[k].t};
}

// HELP ME REPLY: paste their message, K drafts what to say, shows why line by
// line with a technique on each, and refuses to write a yes below your lowest.
// Steps: paste → thinking → reply → why → (under-lowest guard)
// ═══════════════════════════════════════════════════════════════════════════
const RP_WHO=[['client','Client'],['boss','Boss or colleague'],['interviewer','Interviewer'],['new','Someone new']];
const RP_WANT=[['price','Keep my price'],['no','Say no politely'],['time','Buy time'],['more','Ask for more'],['fix','Fix a mistake'],['well','Just reply well']];
let RP={step:'paste',text:'',who:'auto',want:'auto',draft:null,loading:false,err:null,tone:null,guard:null};
function _rpLowest(){return _money(S.rwLowest)||null;}
function _rpAskedPrice(text){
  // the biggest yuan-ish number in their message, if any
  const nums=(String(text||'').match(/(?:¥|rmb|yuan|\$|usd|€|£)?\s?\d{1,3}(?:[,，]\d{3})+(?:\.\d+)?|(?:¥|rmb|\$|€|£)\s?\d+(?:\.\d+)?|\d+\s?(?:k|K)\b|\d{3,}\s?(?:yuan|rmb|元|块)/g)||[]);
  const vals=nums.map(s=>{let v=parseFloat(s.replace(/[^\d.]/g,''));if(/k$/i.test(s.trim()))v*=1000;return v;}).filter(v=>v>0);
  return vals.length?Math.max(...vals):null;
}
function _rpSys(){
  const wantTxt={price:'keep their price (and give something other than money if they must give)',no:'say no politely and keep the relationship',time:'buy time without sounding evasive',more:'ask for more money or more time, with a reason',fix:'own a mistake, fix it, and keep the client',well:'reply well: warm, clear, and short'}[RP.want]||'respond well: work out from the message (and what you know about them) what they most need, whether that is keeping their price, saying no, buying time, asking for more, owning a mistake or simply a good reply';
  const whoTxt={client:'a client',boss:'their boss or a colleague',interviewer:'an interviewer or recruiter',new:'someone they have just met or are getting to know'}[RP.who]||'someone (work out from the message who it is: a client, their boss, a colleague, an interviewer or someone new)';
  const ctx=[S.rwField?'Their field: '+S.rwField:'',S.rwPrice?'Their price: '+S.rwPrice:'',S.rwLowest?'The lowest they will accept: '+S.rwLowest:''].filter(Boolean).join('\n');
  return K_VOICE+'\n\nThe user has received a message from '+whoTxt+' and wants to '+wantTxt+'. Write the reply they should send, in their voice, first person, ready to paste into any chat or email.\n'+
    (RP.who==='client'||RP.who==='auto'?K_CLIENT_VIEW+'\n'+(RP.who==='auto'?K_PEOPLE_VIEW+'\n':''):RP.who==='interviewer'?K_INTERVIEW_VIEW+'\n':RP.who==='new'?K_PEOPLE_VIEW+'\n':'')+K_JUDGE+'\n'+K_PLAIN+'\n'+(ctx?'\nWhat you know about the user:\n'+ctx+'\n':'')+
    '\nRULES FOR THE DRAFT: 40–90 words, sounds like a real person typing, no greeting line or sign-off, no bullet points, no headings. Warm first, then firm. If a price is involved, the draft keeps the user’s price unless they chose otherwise; if it gives something, it gets something back in the same breath. Never invent facts the user did not give (no made-up dates, names or numbers beyond those in the message or context). If the message asks for a price below the lowest the user will accept, the draft must hold the price and offer a smaller scope instead; never say yes to it.\n'+
    'Also explain it line by line: pick 3 to 4 key lines of the draft (each "quote" must be an EXACT substring of the draft, copied character for character), name the technique behind each from this list only: '+Object.values(TECHNIQUES).map(t=>t.title).join('; ')+', and say why in one plain sentence.\n'+
    (RP.asked?'':'If the user only describes a situation (no message they received) and you do not know enough to write a good message (what happened, what was said, who it is to), do not guess and do not write a generic draft: reply with JSON {"need":"one short, specific question to the user, under 20 words"} instead. Otherwise:\n')+'Reply with JSON only, no markdown: {"read":"what is really going on in their message and the move you recommend, 1–2 short sentences said to the user, like an advisor (never just a summary)","draft":"…","give":"what the user gives in this reply, 2–5 words (or \\"Nothing\\")","get":"what the user gets back, 2–5 words","why":[{"quote":"exact substring of the draft","technique":"title from the list","why":"one sentence"}],"below_lowest":true|false}';
}
async function rpDraft(tone){
  if(!RP.text.trim())return;
  if(!_canReply()){openLimitSheet('reply');return;}
  RP.loading=true;RP.err=null;RP.step='think';RP.tone=tone||null;render();
  const lowest=_rpLowest(),asked=_rpAskedPrice(RP.text);
  const guard=!!(lowest&&asked&&asked<lowest&&(RP.who==='client'||RP.who==='auto'))&&tone!=='yes';
  let msg='THEIR MESSAGE:\n'+RP.text.trim()+(tone?'\n\nADJUST: the previous draft was "'+RP.draft.draft+'". Write it again '+({warmer:'warmer: more human, more acknowledgement, same position',firmer:'firmer: fewer softeners, the position stated plainly, still polite',shorter:'shorter: cut it to about half, keep the position and the ask',yes:'as a yes: the user has decided to accept their number. Write the best version of saying yes that still gets something back (a deposit, faster payment, a smaller scope), without sulking'})[tone]+'.':'')+(guard?'\n\nNOTE: they are asking for about '+_fmtMoney(asked)+', which is below the user’s lowest ('+S.rwLowest+'). Hold the price and offer a smaller scope.':'')+nbContext('reply');
  try{
    const raw=await callCoach(_rpSys(),msg,{json:true,maxTokens:850,featureId:'reply-draft'});
    let j;try{j=_jsonFrom(raw);if(j&&j.need&&!RP.asked&&!tone){RP.need=_clean(j.need);RP.step='ask';RP.loading=false;render();return;}if(String(j.draft||'').trim().length<20)throw 0;}
    catch(_){const raw2=await callCoach(_rpSys(),msg+'\n\nYour last answer could not be read. Reply again with valid JSON only, in the exact format asked.',{json:true,maxTokens:850,featureId:'reply-draft',grace:true});j=_jsonFrom(raw2);}
    const draft=String(j.draft||'').trim();if(draft.length<20)throw new Error('short');
    const why=(Array.isArray(j.why)?j.why:[]).map(w=>({quote:String(w.quote||'').trim(),technique:String(w.technique||'').trim(),why:String(w.why||'').trim()})).filter(w=>w.quote&&draft.toLowerCase().includes(w.quote.toLowerCase())).slice(0,4);
    RP.draft={read:_clean(j.read||'').slice(0,320),draft,give:String(j.give||'').slice(0,40),get:String(j.get||'').slice(0,40),why,below:!!j.below_lowest||guard,asked,lowest};
    RP.guard=guard?{asked,lowest}:null;

    h+='<div class="push"></div><p class="small center-t">About 10 seconds. You can leave; it’ll be here.</p>';
  }else if(st==='ask'){

    if(_isLimitErr(RP.err)){h+='<div class="center"><span class="badge g">'+ic('clock','l')+'</span><h2 class="h2" style="font-size:19px;margin-top:4px">That’s today’s replies done.</h2><p class="sub" style="max-width:280px">You get more tomorrow, from midnight. Your message is saved, so it’ll be here.</p></div><div class="stack"><button class="btn btn-pri" data-act="to-practice">Practice this conversation instead</button><button class="btn-text" data-go="settings">Have a code? Enter it in Settings</button></div>';}

  on('[data-act="rp-back"]',()=>{RP.step='paste';render();});
  app.querySelectorAll('[data-go="rp-back"]').forEach(b=>{b.removeAttribute('data-go');b.addEventListener('click',()=>{RP.step='paste';render();});});

const RW_STANDARD={
  interview:'INTERVIEW ANSWER. The interviewer is testing judgment, attitude and how the candidate thinks; the question is how they find out. A real example (situation → what I did → result) is the strongest evidence. A hypothetical is a valid answer when the speaker hasn’t lived the situation yet: judge it on its own terms. Never mark an answer down just for being hypothetical; suggest a real or adjacent example (school, side project) as the next level up. A skilled bridge or reframe that still gives the interviewer what they need is a strength, not a dodge. Attitude outranks structure: anger, blame, or badmouthing a team is the first thing to flag if it appears.',
  pitch:'ELEVATOR PITCH. A strong pitch: a hook in the first sentence, the problem the listener cares about, what’s offered, one proof point, and a clear ask at the end. It must fit the time; cutting is a skill here. Leading with a story or a reframe instead of the product is fine if the ask still lands.',
  intro:'SELF-INTRODUCTION. A strong introduction: name and what you do in one line, one memorable specific detail people can repeat, and a reason for the listener to follow up, pitched to the room described. If the listener is a potential client, also judge it as a client introduction: what you do FOR someone like them (the result, not the job title), one specific proof, and an easy next step; no apologizing for being new.',
  smalltalk:'CONVERSATION (small talk through to getting to know someone). The goal is a real connection, not a performance. A strong reply answers genuinely and briefly, offers one specific detail the other person can pick up, and shows real interest back: a question that opens things up (how, what, what got you into) rather than one that ends in yes or no, ideally built on something the other person actually said. Listening is the skill. Brevity is a strength: answer, add a hook, hand it back. Flag: interview-style question lists, talking only about themselves, one-word dead ends, trying too hard to impress, heavy topics too early, anything that pressures the other person. Never coach pickup lines or tricks. Judge it as one turn in a conversation, not a speech. In ONE THING, the better line should be short enough to say in one breath.',
  meeting:'SPEAKING UP IN A MEETING. Colleagues are busy; the speaker earns attention by being useful fast. A strong contribution puts the point or recommendation in the first sentence, gives one reason or piece of evidence, and says what should happen next (a decision, a next step, an owner). Disagreeing is welcome when it’s about the idea, not the person, and offers an alternative. Flag long context before the point, hedging that hides the view, apologizing for speaking, and carrying on after the point has landed.',
  tough:'TOUGH QUESTION. A strong reply stays calm and acknowledges the concern without getting defensive. The speaker doesn’t have to answer it head-on: acknowledge, satisfy the core of the concern, then move to the ground they want to stand on is a high-level technique, and should be recognized as one. Flag the clumsy version: an obvious dodge that leaves the real concern untouched, over-apologizing, defensiveness or rambling. End on a next step.',
  disagree:'DISAGREEING WITH SOMEONE ABOVE YOU (judge it Kian’s way). The speaker is usually paid to do the job, not to win the argument, so the question is whether they read the leverage and picked their moment. A strong reply opens with something genuine (praise or agreement), frames the concern as a question or discussion rather than a challenge, gives one concrete fact, offers an option, and leaves the decision with them; then backs whatever they decide. Pushing back just enough is right; arguing hard once they have decided, or making it about who is right, is a mistake. Staying silent when something matters is also a mistake: never be a pushover. Honest always.',
  conflict:'A CLASH WITH A PEER OR TEAMMATE (judge it Kian’s way). First, did the speaker read the situation: an honest mistake (sort it out calmly) or someone taking advantage (be firmer)? A strong reply starts positive where it can, says plainly what happened and what it cost them, says what they need, and makes sure it won’t happen a second time. If money or something in return fixes the problem, offering it is smart, not weak. No labels or insults, no public explosions unless the speaker clearly holds the leverage. Never coach lying, blaming others or threats.',

const QA_GOAL_LABEL={job:'Job hunting · Interview',work:'At work · Tough question',client:'Clients · Price talk',people:'Meeting people · Conversation'};

function _qaGoals(){const g=(S.goals||[]).filter(k=>QA_BANK[k]);return g.length?g:Object.keys(QA_BANK);}
function _qaPick(shuffle){
  const goals=_qaGoals();const all=[];goals.forEach(g=>QA_BANK[g].forEach(x=>all.push({g,q:x[1],ctx:x[0]})));
  const seen=new Set(_ttSeenList());

// ═══ Ask a good question: a short drill built on Kian's view of questions ═══
const ASK_SCENES=[
  {who:'A senior game composer',what:'just finished a talk on scoring her first big game. She mentioned she rewrote the main theme six times.'},
  {who:'Your teacher',what:'just explained why some melodies sound sad even in a major key. “Any questions?”'},
  {who:'The interviewer',what:'says: “That’s all from us. Do you have any questions for us?” The role is junior designer at a branding studio.'},
  {who:'A new client',what:'wants a logo that feels “premium but friendly” for a tea shop opening in March.'},
  {who:'A founder on a panel',what:'said the hardest part of their first year was letting a friend go.'},
  {who:'Your new manager',what:'in your first one-on-one, says: “So, anything you want to ask me?”'},
  {who:'A photographer you admire',what:'shows a series shot entirely on an old phone, and says the limits made it better.'},
  {who:'A mentor, over coffee',what:'tells you they nearly quit their career at thirty, then changed direction.'}
];
let ASK={i:0,q:'',res:null,loading:false,err:null};
function _askNew(){let i;do{i=Math.floor(Math.random()*ASK_SCENES.length);}while(ASK_SCENES.length>1&&i===ASK.i);ASK={i,q:'',res:null,loading:false,err:null};}
function openAsk(){_askNew();go('ask');}
async function askJudge(){
  const q=(ASK.q||'').trim();if(!q)return;
  const sc=ASK_SCENES[ASK.i];
  if(!_aiOn()){ASK.res={offline:true};render();return;}
  ASK.loading=true;ASK.err=null;render();
  const sys=K_VOICE+'\n'+K_PLAIN+'\nYou judge ONE question someone asked, by Kian’s standard. No question is stupid; the fear of asking is. A good question: comes from genuine curiosity; ties to something the person actually said (shows they listened); can’t be answered by a quick search; is short and open (how, why, what made you); fits the moment and respects the other person’s time. Find what worked first. Be encouraging and specific.\n\nReply with JSON only: {"verdict":"strong|good|weak","worked":"one short sentence on what worked, quoting a few of their words","fix":"one short sentence on the single change that would make it better (empty if strong)","better":"a better version of their question, in their voice, under 25 words"}';
  try{
    const raw=await callCoach(sys,'THE MOMENT: '+sc.who+' '+sc.what+'\n\nTHEIR QUESTION: '+q,{json:true,maxTokens:300,featureId:'ask-q'});
    const j=_jsonFrom(raw);
    ASK.res={verdict:/strong|good|weak/.test(j.verdict)?j.verdict:'good',worked:_clean(j.worked),fix:_clean(j.fix),better:_clean(j.better)};
  }catch(e){ASK.err=e;ASK.res={offline:true};}
  ASK.loading=false;render();
}
function renderAsk(app){
  if(ASK.i==null)_askNew();
  const sc=ASK_SCENES[ASK.i],r=ASK.res;
  let h='<main class="scr p-green">'+gBar('Ask a good question','library');
  h+='<div class="g-block"><div class="g-kick">The moment</div><div class="g-big" style="font-size:22px">'+escHtml(sc.who)+'</div><p style="margin-top:8px;font-size:15px;line-height:1.45;font-weight:500">'+escHtml(sc.what)+'</p></div>';
  if(!r){
    h+='<div class="g-card tight"><div class="g-row top"><span class="t"><b>Your turn</b><span>Ask one question. Something you’d genuinely want to know.</span></span></div></div>';
    h+='<textarea class="ask-in" id="ask-in" rows="3" placeholder="Type your question…">'+escHtml(ASK.q)+'</textarea>';
    h+='<div class="push"></div>'+gCta(ASK.loading?'K is reading it…':'Ask it','ask-go',{disabled:ASK.loading});
    h+='<button class="link case-peek" data-act="ask-new">Different moment</button>';
  }else{
    h+='<div class="g-card"><div class="g-kick">You asked</div><div class="case-line" style="margin-top:6px">“'+escHtml(ASK.q.trim())+'”</div></div>';
    if(r.offline){
      h+='<div class="g-card tight"><div class="g-k">'+kav()+'<b style="font-size:15px">Check it yourself</b></div>'+
        ['Does it tie to something they actually said?','Is it something you genuinely want to know?','Could you answer it with a quick search? (If yes, ask something else.)','Is it short and open: how, why, what made you…?'].map(x=>'<div class="g-row top"><span class="t"><span>'+escHtml(x)+'</span></span></div>').join('')+'</div>';
    }else{
      const V2={strong:'Strong question.',good:'Good question.',weak:'Not there yet.'}[r.verdict];
      h+='<div class="g-card"><div class="g-k">'+kav()+'<b style="font-size:16px">'+V2+'</b></div>'+(r.worked?'<p style="margin-top:10px;font-size:15px;line-height:1.45">'+escHtml(r.worked)+'</p>':'')+(r.fix?'<p style="margin-top:6px;font-size:15px;line-height:1.45;color:var(--ink-2)">'+escHtml(r.fix)+'</p>':'')+'</div>';
      if(r.better&&r.verdict!=='strong')h+='<div class="g-card case-k"><b style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)">Try it like this</b><div class="case-line">'+escHtml(r.better)+'</div></div>';
    }
    h+='<div class="g-chips"><button class="g-chip" data-tech="good-question">Ask a good question</button></div>';
    h+='<div class="push"></div>'+gCta('Next moment','ask-new',{icon:'again'});
    h+='<button class="link case-peek" data-act="ask-retry">Ask this one again</button>';
  }
  h+='</main>';
  app.innerHTML=h;wireCommon(app);
  const ta=app.querySelector('#ask-in');if(ta)ta.addEventListener('input',()=>{ASK.q=ta.value;});
  const on=(s,f)=>{const b=app.querySelector(s);if(b)b.addEventListener('click',f);};
  on('[data-act="ask-go"]',askJudge);
  on('[data-act="ask-new"]',()=>{_askNew();render();});
  on('[data-act="ask-retry"]',()=>{ASK.res=null;ASK.q='';render();});
}

// One screen: tighten step by step if the content is too tall for this phone
function _chFit(app){const m=app.querySelector('main');if(!m)return;
  const over=()=>document.scrollingElement.scrollHeight>window.innerHeight;
  const fit=()=>{let lo=.7,hi=1.35;m.style.setProperty('--k',hi);if(!over())return true;
    for(let n=0;n<8;n++){const mid=(lo+hi)/2;m.style.setProperty('--k',mid);if(over())hi=mid;else lo=mid;}
    m.style.setProperty('--k',lo);return !over();};
  m.classList.remove('ch-nocost','ch-nosub','ch-fill');
  const ok=()=>fit()&&parseFloat(m.style.getPropertyValue('--k'))>=.86;
  if(!ok()){m.classList.add('ch-nosub');if(!ok()){m.classList.add('ch-nocost');fit();}}
  m.classList.add('ch-fill');if(over())m.classList.remove('ch-fill');}
