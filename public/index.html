   feel:'You’re flattered. And a little insulted.',moment:'A famous studio wants you on their project. [[The pay is a fraction of your rate.]] “It’ll look great on your CV.”',
   most:'Saying yes at once because of the name. Or saying no without thinking it through.',
   fails:'Big projects have big teams to feed. Unless you are at the top, the name pays in reputation, not money, and the low rate tends to stick.',
   k:'“I’d love to be part of it. At this budget I can do the main pieces; for the full scope, my rate is X. Which works better for you?”',
   principle:'Weigh the name against the pay, out loud.',
   then:'Decide what the name is worth to you before the call. If you take less, get something back: credit, a reference, a smaller scope.',
   story:{src:'book',t:'Early in his career, a sound designer worked on a game that went on to win a BAFTA. He was paid ten dollars an hour. Twelve years later, people still say “wow” when they hear he worked on it. It was fun. It was also ten dollars an hour.'},
   tech:'give-to-get',
   practice:{scen:'bargain',who:'Sam · producer at a famous game studio',moment:'They know their name is worth a lot to you.',job:'Sound design for a big-name game',pos:'¥800 a day. Lowest you’ll accept: ¥600',line:'“Our budget is ¥300 a day. But honestly, imagine this on your CV.”'}},
  {id:'walk-away',cat:'client',title:'A client you should walk away from',
   feel:'You’re fed up, and not sure you’re allowed to be.',moment:'Third round of “small changes”, a lower budget than agreed, and [[now they want it by Monday]].',
   most:'Saying yes again and resenting every hour. Or going quiet and hoping they disappear.',
   fails:'Every yes teaches them the line keeps moving. Ghosting damages your name more than a clear no.',
   k:'“I don’t think I’m the right fit for this version of the project. Here’s everything I’ve done so far, and I’m happy to hand it over cleanly.”',
   principle:'Not every client is your client.',
   then:'Know your walk-away point before the conversation. Leave politely and finish clean: it protects your reputation.',
   story:null,tech:'walk-away',
   practice:{scen:'difficult',who:'Kevin · founder of a small startup',moment:'This is the third round of changes, and the budget just dropped.',job:'A logo that has been through three rounds',pos:'',line:'“Just a few more small changes. And we need it Monday. Oh, and the budget got cut.”'}},
  {id:'team-pay',cat:'disagree',title:'Your team pushes back on pay and revisions',
   feel:'And part of you agrees with them.',moment:'You brought people in to help on a big job. Now one of them says: [[“For what we’re paid, this many revisions is too much.”]]',
   most:'Pulling rank: “That’s the job.” Or promising money you don’t have.',
   fails:'Pulling rank loses their goodwill when you need it most. Promising money you can’t pay loses their trust later.',
   k:'“You’re right, this is more than we planned. Let me see what I can add. If the budget really can’t move, you’re first on my list for the next job, and I’ll hold the client to two more rounds.”',
   principle:'If money fixes it, pay. If it can’t, give something real instead.',
   then:'A bit less profit beats a war in the middle of a job. Promise only what you’ll actually deliver.',
   story:{src:'book',t:'A composer took on a big conference job: the opening films for a three-day tech event. Too much for one person, so he brought in two sound designers and two mix engineers. More people meant more problems: complaints about pay, frustration at too many revisions. Talking to the client took most of his time. The result was outstanding, and learning to manage people turned him into an audio director.'},
   tech:'warm-then-firm',
   practice:{scen:'conflict',who:'Ben · a sound designer on your team',moment:'It’s the fifth round of revisions this week.',role:'You are Ben, a sound designer on the speaker’s team; the speaker leads the team. You feel overworked and underpaid, and you are venting.',line:'“Honestly, for what we’re paid, this many revisions is too much.”'}},
  {id:'delegate',cat:'work',title:'You need to hand off work, but you don’t trust it to be done right',
   feel:'So you keep doing it all yourself, and you’re exhausted.',moment:'The job is too big for you alone. You need help, but [[you worry it won’t meet your standard or your deadline]].',
   most:'Doing it all yourself, late into the night. Or handing it off with “just do your best.”',
   fails:'Doing it all burns you out and caps how much you can take on. A vague handoff gets vague work back.',
   k:'“Here’s the part I need from you, here’s what great looks like, and I need it by Thursday at noon. Ask me anything before you start.”',
   principle:'Hand off the work. Keep the standard by saying what good looks like.',
   then:'Give one clear piece, an example of “good”, and a deadline with a check-in halfway.',
   story:{src:'book',t:'Early on, one composer did nearly everything himself. He didn’t trust others to meet his standard or his deadlines, and keeping all the money was appealing. Late nights, every time. The first time a job was simply too big, he reluctantly brought in four people. It turned out to be the best decision he could have made: he could focus on the music and the client, and it led to bigger work.'},
   tech:'bottom-line-first',
   practice:{scen:'feedback',who:'Leo · a freelancer you just hired',moment:'You are briefing him on his first piece of the project.',role:'You are Leo, a freelancer the speaker just hired. You are keen but unsure what they want.',line:'“So, what exactly do you need from me?”'}},
  {id:'nervous',cat:'work',title:'You’re scared of looking stupid if you speak up',
   feel:'And the longer you wait, the harder it gets.',moment:'The meeting goes quiet. You have a view, and [[your heart is racing]].',
   most:'Waiting until you are completely sure. Then the moment passes.',
   fails:'The moment rarely comes back. And every time you stay quiet, it gets harder the next time.',
   k:'“Can I add one thing? I think we’re missing the customer’s side of this.” One sentence is enough to start.',
   principle:'Fear means you’re trying something new. Do it anyway, small.',
   then:'Prepare one sentence before the meeting. Say it in the first ten minutes, before the nerves build.',
   story:{src:'book',t:'Years into a successful career, one composer started making videos about his work. He was scared of being laughed at and of making mistakes on camera. That was the point. The older we get, the more comfortable we become, and the less we try. Each video made the next one easier.'},
   tech:'bottom-line-first',
   practice:{scen:'meeting',who:'Your manager · weekly team meeting',moment:'The room has gone quiet. You have a view, and your heart is racing.',line:'“Anyone else? Any thoughts before we move on?”'}},
  {id:'what-you-do',cat:'job',title:'“So, what do you do?”',
   feel:'And you watch their eyes glaze over.',moment:'Someone useful asks the simplest question, and [[you answer with your job title and a list of skills]].',
   most:'“I’m a designer. I do branding, web, some motion…”',
   fails:'A title and a list are forgettable. People remember what you do for someone, not what you call yourself.',
   k:'“I help small brands look bigger than they are. Mostly packaging and their first website.”',
   principle:'Say what they get, not what you do.',
   then:'Then stop, and let them ask the next question.',
   story:null,tech:'their-problem',
   practice:{scen:'intro',who:'A marketing director at an industry mixer',moment:'You have just been introduced.',line:'“So what is it you do, exactly?”'}},
  {id:'known-for-one',cat:'job',title:'People only know you for one thing',
   feel:'You’re proud of it. You’re also so much more than that.',moment:'Someone recognizes you from one big project, and [[the whole conversation stays there]].',
   most:'Talking about that project for ten minutes. Or brushing it off.',
   fails:'Staying there keeps you stuck as “the person who did that”. Brushing it off wastes the door it opens.',
   k:'“Yes, that was me. These days I spend most of my time on X, which is why I wanted to meet you.”',
   principle:'Use the label to open the door. Then say what’s next.',
   then:'Give the old project one sentence, then bridge to what you want them to remember now.',
   story:{src:'book',t:'One composer scored a blockbuster action film. For years, all he had to say was “I did the music for that film”, and doors opened. But the label never quite peeled off, even when he wanted to be known for other work. Big projects define you, for better and for worse.'},
   tech:'pivot',
   practice:{scen:'intro',who:'A producer at an industry dinner',moment:'She has just realized you worked on a famous project.',line:'“Wait, you did the music for that film? What are you working on now?”'}},
  {id:'career-change',cat:'job',title:'Explaining a career change',
   feel:'You can feel the doubt in the room.',moment:'An interviewer looks at your background: “This is quite a jump. [[Why should we take the risk?]]”',
   most:'Apologizing for your past, or listing every course you took to catch up.',
   fails:'Apologizing makes your past a weakness. A list of courses doesn’t show why you would be good.',
   k:'“Music taught me to tell a story in thirty seconds. That’s most of what this job is, so it’s less of a jump than it looks.”',
   principle:'Your past is the seed. Connect the dots for them.',
   then:'Pick the one skill that carries over, and give one example of it.',
   story:{src:'book',t:'Three people who started out in music: one became a full-time tattoo artist, one manages real estate, one is a creative director at Google. None of them planned it. Each grew a new career out of an interest they kept alive alongside music.'},
   tech:'star',
   practice:{scen:'interview',who:'The hiring manager · second round',moment:'Your background is in a different field.',line:'“Your background is in music. Why should we hire you for this?”'}},
  {id:'all-over',cat:'job',title:'“Your CV is all over the place”',
   feel:'And suddenly you’re not sure yourself.',moment:'The interviewer sees five different kinds of work and asks [[what your real specialty is]].',
   most:'Picking one skill and hiding the rest. Or listing everything.',
   fails:'Hiding skills throws away what makes you different. A list makes you look unfocused.',
   k:'“They all serve one thing: I can take an idea from sketch to finished product on my own. Most teams need three people for that.”',
   principle:'Stack your skills into one story.',
   then:'Name the one outcome your skills add up to, then give one example.',
   story:{src:'book',t:'When one composer was employed, he used maybe 20% of what he could do. When he went freelance, he built his own website, pitched his own clients and wrote his own copy. Ordinary skills, stacked together, became a brand no one else had.'},
   tech:'rule-of-3',
   practice:{scen:'interview',who:'The interviewer · first round',moment:'They are looking at your CV.',line:'“Your CV is all over the place. What is your actual specialty?”'}},
  {id:'one-project',cat:'job',title:'“Apart from that one project, what else?”',
   feel:'And you worry there isn’t enough behind it.',moment:'You led with your one impressive project. The interviewer wants to know [[what’s behind it]].',
   most:'Talking about the big project again, in more detail.',
   fails:'One big project can look like luck. They want to know you can do it again.',
   k:'“That’s the one people know. Behind it are about twenty smaller projects in two years, which is why I can adapt fast.”',
   principle:'Show the pattern, not just the peak.',
   then:'Name the range in one sentence, then one quick example that is different from the big one.',
   story:{src:'book',t:'One sound designer’s first job was at a small outsourcing studio that survived by taking every project it could. In two years he worked on almost two dozen titles, from mobile games to award winners. The volume proved he was adaptable and reliable, which is hard to show with one big project and nothing to compare it to.'},
   tech:'star',
   practice:{scen:'interview',who:'The interviewer · final round',moment:'You just talked about your best-known project.',line:'“Great. Apart from that one, what else have you done?”'}},
  {id:'teaching',cat:'people',title:'Teaching someone new',
   feel:'And you feel your patience slipping.',moment:'You have to train a new colleague or a student. You know the material. [[They look lost.]]',
   most:'Starting with everything you know, in the order you learned it.',
   fails:'Content without connection doesn’t land. People learn from someone they feel understands them.',
   k:'“Before we start: what do you already know, and what would make today worth it for you?”',
   principle:'Connection before content.',
   then:'Ask first, teach one thing, check it landed. Then the next.',
   story:{src:'book',t:'At sixteen, an assistant at a guitar shop was asked to start teaching, with no experience at all. It took trial and error and watching his co-workers. The biggest lesson: connecting with his students mattered as much as the teaching itself.'},
   tech:null,
   practice:{scen:'intro',who:'Mia · your new intern, first day',moment:'You are her first point of contact.',line:'“Hi! I’m Mia. So… where do I even start?”'}},
  // ── Starting out (from Kian’s answers, Oct 20) ──
  {id:'teacher-favor',cat:'start',title:'Asking a teacher for a big favor',
   feel:'You feel like you’re bothering them.',moment:'You need a recommendation letter. Your teacher is busy, and [[you’re not that close]].',
   most:'A quick message the night before the deadline: “Can you write me a letter?”',
   fails:'It reads like an order, not a request. Busy people say yes to people who make it easy and show they value their time.',
   k:'“I know you’re busy, and I’d really appreciate your help with a recommendation letter. I’ll send you everything you need, and I’d love to buy you a coffee to say thanks.”',
   principle:'Admit you need help. Offer something back.',
   then:'Ask early, bring everything they need in one message, and thank them after, whatever the result.',
   story:null,tech:'good-question',
   practice:{scen:'smalltalk',who:'Your teacher · after class',moment:'You need a recommendation letter in three weeks.',role:'You are a busy teacher. You like the student but don’t know them well. You are willing to help if they make it easy and are polite; a vague or last-minute ask makes you hesitate.',line:'“Hi, did you want to ask me something?”'}},
  {id:'group-project',cat:'start',title:'A group project member does nothing',
   feel:'And you can feel the grade slipping.',moment:'Two weeks to the deadline. One member hasn’t said a word in the group chat, and [[hasn’t done a thing]].',
   most:'Complaining in a side chat. Or doing their part yourself and resenting it.',
   fails:'Complaining fixes nothing. Doing it all yourself burns you out and teaches them it works.',
   k:'“You’d be great on the visuals, you’ve got the eye for it. Want to own that part? Tell me what you need from us.”',
   principle:'Draw out the shy ones. Route around the lazy ones.',
   then:'Quiet people often just need to feel seen: give them something hands-on. If they still do nothing, hand them one small task, and don’t spend more energy than it’s worth.',
   story:null,tech:'labeling',
   practice:{scen:'conflict',who:'Your group member · a quick call',moment:'They haven’t done anything yet, and the deadline is in two weeks.',role:'You are the quiet group member who hasn’t contributed. You are shy and unsure where to start, not lazy. If the speaker makes you feel useful and gives you a clear part, you open up; if they attack you, you go quiet.',line:'“Oh, hey. Sorry, I’ve been kind of busy.”'}},
  {id:'parents-creative',cat:'start',title:'Telling your parents you want a creative career',
   feel:'You love them. You also know what you want.',moment:'Dinner. Your parents ask what you plan to study. You say music. [[“Can you even make a living from that?”]]',
   most:'Arguing that they don’t understand. Or promising you’ll be the next big star.',
   fails:'An argument makes them dig in. Big dreams sound like a red flag to parents who want stability.',
   k:'“I know you worry it’s not stable. Here’s my plan for the next two years, and here are people doing this for a living. Give me until graduation to show you I’m serious.”',
   principle:'Give them stability to hold on to, not a dream to worry about.',
   then:'Show commitment over time: the work, the research, the plan. Share real examples of ordinary people living well in creative careers. Play to their need for security instead of fighting it.',
   story:{src:'kian',t:'One young guitarist told his parents early that music was what he wanted, and they could see it: he played more than he did anything else. When it was time to choose schools, he researched the options himself and brought them to his parents. It took time, but showing that commitment is what moved them.'},
   tech:'their-problem',
   practice:{scen:'tough',who:'Your parents · at dinner',moment:'They just asked what you plan to study, and you said music.',role:'You are the speaker’s parent. You love them and worry that a creative career is unstable. You respond to a calm plan and real examples; you push back hard on big dreams or on being told you don’t understand.',line:'“Music? Can you even make a living from that?”'}},
  {id:'internship',cat:'job',title:'An internship interview with little experience',
   feel:'And you’re sure everyone else has more to show.',moment:'The interviewer looks at your CV: [[“You don’t have much experience yet. Why should we take you?”]]',
   most:'Apologizing for not having experience. Or overselling skills you don’t have.',
   fails:'Training you costs them time. What they’re really asking is whether you’ll make that time worth it.',
   k:'“I don’t have much experience yet, but here are three projects I did on my own because I couldn’t stop. I learn fast, I’m happy to take direction, and I’ll make your time training me worth it.”',
   principle:'Show enthusiasm, and show you’ll take direction.',
   then:'Bring your own projects, even small ones. If you can’t show enthusiasm now, they’ll wonder if you’ll enjoy the job at all.',
   story:{src:'kian',t:'One student applying for an internship brought the projects he had done outside school alongside his application. The boss liked how he presented himself, and he got the place.'},
   tech:'their-problem',
   practice:{scen:'interview',who:'The interviewer · a small studio',moment:'They are looking at your CV.',role:'You run a small studio and are interviewing for an intern. Training costs you time. You want enthusiasm, a good attitude and willingness to take direction.',line:'“You don’t have much experience yet. Why should we take you?”'}},
  {id:'first-pay',cat:'start',title:'Your first salary offer is low',
   feel:'You’re grateful for the offer, and a little deflated.',moment:'You got the job. Then the number arrives, and [[it’s lower than you hoped]].',
   most:'Saying yes on the spot out of relief. Or demanding more without a reason.',
   fails:'At the start you have little leverage, so a demand can backfire. But a quick yes tells them you’ll always take less.',
   k:'“I’m really excited about this role. Is there any flexibility on the starting pay? If not, could we review it after three months, once you’ve seen my work?”',
   principle:'Starting out, experience is part of the pay. Just don’t sell yourself as cheap.',
   then:'Ask once, politely, with a reason. If the answer is no, get a review date in writing, then earn it.',
   story:null,tech:'give-to-get',
   practice:{scen:'tough',who:'The hiring manager · on a call',moment:'They just made you an offer.',role:'You are the hiring manager making a junior offer. Your budget is tight but you can review pay after a few months if they ask well. You don’t respond to demands.',line:'“So that’s the offer. Does that work for you?”'}},
  {id:'critique',cat:'start',title:'A review where they tear your work apart',
   feel:'Your face burns. You want to explain everything.',moment:'Portfolio review. The panel goes through your work one piece at a time, and [[they don’t like most of it]].',
   most:'Defending every choice: “What I was going for was…”',
   fails:'Explaining sounds like arguing. It makes you look difficult to work with, and that sticks longer than any piece of work.',
   k:'“Thank you, that’s really useful. If you were me, what’s the first thing you’d fix?”',
   principle:'Take criticism with grace. Don’t defend, ask.',
   then:'Listen, ask one question that helps you improve, and thank them. Managing your emotions is often worth more than your skills.',
   story:null,tech:'good-question',
   practice:{scen:'tough',who:'The review panel · your portfolio review',moment:'They have just been through your work.',role:'You are a senior reviewer. You are blunt but fair, and you respect students who take criticism well. If the speaker argues or over-explains, you get shorter with them.',line:'“Honestly, most of this feels unfinished. What were you going for here?”'}},
  {id:'senior-event',cat:'people',title:'Talking to someone senior at an industry event',
   feel:'And suddenly you feel very junior.',moment:'At an industry event, someone whose work you admire is standing alone. [[This is your chance.]]',
   most:'Gushing praise. Or freezing and walking past.',
   fails:'Praise alone ends the conversation. Walking past means nothing changes.',
   k:'“I loved your work on that last project. How did you decide on the sound for it?”',
   principle:'Decide where you stand. Peers meet as equals; legends get your curiosity.',
   then:'If the gap is small, don’t put yourself beneath them: how you present yourself is how they’ll place you. If it’s big, ask one good question and really listen.',
   story:null,tech:'good-question',
   practice:{scen:'smalltalk',who:'A senior director in your field · by the coffee',moment:'You admire their work and they are standing alone.',role:'You are a senior, well-known person in the speaker’s field. You are friendly but have heard a lot of praise. A thoughtful, specific question gets your attention; generic praise gets a polite short answer.',line:'“Hi. Enjoying the event?”'}},
  {id:'class-question',cat:'start',title:'You have a question, but you’re scared to ask',
   feel:'Your heart is pounding, and you stay quiet.',moment:'The teacher asks, “Any questions?” You have one, but [[what if it sounds stupid?]]',
   most:'Staying quiet. Or asking something you could have looked up in a minute.',
   fails:'The fear of asking is the stupid part. But a question asked for the sake of asking wastes everyone’s time.',
   k:'“In the example you showed, why did you choose that over the more common approach?”',
   principle:'No question is stupid. Asking without thinking is.',
   then:'Think it through first. Ask what you’re genuinely curious about, and keep it short. Everyone’s time is valuable.',
   story:null,tech:'good-question',
   practice:{scen:'meeting',who:'Your teacher · end of class',moment:'They just asked if anyone has questions.',role:'You are the teacher. You welcome real questions and answer generously; you are a little impatient with questions that weren’t thought through.',line:'“Okay, any questions before we finish?”'}},
  // ── Moving up (from Kian’s answers, Oct 20) ──
  {id:'raise',cat:'career',title:'Asking for a raise',
   feel:'You know you’re worth more. Saying it feels risky.',moment:'You’ve taken on more for months. Your pay hasn’t moved, and [[nobody has mentioned it]].',
   most:'Asking because you “deserve it”. Or asking on a bad day, in a hallway.',
   fails:'Deserving it isn’t a case. And most of the time it isn’t the number that decides it, it’s the moment you ask.',
   k:'“Over the last six months I’ve taken on the client reports and trained two new people. I’d like to talk about my pay. When’s a good time this week?”',
   principle:'Pick the moment. The timing matters more than the number.',
   then:'Be honest with yourself first: do you deserve it? Then prepare your case. Don’t ask during layoffs or when your boss is clearly having a bad day. The more you’re worth to them, the more leverage you have.',
   story:null,tech:'know-your-lowest',
   practice:{scen:'disagree',who:'Your boss · a planned one-on-one',moment:'You asked for time to talk about your pay.',role:'You are the speaker’s boss. Budgets are tight but they’re good at their job. You respond to a clear case and good timing; you push back on “I deserve it”.',line:'“Sure, what did you want to talk about?”'}},
  {id:'bad-review',cat:'career',title:'Your performance review isn’t great',
   feel:'And you want to defend yourself, right now.',moment:'Your manager goes through your review. Most of it is fine, but [[one part stings]].',
   most:'Arguing every point. Or going silent and sulking for a week.',
   fails:'Arguing makes you look difficult to work with. People remember how you took it longer than what the review said.',
   k:'“Thanks for being straight with me. What would ‘good’ look like by the next review?”',
   principle:'Take it with grace. Emotional control is worth more than skill.',
   then:'Listen first. If something is factually wrong, raise it calmly later, with proof. Then work on the one thing they named.',
   story:null,tech:'good-question',
   practice:{scen:'tough',who:'Your manager · your review',moment:'They are going through your review.',role:'You are the manager giving a mixed review. You are fair. If the speaker takes it well and asks how to improve, you warm up; if they argue, you get firmer.',line:'“Overall it’s been solid, but your deadlines have been a real problem this quarter.”'}},
  {id:'senior-push',cat:'career',title:'You think a senior colleague is wrong',
   feel:'You’re sure you’re right. They’re sure they are.',moment:'In a meeting, a senior colleague proposes a plan. You can see the problem, and [[they don’t like being questioned]].',
   most:'“I don’t think that will work.” Or saying nothing.',
   fails:'Seniors have egos. A flat “that won’t work” turns it into a contest, and they have to win.',
   k:'“I really like where this is going. One thing I wondered about: what if we tried it this way first? Your call.”',
   principle:'Praise first, make it a discussion, let them decide.',
   then:'Unless you’re ready to make an enemy, keeping the peace usually wins. Say it once, then back the decision.',
   story:null,tech:'warm-then-firm',
   practice:{scen:'disagree',who:'A senior colleague · in the team meeting',moment:'They just proposed a plan you think has a problem.',role:'You are a senior colleague with some ego. You listen to a respectful suggestion framed as a question; you resist being told you’re wrong in front of others.',line:'“So that’s the plan. Any thoughts before we go?”'}},
  {id:'vague-blame',cat:'career',title:'Vague instructions, then you get the blame',
   feel:'You know it wasn’t your fault, and it’s eating at you.',moment:'Your boss gave you a one-line brief. You did what they asked. Now it’s wrong, and [[it’s somehow on you]].',
   most:'Taking the blame quietly. Or blowing up about it in front of everyone.',
   fails:'Taking it teaches them they can do it again. Blowing up makes you the problem, even when you’re right.',
   k:'“I followed what we agreed on Tuesday. Here’s the message. Can we make sure the next brief is clearer, so this doesn’t happen again?”',
   principle:'Get it in writing. Then decide: honest mistake, or power play?',
   then:'Confirm every brief in writing before you start. If it was an honest mistake, sort it out privately. If they keep doing it on purpose, show the record, and if you need to, take it to their boss.',
   story:null,tech:'warm-then-firm',
   practice:{scen:'disagree',who:'Your boss · after the client call',moment:'Your work missed the mark because the brief was vague, and they are blaming you.',role:'You are the boss who gave a vague brief and is now blaming the speaker. It was an honest mistake on your part, though you don’t see it yet. If the speaker calmly shows you what was agreed, you back down.',line:'“This isn’t what I asked for. What happened?”'}},
  {id:'weekend-work',cat:'career',title:'Asked to work the weekend, again',
   feel:'You’re tired, and you don’t know if you can say no.',moment:'Friday, 6 pm. “Can you come in tomorrow?” [[It’s the third weekend this month.]]',
   most:'Yes every time, until you burn out. Or a flat no with no warning.',
   fails:'Endless yeses drain your health and erase your boundaries. A flat no with no leverage behind it can cost you more than you’re ready for.',
   k:'“I can do tomorrow this time. Going forward, can we plan these earlier, so I can keep most weekends free?”',
   principle:'Know what the extra hours are buying you.',
   then:'Early on, some extra hours are training, within reason. Mid-career, constant overtime is just draining you. Your leverage, your experience and your health decide where the line is.',
   story:null,tech:'two-good-options',
   practice:{scen:'sayno',who:'Your manager · Friday evening',moment:'It’s the third weekend this month.',role:'You are the manager asking for weekend work again. You assume they’ll say yes. You accept a reasonable, calm boundary, especially if they offer something; you push on a vague excuse.',line:'“Can you come in tomorrow? We’re behind on the launch.”'}},
  {id:'ask-help',cat:'career',title:'You’re stuck and need help',
   feel:'You don’t want to look like you can’t do your job.',moment:'You’ve been stuck on the same problem for two days, and [[the deadline is Friday]].',
   most:'Struggling alone to look capable. Or “I don’t get it, can you help?” with nothing tried.',
   fails:'Staying stuck costs everyone more than asking. An ask with nothing tried wastes their time.',
   k:'“I’ve tried A and B, and I’m stuck on C. Could you spare ten minutes? Coffee’s on me.”',
   principle:'Think it through first. Then ask, and offer something back.',

const YES_Q=[

// ═══════════════════════════════════════════════════════════════════════════
// K'S DESK: one box on the home screen. The person types what's coming up or
// what just happened; K reads it and sends them to the right tool, already
// filled in. They see what K understood and can switch with one tap.
// ═══════════════════════════════════════════════════════════════════════════
const DESK_ROUTES={
  advice:{t:'Get K’s advice',ic:'info',p:'p-lav',say:'You want to know what to do.'},
  reply:{t:'Draft my reply',ic:'reply',p:'p-lav',say:'You have a message to answer.'},
  practice:{t:'Practice it',ic:'talk',p:'p-teal',say:'You have a conversation coming up.'},
  pitch:{t:'Build my pitch',ic:'pitch',p:'p-org',say:'You have something to present.'},
  quick:{t:'Quick answer',ic:'quick',p:'p-pink',say:'You need a sharp answer to one question.'}
};
// Offline guess: good enough to route when K can't be reached
function _deskGuess(text){
  const s=String(text||'').toLowerCase();
  const quoted=/[“"「]/.test(text)||/^(hi|hello|dear|hey)\b/.test(s)||/\b(replied|messaged|emailed|texted|sent me|wrote|asked me)\b/.test(s);
  let scen='conflict';
  if(/interview/.test(s))scen='interview';
  else if(/\b(price|discount|budget|cheaper|rate|quote|invoice|pay)\b/.test(s))scen='bargain';
  else if(/\b(boss|manager|team lead|supervisor)\b/.test(s)&&/(disagree|wrong|mistake|push back|deadline|decid|wants us|plan)/.test(s))scen='disagree';
  else if(/\b(feedback|tell (him|her|them))\b/.test(s))scen='feedback';
  else if(/\b(say no|turn down|decline|favor|favour|extra work)\b/.test(s))scen='sayno';
  else if(/\b(meeting|update|stand-?up)\b/.test(s))scen='meeting';
  else if(/\b(party|date|networking|event|stranger|small talk)\b/.test(s))scen='smalltalk';
  else if(/\b(introduce|introduction)\b/.test(s))scen='intro';
  else if(/\b(client)\b/.test(s))scen='difficult';
  let route='practice';
  const asks=/(what should i|what do i|how do i|how should i|best way|don.?t know|not sure|help me|advice|messed up|screwed up|made a mistake|my fault|went wrong|angry|upset|furious|disappointed)/.test(s);
  if(asks&&!quoted)route='advice';
  else if(/\b(pitch|presentation|present|investors|demo day|keynote|speech)\b/.test(s))route='pitch';
  else if(quoted)route='reply';
  const who=/\b(client|customer)\b/.test(s)?'client':/\b(interview)\b/.test(s)?'interviewer':/\b(boss|manager|colleague|teammate|co-?worker)\b/.test(s)?'boss':'new';
  const want=/\b(price|discount|cheaper|budget)\b/.test(s)?'price':/\b(no|decline|can.?t)\b/.test(s)?'no':/\b(time|later|deadline)\b/.test(s)?'time':/\b(mistake|sorry|wrong)\b/.test(s)?'fix':'well';
  return {route,scenario:scen,why:DESK_ROUTES[route].say,who:'',moment:'',line:'',rwho:who,rwant:want,reply_text:''};
}
async function deskRead(){
  const ta=document.getElementById('desk-text');const text=String((ta&&ta.value)||V.deskText||'').trim();
  if(text.length<8){showToast('Tell K a little more first.');if(ta)ta.focus();return;}
  V.deskText=text;
  let r=null;
  if(_aiOn()){
    V.deskBusy=true;render();
    const scenes=Object.keys(TT_REAL).map(k=>k+' ('+TT_REAL[k].name+')').join(', ');
    const sys='You are the front desk of a communication coaching app. A person describes a situation. Decide which tool helps them most, and fill it in.\n'+
      'Tools: "advice" (they are asking what to do, something has gone wrong, emotions are high, or they need a plan before any words: choose this whenever they ask for guidance rather than a draft or a rehearsal; it is the safe default), "reply" (they received a message and need to answer it: the text contains or describes what someone said to them, and the answer is written), "practice" (a spoken conversation is coming up or keeps happening: they want to rehearse it with K playing the other person), "pitch" (they must present or pitch something to a group or a decision maker), "quick" (they want a strong short answer to one question they expect to be asked).\n'+
      'Practice scenarios (pick the closest key): '+scenes+'.\n'+
      'Reply with JSON only, no markdown: {"route":"advice|reply|practice|pitch|quick","why":"one short sentence to them, starting with You, saying what you understood (under 18 words)","scenario":"a practice key","who":"who they will talk to: name or role, who they are, one telling detail, under 14 words","moment":"where they are and what is at stake, under 30 words","line":"the first thing the other person will say, spoken, in curly quotes, under 25 words","reply_text":"for reply: the message they received, copied word for word if it is in their text, else empty","rwho":"client|boss|interviewer|new","rwant":"price|no|time|more|fix|well","pitch_line":"for pitch: what they are pitching, in one line","pitch_room":"client|investors|boss|panel","question":"for quick: the question they expect, in curly quotes"}';
    try{const raw=await callCoach(sys,'THEIR SITUATION:\n'+text,{maxTokens:420,featureId:'desk-route',noLang:true});r=_jsonFrom(raw);if(!DESK_ROUTES[r.route])r=null;}catch(e){r=null;}
    V.deskBusy=false;render();
  }
  if(!r)r=_deskGuess(text);
  if(r.route==='practice'&&!TT_REAL[r.scenario])r.scenario=_deskGuess(text).scenario;
  V.deskRoute=r;
  if(r.route==='advice'){deskGo('advice');return;}
  openDeskSheet();
}
function openDeskSheet(){

function deskGo(route){
  const r=Object.assign({},V.deskRoute||{}),text=V.deskText||'';
  if(route==='advice'){V.adv={text,data:null,loading:true,err:null,scen:TT_REAL[r.scenario]?r.scenario:_deskGuess(text).scenario};go('advice');deskAdvice();return;}
  if(route==='reply'){
    if(!_canReply()){openLimitSheet('reply');return;}
    const msg=_clean(r.reply_text)&&r.reply_text.length>6?r.reply_text:text;
    RP={step:'paste',text:msg,who:RP_WHO.some(w=>w[0]===r.rwho)?r.rwho:'client',want:RP_WANT.some(w=>w[0]===r.rwant)?r.rwant:'well',draft:null,loading:false,err:null,tone:null,guard:null};
    V._rpRestore=false;go('reply');rpDraft();return;
  }
  if(route==='practice'){
    if(!_canStartSession()){openLimitSheet('month');return;}
    let k=TT_REAL[r.scenario]?r.scenario:_deskGuess(text).scenario;
    RW.scenario=k;RW.goal=_rwGoalOf(k).k;RW.tougher=false;_rwResetConvo();RW.fromReply=null;RW.fromCase=null;RW.prevFix='';
    RW.context=text.slice(0,400);
    const line=_clean(r.line);
    // No scene from K (offline): build it from their own words, never a random one
    const OPEN={disagree:'“You wanted a word?”',conflict:'“Hey, what’s up?”',feedback:'“You wanted to talk?”',sayno:'“So, can you take it on?”',bargain:'“So, what’s your price?”',ground:'“Can you do any better than that?”',difficult:'“We need to talk about this.”',proposal:'“So, what do you propose?”',interview:'“So, tell me about yourself.”',intro:'“So, what do you do?”',meeting:'“Okay, you’re up.”',tough:'“So, what happened?”',smalltalk:'“Hi! How do you know the host?”',pitch:'“Okay, you have a minute. Go.”'};
    if(!(line&&r.who)){r.who=RW_ROLE[k]||'The other person';r.moment=_kShort(text,200);r.line=OPEN[k]||'“So, what’s on your mind?”';}
    {const line=_clean(r.line);
      RW.question=/^[“"]/.test(line)?line:'“'+line+'”';RW.source='desk';
      _rwCast(_rwIsClient(k)?{c:_clean(r.who),job:_clean(r.moment)||_kShort(text,160),pos:(k==='bargain'||k==='ground'||k==='proposal')&&S.rwPrice?S.rwPrice+(S.rwLowest?'. Lowest you’ll accept: '+S.rwLowest:''):''}:{who:_clean(r.who),moment:_clean(r.moment)});
      RW.phase='brief';go('real');
    }
    return;
  }
  if(route==='pitch'){
    PI.phase='setup';PI.line=_clean(r.pitch_line)||text.slice(0,140);
    if(PI_ROOMS.some(x=>x[0]===r.pitch_room))PI.room=r.pitch_room;
    go('pitch');return;
  }
  if(route==='quick'){
    const q=_clean(r.question);
    if(q){QA.q=/^[“"]/.test(q)?q.replace(/^[“"]|[”"]$/g,''):q;QA.goal=null;QA.phase='q';QA.take=null;QA.notes=null;QA.strong=null;}
    go('quick');return;
  }
}

// ── K's advice: read the situation, then what to do, what to say, the principle ──
async function deskAdvice(){
  const A=V.adv;if(!A)return;
  if(!_aiOn()){A.loading=false;A.data=null;A.err='offline';render();return;}
  const cases=CASES.map(c=>c.id+': '+c.title+' (principle: '+c.principle+')').join('\n');
  const sys=K_VOICE+'\nSomeone has brought you a real situation and wants to know what to do. Coach them the way you coach: calm, direct, warm, practical. No blame, no lecture, no therapy talk.\n\n'+K_CLIENT_VIEW+'\n'+K_CONFLICT_VIEW+'\n'+K_PEOPLE_VIEW+'\n'+K_PLAIN+
    '\n\nThe library cases and their principles (use the closest one if it truly fits):\n'+cases+'\n'+TECH_LIST+
    '\n\nReply with JSON only, no markdown: {"read":"what is really going on and what matters most right now, 1–2 sentences, said to them","steps":["3 short steps in order, each starting with a verb, each under 20 words"],"say":"the first words they could actually say or write to open, spoken, under 40 words","avoid":"the one thing not to do, under 18 words","principle":"the principle underneath, 3–8 plain words","case":"the closest library case id, or empty","next":"reply|practice"}';
  try{
    const raw=await callCoach(sys,'THEIR SITUATION:\n'+A.text+nbContext('real'),{maxTokens:700,featureId:'desk-advice'});
    let j;try{j=_jsonFrom(raw);}catch(_){j=_jsonFrom(await callCoach(sys,'THEIR SITUATION:\n'+A.text+'\n\nReply with valid JSON only.',{maxTokens:700,featureId:'desk-advice',grace:true}));}
    const steps=(Array.isArray(j.steps)?j.steps:[]).map(_clean).filter(Boolean).slice(0,4);
    if(!j.read||!steps.length)throw new Error('Unexpected answer');
    A.data={read:_clean(j.read),steps,say:_clean(j.say),avoid:_clean(j.avoid),principle:_clean(j.principle),case:_case(j.case)?j.case:'',next:j.next==='reply'?'reply':'practice'};
    nbAdd({cat:'reply',title:_kShort(A.text,80),sub:'K’s advice',fix:A.data.principle,worked:'',fb:'',_noNote:true});
  }catch(e){A.err=e;}
  A.loading=false;if(V.view==='advice')render();
}

// SUGGESTIONS FROM THEIR DETAILS
// When someone has told K what's hardest (or their career stage), the home box
// suggests where to start instead of an empty text box:
//   B · K's note (one pick in K's voice) while they're new (< 3 sessions)
//   A · Where to start (three picks) once they know the app
// "Something else" switches the box back to typing for the rest of the day.
// Case of the day is picked from the same details. Anonymous counts (no names,
// no text) go to /stats so the owner page can show which version works.
// Every 30 days K checks in: is it still the same, or has something new come up?
// ═══════════════════════════════════════════════════════════════════════════
const SUG_MAP={
  money:{t:'money talks',practice:'discount',read:'market-rate',quick:'Can you do better on the price?',cases:['discount','market-rate','too-expensive','big-name','free-now','first-pay','raise']},
  no:{t:'saying no',practice:'one-more',read:'friend-free',quick:'Can you take this on as well? It needs to be done by Monday.',cases:['one-more','friend-free','walk-away','weekend-work']},
  interview:{t:'interviews',practice:'stand-out',read:'one-project',quick:'Why should we hire you?',cases:['stand-out','internship','career-change','all-over','one-project']},
  intro:{t:'introducing yourself',practice:'what-you-do',read:'known-for-one',quick:'So, what do you do?',cases:['what-you-do','known-for-one','stand-out']},
  smalltalk:{t:'small talk',practice:'introvert',read:'follow-up',quick:'So how do you know the host?',cases:['introvert','follow-up','senior-event']},
  meetings:{t:'speaking up in meetings',practice:'nervous',read:'boss-plan',quick:'Any thoughts before we move on?',cases:['nervous','class-question','too-long','boss-plan','senior-push']},
  difficult:{t:'difficult people',practice:'own-mistake',read:'credit',quick:'Why wasn’t this caught earlier?',cases:['credit','vague-blame','approved-rejected','walk-away','own-mistake','deadlines','team-pay','group-project']},
  nerves:{t:'nerves',practice:'nervous',read:'introvert',quick:'Can you give us a quick update on your project?',cases:['nervous','introvert','class-question','critique']},
  present:{t:'presenting',practice:'too-long',read:'too-technical',quick:'So, in plain English, what does this do for us?',cases:['too-long','too-technical']}
};
const SUG_STAGE={freelance:'money',jobhunt:'interview',student:'interview',switch:'interview',early:'meetings',mid:'difficult',senior:'no'};
function _today(){return new Date().toDateString();}
function _sugKeys(){const p=_P();const s=(p.struggles||[]).filter(k=>SUG_MAP[k]);if(s.length)return s;const g=SUG_STAGE[p.stage];return g?[g]:[];}
function _sessionsDone(){return _nbEntries().filter(e=>e.cat!=='reply').length;}
// Which box to show: 'type' (as before), 'A' or 'B'
function _sugMode(){
  if(!_sugKeys().length)return 'type';
  if(S.deskTypeDay===_today())return 'type';
  if(_sessionsDone()<3&&S.deskBMissDay!==_today())return 'B';
  return 'A';
}
// Rotate through their struggles day by day, skipping what they just did
function _sugPick(offset){
  const ks=_sugKeys();const d=new Date();const n=d.getFullYear()*400+d.getMonth()*31+d.getDate()+(offset||0)+_sessionsDone();
  return ks[n%ks.length];
}
function _sugItems(){
  const k=_sugPick(0),k2=_sugKeys().length>1?_sugPick(1):k,m=SUG_MAP[k],m2=SUG_MAP[k2];
  const pc=_case(m.practice),rc=_case(m2.read);
  return [
    {kind:'practice',key:k,t:'Practice: '+_sugLower(pc?pc.title:'a real conversation'),s:(pc&&TT_REAL[pc.practice.scen]?TT_REAL[pc.practice.scen].name:'Practice')+' · about 2 minutes',ic:'mic',p:'p-teal',caseId:m.practice},
    {kind:'read',key:k2,t:'Read: '+_sugLower(rc?rc.title:'a case'),s:_cap(m2.t)+' · 1-minute case',ic:'book',p:'p-lav',caseId:m2.read},
    {kind:'quick',key:k,t:'Quick answer: “'+_kShort(m.quick,40)+'”',s:'Ten seconds to think, then answer',ic:'quick',p:'p-pink',q:m.quick}
  ];
}
function _sugLower(t){t=String(t||'');return /^[“"]/.test(t)?t:t.charAt(0).toLowerCase()+t.slice(1);}
function _sugReason(){const ks=(_P().struggles||[]).filter(k=>SUG_MAP[k]);
  if(!ks.length){const st=_label(STAGES,_P().stage);return st?'You told K: '+st.toLowerCase():'';}
  const names=ks.slice(0,2).map(k=>SUG_MAP[k].t);return 'You told K: '+names.join(' and ')+(ks.length>1?' are':' is')+' hard';}

function _sugMoment(c){const m=_unsting(c.moment);const s=m.split(/(?<=[.!?])\s/)[0];return s.length<120?s:_kShort(m,110);}
function wireDeskBox(app){
  const ta=app.querySelector('#desk-text');if(ta)ta.addEventListener('input',()=>{V.deskText=ta.value;});
  const dg=app.querySelector('[data-act="desk-go"]');if(dg)dg.addEventListener('click',deskRead);

    if(it.kind==='read'){openCase(it.caseId);return;}
    if(it.kind==='quick'){QA.q=it.q;QA.goal=null;QA.phase='q';QA.take=null;QA.notes=null;QA.strong=null;go('quick');}
  }));
  const se=app.querySelector('[data-act="sug-else"]');if(se)se.addEventListener('click',()=>{_track('sugB_else');S.deskBMissDay=_today();save();render();}); // B didn't fit: three picks (A) for today
  const st=app.querySelector('[data-act="sug-type"]');if(st)st.addEventListener('click',()=>{_track('sug_type');S.deskTypeDay=_today();save();render();setTimeout(()=>{const t=document.getElementById('desk-text');if(t)t.focus();},60);});
  _wireCheckin(app);

// ── Case of the day from their details ───────────────────────────────────
function _caseForMe(){
  const ks=_sugKeys();if(!ks.length)return null;
  const seen=_casesSeen(),st=_P().stage;
  // What they said is hard comes first; their career stage fills in once those are read
  let ids=[];ks.forEach(k=>SUG_MAP[k].cases.forEach(id=>{if(!ids.includes(id))ids.push(id);}));
  const extra=st==='freelance'?{cat:'client',why:'for freelancers'}:(st==='student'||st==='jobhunt'||st==='switch')?{cat:'job',why:'for getting in'}:null;
  const d=new Date();const n=d.getFullYear()*400+d.getMonth()*31+d.getDate();
  let pool=ids.map(_case).filter(c=>c&&!seen[c.id]);
  if(!pool.length&&extra){const ex=CASES.filter(c=>c.cat===extra.cat&&!seen[c.id]);if(ex.length){const c=ex[n%ex.length];return {c,why:extra.why};}}
  if(!pool.length)pool=ids.map(_case).filter(Boolean);
  const c=pool[n%pool.length];
  const k=ks.find(k=>SUG_MAP[k].cases.includes(c.id))||ks[0];
  return {c,why:'for '+SUG_MAP[k].t};
}
// ── Anonymous counts for the owner page ──────────────────────────────────
function _track(e,oncePerDay){
  try{
    if(oncePerDay){const k='grd-tr-'+e;if(localStorage.getItem(k)===_today())return;localStorage.setItem(k,_today());}
    const cfg=S.aiConfig||{};const ep=(cfg.endpoint||'/.netlify/functions/ai').replace(/\/ai$/,'/stats');
    fetch(ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({e}),keepalive:true}).catch(()=>{});
  }catch(err){}
}
// ── Monthly check-in: "still the same, or something new?" ────────────────
function _profTouch(){
  const p=_P();const now=new Date().toISOString();
  p.history=Array.isArray(p.history)?p.history:[];
  const snap={at:now,struggles:(p.struggles||[]).slice(),stage:p.stage||''};
  const last=p.history[p.history.length-1];
  if(!last||JSON.stringify(last.struggles)!==JSON.stringify(snap.struggles)||last.stage!==snap.stage){p.history.push(snap);p.history=p.history.slice(-12);}
  p.updated=now;save();
}
function _checkinDue(){
  const p=_P();if(!_sugKeys().length)return false;
  if(!p.updated){p.updated=new Date().toISOString();save();return false;}
  if(S.checkinSnooze===_today())return false;
  return Date.now()-new Date(p.updated).getTime()>30*864e5;
}
function _checkinHtml(){
  const p=_P(),nm=p.name||'';const ks=(p.struggles||[]).filter(k=>SUG_MAP[k]).map(k=>SUG_MAP[k].t);
  const was=ks.length?ks.slice(0,2).join(' and '):_label(STAGES,p.stage).toLowerCase();
  return '<div class="desk sug-b"><div class="sug-k">'+kav()+'<div><small>K · checking in</small><p>It’s been a month'+(nm?', '+escHtml(nm):'')+'. Last time it was '+escHtml(was)+'. Is that still the hard part, or has something new come up?</p></div></div>'+
    '<div class="sug-btns"><button class="desk-go" data-act="ci-update">Update it</button><button class="sug-else" data-act="ci-same">Still the same</button></div></div>';

// HELP ME REPLY: paste their message, K drafts what to say, shows why line by
// line with a technique on each, and refuses to write a yes below your lowest.
// Steps: paste → thinking → reply → why → (under-lowest guard)
// ═══════════════════════════════════════════════════════════════════════════
const RP_WHO=[['client','Client'],['boss','Boss or colleague'],['interviewer','Interviewer'],['new','Someone new']];
const RP_WANT=[['price','Keep my price'],['no','Say no politely'],['time','Buy time'],['more','Ask for more'],['fix','Fix a mistake'],['well','Just reply well']];
let RP={step:'paste',text:'',who:'client',want:'price',draft:null,loading:false,err:null,tone:null,guard:null};
function _rpLowest(){return _money(S.rwLowest)||null;}
function _rpAskedPrice(text){
  // the biggest yuan-ish number in their message, if any
  const nums=(String(text||'').match(/(?:¥|rmb|yuan|\$|usd|€|£)?\s?\d{1,3}(?:[,，]\d{3})+(?:\.\d+)?|(?:¥|rmb|\$|€|£)\s?\d+(?:\.\d+)?|\d+\s?(?:k|K)\b|\d{3,}\s?(?:yuan|rmb|元|块)/g)||[]);
  const vals=nums.map(s=>{let v=parseFloat(s.replace(/[^\d.]/g,''));if(/k$/i.test(s.trim()))v*=1000;return v;}).filter(v=>v>0);
  return vals.length?Math.max(...vals):null;
}
function _rpSys(){
  const wantTxt={price:'keep their price (and give something other than money if they must give)',no:'say no politely and keep the relationship',time:'buy time without sounding evasive',more:'ask for more money or more time, with a reason',fix:'own a mistake, fix it, and keep the client',well:'reply well: warm, clear, and short'}[RP.want];
  const whoTxt={client:'a client',boss:'their boss or a colleague',interviewer:'an interviewer or recruiter',new:'someone they have just met or are getting to know'}[RP.who];
  const ctx=[S.rwField?'Their field: '+S.rwField:'',S.rwPrice?'Their price: '+S.rwPrice:'',S.rwLowest?'The lowest they will accept: '+S.rwLowest:''].filter(Boolean).join('\n');
  return K_VOICE+'\n\nThe user has received a message from '+whoTxt+' and wants to '+wantTxt+'. Write the reply they should send, in their voice, first person, ready to paste into any chat or email.\n'+
    (RP.who==='client'?K_CLIENT_VIEW+'\n':RP.who==='interviewer'?K_INTERVIEW_VIEW+'\n':RP.who==='new'?K_PEOPLE_VIEW+'\n':'')+K_JUDGE+'\n'+K_PLAIN+'\n'+(ctx?'\nWhat you know about the user:\n'+ctx+'\n':'')+
    '\nRULES FOR THE DRAFT: 40–90 words, sounds like a real person typing, no greeting line or sign-off, no bullet points, no headings. Warm first, then firm. If a price is involved, the draft keeps the user’s price unless they chose otherwise; if it gives something, it gets something back in the same breath. Never invent facts the user did not give (no made-up dates, names or numbers beyond those in the message or context). If the message asks for a price below the lowest the user will accept, the draft must hold the price and offer a smaller scope instead; never say yes to it.\n'+
    'Also explain it line by line: pick 3 to 4 key lines of the draft (each "quote" must be an EXACT substring of the draft, copied character for character), name the technique behind each from this list only: '+Object.values(TECHNIQUES).map(t=>t.title).join('; ')+', and say why in one plain sentence.\n'+
    'Reply with JSON only, no markdown: {"draft":"…","give":"what the user gives in this reply, 2–5 words (or \\"Nothing\\")","get":"what the user gets back, 2–5 words","why":[{"quote":"exact substring of the draft","technique":"title from the list","why":"one sentence"}],"below_lowest":true|false}';
}
async function rpDraft(tone){
  if(!RP.text.trim())return;
  if(!_canReply()){openLimitSheet('reply');return;}
  RP.loading=true;RP.err=null;RP.step='think';RP.tone=tone||null;render();
  const lowest=_rpLowest(),asked=_rpAskedPrice(RP.text);
  const guard=!!(lowest&&asked&&asked<lowest&&RP.who==='client')&&tone!=='yes';
  let msg='THEIR MESSAGE:\n'+RP.text.trim()+(tone?'\n\nADJUST: the previous draft was "'+RP.draft.draft+'". Write it again '+({warmer:'warmer: more human, more acknowledgement, same position',firmer:'firmer: fewer softeners, the position stated plainly, still polite',shorter:'shorter: cut it to about half, keep the position and the ask',yes:'as a yes: the user has decided to accept their number. Write the best version of saying yes that still gets something back (a deposit, faster payment, a smaller scope), without sulking'})[tone]+'.':'')+(guard?'\n\nNOTE: they are asking for about '+_fmtMoney(asked)+', which is below the user’s lowest ('+S.rwLowest+'). Hold the price and offer a smaller scope.':'')+nbContext('reply');
  try{
    const raw=await callCoach(_rpSys(),msg,{maxTokens:700,featureId:'reply-draft'});
    let j;try{j=_jsonFrom(raw);if(String(j.draft||'').trim().length<20)throw 0;}
    catch(_){const raw2=await callCoach(_rpSys(),msg+'\n\nYour last answer could not be read. Reply again with valid JSON only, in the exact format asked.',{maxTokens:700,featureId:'reply-draft',grace:true});j=_jsonFrom(raw2);}
    const draft=String(j.draft||'').trim();if(draft.length<20)throw new Error('short');
    const why=(Array.isArray(j.why)?j.why:[]).map(w=>({quote:String(w.quote||'').trim(),technique:String(w.technique||'').trim(),why:String(w.why||'').trim()})).filter(w=>w.quote&&draft.toLowerCase().includes(w.quote.toLowerCase())).slice(0,4);
    RP.draft={draft,give:String(j.give||'').slice(0,40),get:String(j.get||'').slice(0,40),why,below:!!j.below_lowest||guard,asked,lowest};
    RP.guard=guard?{asked,lowest}:null;
    _countReply();
    S.lastReply={text:RP.text,who:RP.who,want:RP.want,draft:RP.draft,at:new Date().toISOString()};save();
    nbAdd({cat:'reply',title:_kShort(RP.text,80),sub:RP_WHO.find(w=>w[0]===RP.who)[1]+' · '+RP_WANT.find(w=>w[0]===RP.want)[1],fix:why[0]?why[0].technique+': '+why[0].why:'',worked:'',fb:'',_noNote:true,extra:{html:'<div class="g-block p-lav"><div class="g-kick">Sent this</div><div class="g-draft">'+escHtml(draft)+'</div></div>'+(why.length?'<div class="g-card tight">'+why.map((w,i)=>'<div class="g-row top"><span class="g-num">'+(i+1)+'</span><span class="t"><span class="q">“'+escHtml(w.quote)+'”</span><span class="w">'+escHtml(w.why)+'</span></span></div>').join('')+'</div>':'')}});
    RP.step='reply';
  }catch(e){RP.err=e;RP.step='error';}
  RP.loading=false;render();
}

const RW_STANDARD={
  interview:'INTERVIEW ANSWER. The interviewer is testing judgment, attitude and how the candidate thinks; the question is how they find out. A real example (situation → what I did → result) is the strongest evidence. A hypothetical is a valid answer when the speaker hasn’t lived the situation yet: judge it on its own terms. Never mark an answer down just for being hypothetical; suggest a real or adjacent example (school, side project) as the next level up. A skilled bridge or reframe that still gives the interviewer what they need is a strength, not a dodge. Attitude outranks structure: anger, blame, or badmouthing a team is the first thing to flag if it appears.',
  pitch:'ELEVATOR PITCH. A strong pitch: a hook in the first sentence, the problem the listener cares about, what’s offered, one proof point, and a clear ask at the end. It must fit the time; cutting is a skill here. Leading with a story or a reframe instead of the product is fine if the ask still lands.',
  intro:'SELF-INTRODUCTION. A strong introduction: name and what you do in one line, one memorable specific detail people can repeat, and a reason for the listener to follow up, pitched to the room described. If the listener is a potential client, also judge it as a client introduction: what you do FOR someone like them (the result, not the job title), one specific proof, and an easy next step; no apologizing for being new.',
  smalltalk:'CONVERSATION (small talk through to getting to know someone). The goal is a real connection, not a performance. A strong reply answers genuinely and briefly, offers one specific detail the other person can pick up, and shows real interest back: a question that opens things up (how, what, what got you into) rather than one that ends in yes or no, ideally built on something the other person actually said. Listening is the skill. Brevity is a strength: answer, add a hook, hand it back. Flag: interview-style question lists, talking only about themselves, one-word dead ends, trying too hard to impress, heavy topics too early, anything that pressures the other person. Never coach pickup lines or tricks. Judge it as one turn in a conversation, not a speech. In ONE THING, the better line should be short enough to say in one breath.',
  meeting:'SPEAKING UP IN A MEETING. Colleagues are busy; the speaker earns attention by being useful fast. A strong contribution puts the point or recommendation in the first sentence, gives one reason or piece of evidence, and says what should happen next (a decision, a next step, an owner). Disagreeing is welcome when it’s about the idea, not the person, and offers an alternative. Flag long context before the point, hedging that hides the view, apologizing for speaking, and carrying on after the point has landed.',
  tough:'TOUGH QUESTION. A strong reply stays calm and acknowledges the concern without getting defensive. The speaker doesn’t have to answer it head-on: acknowledge, satisfy the core of the concern, then move to the ground they want to stand on is a high-level technique, and should be recognized as one. Flag the clumsy version: an obvious dodge that leaves the real concern untouched, over-apologizing, defensiveness or rambling. End on a next step.',
  disagree:'DISAGREEING WITH SOMEONE ABOVE YOU. The goal is a better decision and a relationship that survives it, not winning. A strong reply agrees on the goal first, then names the specific risk with one fact, offers a way forward (a test, an option, a trade-off) and leaves the decision with them. Respectful and direct; no hedging that hides the point, no “you’re wrong”. Judge whether a busy manager would actually reconsider.',
  conflict:'A CLASH WITH A PEER OR FRIEND. A strong reply stays calm, describes what happened and its effect without labeling the person (“the slides went out without a check” not “you’re careless”), says what they need, and asks for their side. It corrects the record without accusing. It does not stew, gossip or explode, and it does not bury the issue to keep the peace. Judge whether the problem is likely to get fixed and the relationship to survive.',
  feedback:'GIVING HARD FEEDBACK. A strong reply is kind and clear at once: one specific thing they did, the effect it had, and what would work better, then a question that invites their view. One issue, not a list. Not so soft that the point is lost, not so blunt that they stop listening. Judge whether the person would actually change something.',

// The scene, kept on the speaking card: who, the job or the moment, your numbers, your goal
const RW_CTX_ON=false; // scene panel on the speaking card: waiting for approval
function _rwCtxPanel(){

// ── Build: K writes one line per part ─────────────────────────────────────
async function piBuild(opts){
  opts=opts||{};
  if(!PI.parts||opts.restructure)PI.parts=_piParts();
  if(!_aiOn()){PI.phase='build';render();return;}
  PI.building=true;PI.err=null;PI.phase='build';render();
  const st=PI_STRUCTS[PI.struct];
  const sys=K_VOICE+'\n'+K_PLAIN+'\nYou help someone build a spoken pitch using the structure "'+st.name+'" ('+(TECHNIQUES[st.tech]||{}).sum+'). '+K_CLIENT_VIEW.split('\n').slice(0,4).join('\n')+'\nFor each part write ONE line they could actually say out loud (under 18 words, first person, concrete, no jargon) and ONE cue for the cue card (under 10 words: what to do in that part, e.g. "Show the before and after. Name the one feeling."). Keep every number, name and fact from the user’s one-line description; invent nothing beyond plausible specifics they can change. Reply with JSON only: {"parts":[{"name":"'+st.parts.map(p=>p[0]).join('|')+'","line":"…","cue":"…"}]}';
  const msg='Pitch type: '+_piKindLabel()+'\nWho is in the room: '+_piRoomLabel()+'\nTime: '+PI.mins+' minutes\nThe pitch in one line: '+(PI.line||'(not given; pick a realistic example in their field)')+(S.rwField?'\nTheir field: '+S.rwField:'')+(opts.opening?'\n\nWrite ONLY a new, different opening for the first part ("'+PI.parts[0].name+'"); keep the other parts exactly as they are: '+JSON.stringify(PI.parts.map(p=>({name:p.name,line:p.text,cue:p.cue}))):'');
  try{
    const j=_jsonFrom(await callCoach(sys,msg,{maxTokens:600,featureId:'pitch-build'}));
    const arr=Array.isArray(j.parts)?j.parts:[];
    PI.parts.forEach((p,i)=>{const a=arr.find(x=>String(x.name||'').toLowerCase()===p.name.toLowerCase())||arr[i];if(a&&(!opts.opening||i===0)){p.text=String(a.line||'').replace(/^["“]|["”]$/g,'').slice(0,160);p.cue=String(a.cue||'').slice(0,80);}});
  }catch(e){PI.err=e;}
  PI.building=false;render();
}

  on('[data-act="end-room"]',async()=>{speakStop();if(PI.rec){await piAnswerStop();return;}if(PI.qa.length)piLanded();else{PI.phase=PI.take?'notes':'build';render();}});
  on('[data-act="pi-landed-retry"]',()=>piLanded());
  on('[data-act="new"]',()=>{PI={...PI,phase:'setup',parts:null,script:'',run:null,take:null,notes:null,qa:[],qIdx:0,panelQ:null,verdict:null};render();});
  if(ph==='room'&&PI.rec)recLevelLoop(app.querySelector('#pi-wave'));
}
// ═══════════════════════════════════════════════════════════════════════════
// QUICK ANSWER: one question, ten seconds to think (PREP), one minute to
// answer, then what worked and one fix. Keeps the streak.
// ═══════════════════════════════════════════════════════════════════════════
const QA_BANK={
  job:['Why should we hire you instead of someone with more experience?','What’s your biggest weakness?','Tell me about a time you failed. What did you learn?','Where do you see yourself in three years?','Why do you want this role?','Tell me about a project you’re proud of and your part in it.','What would your last manager say about you?','Tell me about a time you had to learn something fast.'],
  work:['Your manager asks: “You’ve been quiet. What do you think?”','Your project is two weeks late. What happened?','Give a 30-second update on your project.','A colleague says: “That won’t work here.” Respond.','Why should your project get the budget?','The room is stuck. Sum it up and suggest a next step.'],
  client:['A client asks: “Why are you more expensive than the others?”','A client asks: “Can you do it for half?” What do you say?','“We’ve talked to three agencies already. What makes you different?”','A client asks: “What exactly do I get for that price?”','“Can you start before the contract is signed?”','A client says: “We hate it. Start over.” Respond.','“If we sign today, can you knock off 20%?”'],
  people:['Someone at a party asks: “So, what do you do?”','“How do you know the host?”','“Any plans for the weekend?”','On a first date: “What’s something you’re looking forward to this year?”','“Why are you learning English? Yours is already good.”','A neighbor says: “Haven’t seen you around much lately!”']
};
const QA_GOAL_LABEL={job:'Job hunting · Interview',work:'At work · Tough question',client:'Clients · Price talk',people:'Meeting people · Conversation'};
let QA={phase:'q',goal:null,q:'',n:0,think:10,_iv:null,rec:false,elapsed:0,take:null,notes:null,loading:false,strong:null,strongLoading:false};
function _qaQuote(q){return /[“”]/.test(q)?escHtml(q):'“'+escHtml(_stripQ(q))+'”';}
function _qaGoals(){const g=(S.goals||[]).filter(k=>QA_BANK[k]);return g.length?g:Object.keys(QA_BANK);}
function _qaPick(shuffle){
  const goals=_qaGoals();const all=[];goals.forEach(g=>QA_BANK[g].forEach(q=>all.push({g,q})));
  const seen=new Set(_ttSeenList());
  let pool=all.filter(x=>!seen.has(x.q));if(!pool.length)pool=all;
  const it=shuffle?_pick(pool):pool[_kDayIdx(pool.length)];
  QA.goal=it.g;QA.q=it.q;
}
async function qaStart(){
  if(!_canStartSession()){openLimitSheet('month');return;}
  QA.phase='think';QA.think=10;render();
  clearInterval(QA._iv);
  QA._iv=setInterval(()=>{QA.think--;const r=document.getElementById('qa-ring');if(r){r.style.setProperty('--pct',Math.round((10-QA.think)/10*100)+'%');const d=r.querySelector('div');if(d)d.textContent=QA.think;}if(QA.think<=0){clearInterval(QA._iv);qaRecord();}},1000);
}
async function qaRecord(){
  clearInterval(QA._iv);QA.phase='rec';QA.rec=true;QA.elapsed=0;render();
  const ok=await recStart({onTick:r=>{QA.elapsed=r.elapsed;const t=document.getElementById('qa-timer');if(t)t.textContent=fmtMs(r.elapsed*1000);},maxSecs:60,onMax:()=>qaStop()});
  if(!ok){QA.rec=false;QA.phase='q';render();showToast('I can’t reach your microphone. Check the browser’s mic permission.','warn');return;}
  recLevelLoop(document.getElementById('qa-wave'));
}
async function qaStop(){
  if(!QA.rec)return;QA.rec=false;
  const r=await recStop();QA.take={transcript:r.transcript||'',words:r.words||0,elapsed:r.elapsed||0,blob:r.blob};
  QA.phase='notes';QA.loading=true;QA.notes=null;QA.strong=null;render();
  await recWhisper(QA.take);_ttMarkSeen(QA.q);_countSession();
  qaNotes();
}
async function qaNotes(){
  const tk=QA.take;
  if(tk.words<8){QA.notes={short:true};QA.loading=false;render();return;}
  if(!_aiOn()){QA.notes={off:true};QA.loading=false;render();return;}
  const view=QA.goal==='client'?K_CLIENT_VIEW:QA.goal==='people'?K_PEOPLE_VIEW:K_INTERVIEW_VIEW;
  const sys=K_VOICE+'\n'+K_PLAIN+'\n'+K_JUDGE+'\n'+view+'\nThe speaker had ten seconds to think and one minute to answer one question out loud. They were told to try PREP: Point, Reason, Example, Point. Judge the answer by whether a listener would be convinced, not by obedience to PREP; but when a PREP step is missing and it cost them, name the step.\nGROUNDING: every "quote" and "said" must be the speaker’s EXACT words from the transcript, copied character for character, 3 to 15 words. Never paraphrase.\nReply with JSON only: {"worked":{"quote":"exact words","why":"one short sentence on why it worked"},"fix":{"said":"exact words of the weakest moment","try":"a better line they could say, spoken, under 25 words","why":"one or two sentences; if a PREP step was missing, end with: That’s the <letter> in PREP."}}';
  const msg='Question: "'+QA.q+'"\nTranscript ('+fmtMs(tk.elapsed*1000)+', '+tk.words+' words):\n'+tk.transcript+nbContext('quick');
  try{
    const j=_jsonFrom(await callCoach(sys,msg,{maxTokens:380,featureId:'quick-eval'}));
    const ok=s=>s&&_rwxNorm(tk.transcript).includes(_rwxNorm(s));
    const w=j.worked||{},f=j.fix||{};
    QA.notes={worked:ok(w.quote)?{quote:String(w.quote),why:String(w.why||'')}:null,fix:ok(f.said)?{said:String(f.said),try:_stripQ(f.try||''),why:String(f.why||'')}:null};
    nbAdd({cat:'quick',title:_stripQ(QA.q),sub:QA_GOAL_LABEL[QA.goal]||'',elapsed:tk.elapsed,words:tk.words,wpm:tk.elapsed>0?Math.round(tk.words/(tk.elapsed/60)):0,tmin:20,tmax:60,fix:QA.notes.fix?'Instead of “'+QA.notes.fix.said+'”, say: “'+QA.notes.fix.try+'” '+QA.notes.fix.why:'',worked:QA.notes.worked?'“'+QA.notes.worked.quote+'” '+QA.notes.worked.why:'',tr:tk.transcript,extra:{html:_qaNotesHtml()}});
  }catch(e){QA.notes={err:e};}
  QA.loading=false;render();
}
async function qaStrong(){
  if(QA.strongLoading)return;
  if(QA.strong){speak(QA.strong,{voice:'ash',style:'You are K, a warm, confident communication coach, showing how a strong answer sounds out loud.'});return;}
  QA.strongLoading=true;render();
  try{
    const view=QA.goal==='client'?K_CLIENT_VIEW:QA.goal==='people'?K_PEOPLE_VIEW:K_INTERVIEW_VIEW;
    const sys=K_VOICE+'\n'+K_PLAIN+'\n'+view+'\nWrite a strong spoken answer to the question, first person, the way a confident person would say it out loud in about 40 seconds (80–110 words). Use PREP without naming it: point, one reason, one concrete example with a number or a detail, point again. No greeting, no labels. Reply with the answer only.'+(S.rwField?' The speaker works in '+S.rwField+'; pick an example that fits.':'');
    QA.strong=String(await callCoach(sys,'Question: "'+QA.q+'"',{maxTokens:260,featureId:'quick-eval'})).trim();
  }catch(e){showToast('K couldn’t write one just now');}
  QA.strongLoading=false;render();
  if(QA.strong)speak(QA.strong,{voice:'ash',style:'You are K, a warm, confident communication coach, showing how a strong answer sounds out loud.'});
}
function _qaNotesHtml(){
  const n=QA.notes;if(!n)return '';let h='';
  if(n.worked)h+='<div class="g-card"><div class="kn-h g-kick"><span class="g-plus">+</span>What worked</div><p class="sub" style="color:var(--ink);font-size:14.5px;margin-top:8px">“'+escHtml(n.worked.quote)+'” '+escHtml(n.worked.why)+'</p></div>';
  if(n.fix)h+='<div class="g-card"><div class="kn-h g-kick"><span class="g-minus">−</span>One fix</div><div class="g-said" style="margin-top:8px">“'+escHtml(n.fix.said)+'”</div><div class="g-better">“'+escHtml(n.fix.try)+'”</div><div class="g-why"><b>Why:</b> '+escHtml(n.fix.why)+'</div></div>';
  if(!n.worked&&!n.fix)h+='<div class="g-card"><div class="g-q">K couldn’t pin a line down.</div><p class="sub">Give it one more go with a full answer.</p></div>';
  return h;
}
function renderQuick(app){
  if(!QA.q)_qaPick(false);
  const ph=QA.phase,st=_streak();
  let h='<main class="scr p-pink">';
  if(ph==='q'){
    h+=gBar('Quick answer','hub');
    h+='<div class="v3-strip"><span class="n">'+st+'</span><span class="v3-st"><b>'+(st?'day streak':'Start a streak')+'</b><span>'+(_doneToday()?'Done today. One more won’t hurt.':st?'Answer today to keep it.':'One minute a day.')+'</span></span></div>';
    h+='<div class="g-block" style="flex:1;display:flex;flex-direction:column;min-height:300px"><div class="g-kick">'+(QA.n?'Another question':'Today’s question')+'</div><div class="g-big" style="font-size:28px;line-height:1.15">'+_qaQuote(QA.q)+'</div><div class="push" style="font-size:13px;font-weight:700;opacity:.75;padding-top:20px">'+escHtml(QA_GOAL_LABEL[QA.goal]||'')+'</div></div>';
    h+='<div class="g-row2"><button class="g-chip" style="min-height:56px;padding:0 18px" data-act="another">'+ic('shuffle','s')+'Another</button>'+gCta('I’m ready','ready')+'</div>';
  }else if(ph==='think'){
    h+=gBar('Quick answer','qa-back');
    h+='<div class="g-block"><div class="g-big" style="font-size:19px;margin-top:0">'+_qaQuote(QA.q)+'</div></div>';
    h+='<div class="center" style="gap:16px"><div class="g-kick">Think first</div><div class="g-ring" id="qa-ring" style="--pct:'+Math.round((10-QA.think)/10*100)+'%"><div>'+QA.think+'</div></div><p class="sub" style="font-weight:700;color:var(--ink)">Try PREP: Point, Reason, Example, Point.</p>'+techTag('prep')+'</div>';
    h+='<button class="g-ghost" data-act="skip">Skip · start now</button>';
  }else if(ph==='rec'){
    h+=gBar('Quick answer','qa-back');
    h+='<div class="g-block"><div class="g-big" style="font-size:19px;margin-top:0">'+_qaQuote(QA.q)+'</div></div>';
    h+='<div class="center" style="gap:14px"><div class="g-rec"><i></i>Recording</div><div class="g-timer" id="qa-timer">'+fmtMs(QA.elapsed*1000)+'</div><div class="sub" style="font-weight:700">of 1:00</div><div class="g-wave" id="qa-wave">'+'<i></i>'.repeat(19)+'</div></div>';
    h+='<button class="g-stop" data-act="stop" aria-label="Stop"></button><div style="height:4px"></div>';
  }else{
    h+=gBar('K’s notes','qa-back');
    if(QA.loading)h+='<div class="g-card" style="display:flex;flex-direction:column;gap:14px"><div class="g-k">'+kav()+'<div><b style="font-size:15px">K is listening back</b><div class="small" style="margin-top:2px">One thing that worked. One fix.</div></div></div><div class="stack" style="gap:9px"><div class="sk w9"></div><div class="sk w7"></div></div></div>';
    else if(QA.notes&&QA.notes.short)h+='<div class="g-card"><div class="g-q">I didn’t catch enough to judge that.</div><p class="sub">Answer for at least twenty seconds and I’ll find one fix.</p></div>';
    else if(QA.notes&&QA.notes.off)h+='<div class="g-card"><div class="g-q">AI is off, so no notes this time.</div></div>';
    else if(QA.notes&&QA.notes.err)h+=renderAIError(QA.notes.err,'qa-retry');
    else h+=_qaNotesHtml();
    if(!QA.loading&&_aiOn())h+='<div><button class="g-chip" data-act="strong"'+(QA.strongLoading?' disabled':'')+'>'+ic('play','s')+(QA.strongLoading?'K is writing one…':QA.strong?'Hear it again':'Hear a strong answer')+'</button></div>';
    if(QA.strong)h+='<div class="g-card"><div class="g-kick">A strong answer</div><p class="sub" style="color:var(--ink);margin-top:6px">'+escHtml(QA.strong)+'</p></div>';
    if(QA.take&&QA.take.transcript)h+='<details class="convo"><summary>'+ic('list','s')+'Show what you said · '+QA.take.words+' words</summary><div class="g-card"><div class="pre">'+escHtml(QA.take.transcript)+'</div></div></details>';
    h+='<div class="push"></div><div class="v3-strip"><span class="n">'+st+'</span><span class="v3-st"><b>day streak</b><span>'+(st?'Nice. See you tomorrow.':'Start it tomorrow too.')+'</span></span><button class="v3-qa" data-act="again">Again</button></div>';
  }
  h+='</main>';
  app.innerHTML=h;
  const on=(s,f)=>{const el=app.querySelector(s);if(el)el.addEventListener('click',f);};
  on('[data-act="another"]',()=>{_qaPick(true);QA.n++;render();});
  on('[data-act="ready"]',()=>qaStart());
  on('[data-act="skip"]',()=>qaRecord());
  on('[data-act="stop"]',()=>qaStop());
  app.querySelectorAll('[data-go="qa-back"]').forEach(b=>{b.removeAttribute('data-go');b.addEventListener('click',async()=>{clearInterval(QA._iv);speakStop();if(QA.rec){QA.rec=false;await recStop();}QA.phase='q';render();});});
  on('[data-act="qa-retry"]',()=>{QA.loading=true;render();qaNotes();});
  on('[data-act="strong"]',()=>qaStrong());
  on('[data-act="again"]',()=>{speakStop();_qaPick(true);QA.n++;QA.phase='q';QA.take=null;QA.notes=null;QA.strong=null;render();});
  if(ph==='rec'&&QA.rec)recLevelLoop(app.querySelector('#qa-wave'));
}
// ═══ Ask a good question: a short drill built on Kian's view of questions ═══
const ASK_SCENES=[
  {who:'A senior game composer',what:'just finished a talk on scoring her first big game. She mentioned she rewrote the main theme six times.'},
  {who:'Your teacher',what:'just explained why some melodies sound sad even in a major key. “Any questions?”'},
  {who:'The interviewer',what:'says: “That’s all from us. Do you have any questions for us?” The role is junior designer at a branding studio.'},
  {who:'A new client',what:'wants a logo that feels “premium but friendly” for a tea shop opening in March.'},
  {who:'A founder on a panel',what:'said the hardest part of their first year was letting a friend go.'},
  {who:'Your new manager',what:'in your first one-on-one, says: “So, anything you want to ask me?”'},
  {who:'A photographer you admire',what:'shows a series shot entirely on an old phone, and says the limits made it better.'},
  {who:'A mentor, over coffee',what:'tells you they nearly quit their career at thirty, then changed direction.'}
];
let ASK={i:0,q:'',res:null,loading:false,err:null};
function _askNew(){let i;do{i=Math.floor(Math.random()*ASK_SCENES.length);}while(ASK_SCENES.length>1&&i===ASK.i);ASK={i,q:'',res:null,loading:false,err:null};}
function openAsk(){_askNew();go('ask');}
async function askJudge(){
  const q=(ASK.q||'').trim();if(!q)return;
  const sc=ASK_SCENES[ASK.i];
  if(!_aiOn()){ASK.res={offline:true};render();return;}
  ASK.loading=true;ASK.err=null;render();
  const sys=K_VOICE+'\n'+K_PLAIN+'\nYou judge ONE question someone asked, by Kian’s standard. No question is stupid; the fear of asking is. A good question: comes from genuine curiosity; ties to something the person actually said (shows they listened); can’t be answered by a quick search; is short and open (how, why, what made you); fits the moment and respects the other person’s time. Find what worked first. Be encouraging and specific.\n\nReply with JSON only: {"verdict":"strong|good|weak","worked":"one short sentence on what worked, quoting a few of their words","fix":"one short sentence on the single change that would make it better (empty if strong)","better":"a better version of their question, in their voice, under 25 words"}';
  try{
    const raw=await callCoach(sys,'THE MOMENT: '+sc.who+' '+sc.what+'\n\nTHEIR QUESTION: '+q,{maxTokens:300,featureId:'ask-q'});
    const j=_jsonFrom(raw);
    ASK.res={verdict:/strong|good|weak/.test(j.verdict)?j.verdict:'good',worked:_clean(j.worked),fix:_clean(j.fix),better:_clean(j.better)};
  }catch(e){ASK.err=e;ASK.res={offline:true};}
  ASK.loading=false;render();
}
function renderAsk(app){
  if(ASK.i==null)_askNew();
  const sc=ASK_SCENES[ASK.i],r=ASK.res;
  let h='<main class="scr p-green">'+gBar('Ask a good question','library');
  h+='<div class="g-block"><div class="g-kick">The moment</div><div class="g-big" style="font-size:22px">'+escHtml(sc.who)+'</div><p style="margin-top:8px;font-size:15px;line-height:1.45;font-weight:500">'+escHtml(sc.what)+'</p></div>';
  if(!r){
    h+='<div class="g-card tight"><div class="g-row top"><span class="t"><b>Your turn</b><span>Ask one question. Something you’d genuinely want to know.</span></span></div></div>';
    h+='<textarea class="ask-in" id="ask-in" rows="3" placeholder="Type your question…">'+escHtml(ASK.q)+'</textarea>';
    h+='<div class="push"></div>'+gCta(ASK.loading?'K is reading it…':'Ask it','ask-go',{disabled:ASK.loading});
    h+='<button class="link case-peek" data-act="ask-new">Different moment</button>';
  }else{
    h+='<div class="g-card"><div class="g-kick">You asked</div><div class="case-line" style="margin-top:6px">“'+escHtml(ASK.q.trim())+'”</div></div>';
    if(r.offline){
      h+='<div class="g-card tight"><div class="g-k">'+kav()+'<b style="font-size:15px">Check it yourself</b></div>'+
        ['Does it tie to something they actually said?','Is it something you genuinely want to know?','Could you answer it with a quick search? (If yes, ask something else.)','Is it short and open: how, why, what made you…?'].map(x=>'<div class="g-row top"><span class="t"><span>'+escHtml(x)+'</span></span></div>').join('')+'</div>';
    }else{
      const V2={strong:'Strong question.',good:'Good question.',weak:'Not there yet.'}[r.verdict];
      h+='<div class="g-card"><div class="g-k">'+kav()+'<b style="font-size:16px">'+V2+'</b></div>'+(r.worked?'<p style="margin-top:10px;font-size:15px;line-height:1.45">'+escHtml(r.worked)+'</p>':'')+(r.fix?'<p style="margin-top:6px;font-size:15px;line-height:1.45;color:var(--ink-2)">'+escHtml(r.fix)+'</p>':'')+'</div>';
      if(r.better&&r.verdict!=='strong')h+='<div class="g-card case-k"><b style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)">Try it like this</b><div class="case-line">'+escHtml(r.better)+'</div></div>';
    }
    h+='<div class="g-chips"><button class="g-chip" data-tech="good-question">Ask a good question</button></div>';
    h+='<div class="push"></div>'+gCta('Next moment','ask-new',{icon:'again'});
    h+='<button class="link case-peek" data-act="ask-retry">Ask this one again</button>';
  }
  h+='</main>';
  app.innerHTML=h;wireCommon(app);
  const ta=app.querySelector('#ask-in');if(ta)ta.addEventListener('input',()=>{ASK.q=ta.value;});
  const on=(s,f)=>{const b=app.querySelector(s);if(b)b.addEventListener('click',f);};
  on('[data-act="ask-go"]',askJudge);
  on('[data-act="ask-new"]',()=>{_askNew();render();});
  on('[data-act="ask-retry"]',()=>{ASK.res=null;ASK.q='';render();});
}
