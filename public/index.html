<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ground">
<meta name="theme-color" content="#EEF1F4">
<meta name="description" content="Ground by KIAN HOW. Know what to say now. Practice what's coming.">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Ground by KIAN HOW</title>
<style>
/* ═══ Ground by KIAN HOW · stylesheet ═══
   Tokens are TM Companion's T1 tokens (unchanged) plus the handoff's new ones.
   One font family (system), weight does the work. Colour blocks are the tool pastels. */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --pad:18px;--gap:14px;--app-w:440px;
}
html[data-theme="light"]{color-scheme:light;
  --bg:#EEF1F4; --ink:#141A21; --ink-2:#4E5866; --ink-3:#5F6876;
  --card:#FFFFFF; --line:rgba(20,26,33,.08); --shadow:0 1px 2px rgba(20,26,33,.05),0 4px 14px rgba(20,26,33,.04);
  --seg-bg:#E1E5EA; --seg-on:#141A21; --seg-on-ink:#fff;
  --k-bg:#E3E8EE; --k-line:rgba(20,26,33,.06);
  --hero-bg:#141A21; --hero-ink:#fff; --hero-ink-2:rgba(255,255,255,.62); --hero-line:rgba(255,255,255,.12); --hero-track:rgba(255,255,255,.14);
  --wash:7%; --ico-tint:9%; --row-tint:5%; --icon-btn-bg:#FFFFFF;
  --h:#C4AEFF; --h-ink:#120C24;
  --c:#6447D6; --c-fill:#5336C9; --c-ink:#FFFFFF;
  --pri:#5336C9; --pri-ink:#FFFFFF;
  --ok:#2E7D4F; --warn:#A65A12; --err:#C23B3B;
  --scrim:rgba(20,26,33,.42);
  --strip:#141A21;--strip-line:transparent;
}
html[data-theme="dark"]{color-scheme:dark;
  --bg:#0B0C10; --ink:rgba(255,255,255,.95); --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.48);
  --card:#14171B; --line:rgba(255,255,255,.07); --shadow:none;
  --seg-bg:#15171C; --seg-on:#24272E; --seg-on-ink:#fff;
  --k-bg:#111317; --k-line:rgba(255,255,255,.06);
  --hero-bg:#14171B; --hero-ink:rgba(255,255,255,.95); --hero-ink-2:rgba(235,235,245,.58); --hero-line:rgba(255,255,255,.07); --hero-track:rgba(255,255,255,.08);
  --wash:12%; --ico-tint:13%; --row-tint:8%; --icon-btn-bg:#14171B;
  --h:#C4AEFF; --h-ink:#120C24;
  --c:#C4AEFF; --c-fill:#C4AEFF; --c-ink:#120C24;
  --pri:#C4AEFF; --pri-ink:#120C24;
  --ok:#8FD6A8; --warn:#F5C27A; --err:#F29191;
  --scrim:rgba(0,0,0,.6);
  --strip:#1B1E24;--strip-line:rgba(255,255,255,.07);
}
/* tool colours */
.c-reply{--c:#6447D6;--c-fill:#5336C9;--c-ink:#fff}
.c-real{--c:#0E8C8C;--c-fill:#0E8C8C;--c-ink:#fff}
.c-speech{--c:#C2681B}.c-quick{--c:#C2457A}.c-outline{--c:#1F7FA8}.c-note{--c:#4C5FD6}
.c-clash{--c:#C2365B}html[data-theme="dark"] .c-clash{--c:#F2A0B6}
.c-job{--c:#6447D6}.c-work{--c:#1F7FA8}.c-money{--c:#3D8B3D}.c-people{--c:#C2681B}
html[data-theme="dark"] .c-reply{--c:#C4AEFF;--c-fill:#C4AEFF;--c-ink:#120C24}
html[data-theme="dark"] .c-real{--c:#7FE0E0;--c-fill:#7FE0E0;--c-ink:#06201F}
html[data-theme="dark"] .c-speech{--c:#EDB176}html[data-theme="dark"] .c-quick{--c:#F6A8C8}
html[data-theme="dark"] .c-outline{--c:#8FD3F0}html[data-theme="dark"] .c-note{--c:#B6C9FF}
html[data-theme="dark"] .c-job{--c:#C4AEFF}html[data-theme="dark"] .c-work{--c:#8FD3F0}
html[data-theme="dark"] .c-money{--c:#A9D98E}html[data-theme="dark"] .c-people{--c:#EDB176}
/* pastels: the same in both themes */
.p-lav{--p:#C4AEFF;--pi:#120C24;--pd:#5336C9}
.p-teal{--p:#7FE0E0;--pi:#06201F;--pd:#0B6E6E}
.p-pink{--p:#F6A8C8;--pi:#2A0A18;--pd:#A8325F}
.p-org{--p:#EDB176;--pi:#2A1405;--pd:#9A4F12}
.p-blue{--p:#8FD3F0;--pi:#06202B;--pd:#17668A}

/* ── base ── */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
p,h1,h2,h3,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;text-align:left;cursor:pointer;-webkit-appearance:none}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
a{color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:16px;height:16px;stroke-width:2.1}
.ic.l{width:24px;height:24px}
.grow{flex:1;min-height:0}
.push{margin-top:auto}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.t{gap:6px}
.rowx{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hide{display:none!important}
/* screen root: what the designer's .phone becomes in the app */
#app{min-height:100dvh}
.scr{position:relative;min-height:100dvh;max-width:var(--app-w);margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);padding:calc(var(--sat) + 14px) var(--pad) calc(var(--sab) + 18px);background:var(--bg);color:var(--ink)}
.scr.tall{min-height:100dvh}
@media (max-width:380px){:root{--pad:16px;--gap:10px}}

/* ── type ── */
.kick{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.kick.g{color:var(--c)}
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.h1.xl{font-size:34px;letter-spacing:-.025em;line-height:1.08}
.h2{font-size:17px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.sub{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.small{font-size:12px;color:var(--ink-3);line-height:1.4}
.big-serif{font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:800;color:var(--ink);text-wrap:pretty}
.center-t{text-align:center}

/* ── mark ── */
.wm{display:inline-flex;align-items:center;gap:7px}
.wm b{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);line-height:1}
.wm i{display:block;width:3px;height:3px;border-radius:50%;background:var(--ink-3)}
.wm small{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;line-height:1}

/* ── header ── */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;flex-shrink:0}
.ibtns{display:flex;gap:8px}
.ibtn{position:relative}
.ibtn-dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#7C5CF0;box-shadow:0 0 0 2px var(--bg)}
.top-btns{display:flex;gap:6px}
.bar{display:flex;align-items:center;gap:12px;min-height:44px;flex-shrink:0}
.ibtn{width:44px;height:44px;border-radius:13px;background:var(--icon-btn-bg);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.ibtn.r{border-radius:50%;box-shadow:var(--shadow);color:var(--ink)}
.skip{min-height:44px;padding:0 4px;font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;text-decoration:underline;text-underline-offset:3px}

/* ── buttons ── */
.btn{min-height:50px;border-radius:16px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 18px;flex-shrink:0}
.btn-pri{background:var(--pri);color:var(--pri-ink)}
.btn-pri[disabled]{opacity:.35}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.sb{justify-content:space-between}
.btn-text{min-height:44px;font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;width:100%;text-decoration:underline;text-underline-offset:3px}
.btn-row{display:flex;gap:8px;flex-shrink:0}
.btn-row>*{flex:1}

/* ── cards ── */
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:14px 16px;flex-shrink:0}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:16px;flex-shrink:0}
html[data-theme="dark"] .hero{background:linear-gradient(180deg,color-mix(in srgb,var(--h) 8%,transparent) 0%,var(--hero-bg) 70%);border:1px solid color-mix(in srgb,var(--h) 22%,transparent)}
.hero .kick{color:var(--h);font-size:10px;letter-spacing:.12em}
.hero .sub{color:var(--hero-ink-2)}
.hero h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:8px 0 4px}
.hero .lede{font-size:12.5px;color:var(--hero-ink-2);line-height:1.4}
.hero-row{display:flex;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--hero-line)}
.hero-row>*{flex:1}
.btn-h{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:11px;font-size:14px;font-weight:800;background:var(--hbtn,var(--h));color:var(--hbtn-ink,var(--h-ink))}
.btn-h.teal{--hbtn:#7FE0E0;--hbtn-ink:#06201F}
.btn-hg{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:11px;font-size:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid var(--hero-line);color:var(--hero-ink)}

/* K */
.kav{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(140deg,#6DB6B4,#3B6766);display:block}
.kav img{width:100%;height:100%;object-fit:cover;display:block}
.kav.xs{width:24px;height:24px}.kav.m{width:44px;height:44px}.kav.l{width:72px;height:72px}
.kmark{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.kline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--k-bg);border:1px solid var(--k-line);flex-shrink:0;width:100%}
.kline .kav{width:24px;height:24px}
.kline p{flex:1;min-width:0;font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.kline p b{color:var(--ink);font-weight:600}

/* steps */
.steps{display:flex;gap:6px;flex-shrink:0}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--seg-bg)}
.steps i.on{background:var(--c-fill)}

/* option cards (onboarding) */
.opt{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:74px;width:100%;box-shadow:var(--shadow)}
.opt .oi{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--c) var(--ico-tint),transparent);display:grid;place-items:center;color:var(--c);flex-shrink:0}
.opt .ot{flex:1;min-width:0}
.opt b{display:block;font-size:15px;font-weight:700;letter-spacing:-.005em}
.opt .ot>span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex-shrink:0;color:transparent}
.opt.on{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) var(--wash),var(--card));padding:13px 15px}
.opt.on .oi{background:color-mix(in srgb,var(--c) 16%,transparent)}
.on>.tick,.opt.on .tick{background:var(--c);border-color:var(--c);color:var(--card)}

/* field tiles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);width:100%}
.tile .ic{color:var(--ink-2)}
.tile.on{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) var(--wash),var(--card))}
.tile.on .ic{color:var(--c)}

/* hub secondary tile (last session) */
.tl{display:flex;flex-direction:column;min-width:0;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);width:100%}
.tl .ico{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) var(--ico-tint),transparent);color:var(--c);display:grid;place-items:center;flex-shrink:0}
.tl .ico .ic{width:17px;height:17px}
.tl b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .tsub{font-size:12.5px;line-height:1.35;color:var(--ink-2)}
.tl.wide{flex-direction:row;align-items:center;gap:12px;padding:14px 16px;border-radius:22px}
.tl.wide .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.v3-lib{display:flex;align-items:stretch;gap:8px;flex-shrink:0}
.v3-lib .lib-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-left:5px solid var(--c)}
.v3-lib .lib-main small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.v3-lib .lib-main b{font-size:15.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v3-lib .lib-all{flex-shrink:0;width:84px;border-radius:22px;background:#141A21;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:800}
.v3-lib .lib-all span{font-size:11px;font-weight:700;opacity:.6}
.v3-lib .lib-all .ic{color:#C4AEFF}
html[data-theme="dark"] .v3-lib .lib-all{background:#24272E;border:1px solid rgba(255,255,255,.08)}
.lib-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px 14px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.lib-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex-shrink:0;align-self:flex-start;margin-top:5px}
.lib-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lib-t small{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.lib-t b{font-size:16px;font-weight:700;line-height:1.28}
.lib-t>span{font-size:13.5px;color:var(--ink-2)}
.lib-row>.ic{color:var(--ink-3);flex-shrink:0}
.lib-chips{flex-wrap:wrap}
.case-line{font-size:18px;font-weight:700;line-height:1.4;letter-spacing:-.01em;margin-top:10px}
.case-pr{display:flex;flex-direction:column;gap:6px;padding:4px 2px}
.case-pr small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.case-pr b{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.case-pr span{font-size:15px;line-height:1.45;color:var(--ink-2)}
.case-story p{font-size:15px;line-height:1.55;margin-top:10px;color:var(--ink)}
.hub-last .hub-fix{white-space:normal;text-overflow:clip;font-size:15px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go-sm .ic{margin-right:4px}
.go-sm{flex-shrink:0;min-height:44px;padding:0 13px;border-radius:999px;background:color-mix(in srgb,var(--c) var(--ico-tint),transparent);color:var(--c);font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) var(--wash),var(--card));font-weight:700}
.tag{position:relative;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.tag::after{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.tag.k{background:var(--k-bg);border-color:transparent;color:var(--ink-2)}

/* inputs */
.fieldset{display:flex;flex-direction:column;gap:6px}
.lab{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.inp{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:15px;color:var(--ink);width:100%;box-shadow:var(--shadow);outline:none}
.inp:focus{border-color:var(--ink-3)}
.inp::placeholder,.paste::placeholder,.g-paste::placeholder{color:var(--ink-3)}
.inp.ok{border:1.5px solid var(--ok)}
.inp.bad{border:1.5px solid var(--err)}
.inp.code{font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.inline-in{display:flex;gap:8px}
.inline-in .inp{flex:1;min-width:0}
.inline-in .btn{width:auto;min-height:48px;border-radius:14px;font-size:14.5px;padding:0 16px}
.device{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.device .ic{color:var(--c);margin-top:1px}

/* list rows */
.list{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:2px 14px;flex-shrink:0}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 0;width:100%}
.row+.row{border-top:1px solid var(--line)}
.ri{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) var(--ico-tint),transparent);color:var(--c);display:grid;place-items:center;flex-shrink:0}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.rt span{display:block;font-size:12px;color:var(--ink-2);margin-top:1px;line-height:1.35}
.rv{font-size:13px;color:var(--ink-2);font-weight:600;white-space:nowrap}
.chev{color:var(--ink-3)}
.sect{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:4px 2px -4px}
.quiet{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:center;flex-shrink:0}
.empty{border:1.5px dashed color-mix(in srgb,var(--ink-3) 40%,transparent);border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;flex-shrink:0}
.empty p{font-size:13px;color:var(--ink-2);line-height:1.45}
.empty b{color:var(--ink)}

/* loading */
.think{display:flex;gap:5px;align-items:center;height:20px}
.think i{width:7px;height:7px;border-radius:50%;background:var(--c);opacity:.35;animation:gr-dot 1.2s infinite}
.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes gr-dot{40%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.think i{animation:none;opacity:.7}}

function ic(k,cls){return '<svg class="ic'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+(IC[k]||'')+'</svg>';}
function kav(cls){return '<span class="kav'+(cls?' '+cls:'')+'"><img src="'+COACH_AVATAR+'" alt="K"></span>';}
// Top bar. When back doesn't lead to the hub, a hub button sits at the right: one rule, one place.
const HUB_BTN='<button class="g-back g-home" data-go="hub" aria-label="Hub"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Hub</span></button>';
function gBar(title,back,dots){back=back||'hub';return '<div class="g-bar"><button class="g-back" data-go="'+back+'" aria-label="Back">'+ic('back')+'</button><h1>'+escHtml(title)+'</h1>'+(dots?'<div class="g-dots" aria-hidden="true">'+dots.map((_,i)=>'<i'+(dots[i]?' class="on"':'')+'></i>').join('')+'</div>':'')+(back!=='hub'?HUB_BTN:'')+'</div>';}
function gDots(n,on){const a=[];for(let i=0;i<n;i++)a.push(i===on);return a;}
function gCta(label,action,opts){opts=opts||{};return '<button class="g-cta'+(opts.sec?' sec':'')+'" data-act="'+action+'"'+(opts.disabled?' disabled':'')+(opts.style?' style="'+opts.style+'"':'')+'>'+escHtml(label)+'<span class="ar">'+ic(opts.icon||'arrow','s')+'</span></button>';}

// ── Toast & sheets ────────────────────────────────────────────────────────
function showToast(msg,iconKey){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.innerHTML=(iconKey?ic(iconKey,'s'):'')+'<span>'+escHtml(msg)+'</span>';
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);
}
function openSheet(html,opts){
  opts=opts||{};closeSheet();
  const sc=document.createElement('div');sc.className='scrim';sc.id='scrim';
  const sh=document.createElement('div');sh.className='sheet'+(opts.cls?' '+opts.cls:'');sh.id='sheet';sh.setAttribute('role','dialog');
  sh.innerHTML='<div class="grab"></div>'+html;
  document.body.appendChild(sc);document.body.appendChild(sh);
  sc.addEventListener('click',()=>{closeSheet();if(opts.onClose)opts.onClose();});
  sh.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{closeSheet();if(opts.onClose)opts.onClose();}));
  if(opts.wire)opts.wire(sh);
  return sh;
}
function closeSheet(){['scrim','sheet'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true;}catch(e2){return false;}
  }
}

// ── Router ─────────────────────────────────────────────────────────────────
const HASH_FOR_VIEW={hub:'home',reply:'reply',real:'practice',pitch:'pitch',quick:'quick',settings:'settings',notebook:'notebook',library:'library',sync:'sync',owner:'owner'};
const VIEW_FOR_HASH=Object.fromEntries(Object.entries(HASH_FOR_VIEW).map(([v,h])=>[h,v]));
function _stopAll(){try{if(typeof REC!=='undefined'&&REC.active)recStop();}catch(e){}try{speakStop();}catch(e){}
  try{if(typeof QA!=='undefined'){clearInterval(QA._iv);QA.rec=false;if(QA.phase==='think'||QA.phase==='rec')QA.phase='q';}}catch(e){}
  try{if(typeof RW!=='undefined')RW.rec=false;if(typeof PI!=='undefined'){if(PI.rec&&PI.phase==='run'){PI.run=null;PI.phase=PI.parts?'build':'setup';}PI.rec=false;}}catch(e){}}
function go(view,extra){
  closeSheet();
  if(view!==V.view)_stopAll();
  if(view==='settings'&&V.view!=='settings'){V.setPage='';V._spFromHub=false;}
  if(extra)Object.assign(V,extra);
  V.view=view;render();
  const h=HASH_FOR_VIEW[view];
  try{history.replaceState(null,'',location.pathname+location.search+(h&&h!=='home'?'#'+h:''));}catch(e){}
}
function render(){
  const app=document.getElementById('app');
  if(!app)return;
  closeSheet();
  if(!S.onboarded&&V.view!=='owner'){return renderOnboarding(app);}
  const R={hub:renderHub,reply:renderReply,real:renderReal,pitch:renderPitch,quick:renderQuick,settings:renderSettings,notebook:renderNotebook,advice:renderAdvice,library:renderLibrary,case:renderCase,'nb-entry':renderNbEntry,sync:renderSync,owner:renderOwner,ask:renderAsk};
  const fn=R[V.view]||renderHub;
  fn(app);
  renderHubPill();
  window.scrollTo(0,0);
  wireCommon(app);
}
// The Hub pill: on every screen except the hub, onboarding, and the dark live screens
function renderHubPill(){
  let b=document.getElementById('hubpill');
  const scr=document.querySelector('#app .scr');
  const show=false; // replaced by the hub button in the top bar
  document.body.classList.toggle('has-hub',!!show);
  if(!show){if(b)b.remove();return;}
  if(!b){b=document.createElement('button');b.id='hubpill';b.setAttribute('aria-label','Hub');b.innerHTML='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Hub</span>';
    b.addEventListener('click',()=>{V.setPage='';go('hub');});document.body.appendChild(b);}
}
function wireCommon(root){
  root.querySelectorAll('[data-go]').forEach(b=>{if(b.__wired)return;b.__wired=true;b.addEventListener('click',()=>{const v=b.dataset.go;if(v==='back'){goBack();}else go(v);});});
  root.querySelectorAll('[data-tech]').forEach(b=>{if(b.__wired)return;b.__wired=true;b.addEventListener('click',e=>{e.stopPropagation();openTechnique(b.dataset.tech);});});
  root.querySelectorAll('[data-whatsnew]').forEach(b=>{if(b.__wired)return;b.__wired=true;b.addEventListener('click',openWhatsNew);});
}
function goBack(){if(V._back){const b=V._back;V._back=null;go(b);}else go('hub');}
function openWhatsNew(){
  let h='<h2 class="h2">What’s new</h2>';
  CHANGELOG.forEach(c=>{h+='<div class="kick" style="margin-top:4px">Version '+escHtml(c.v)+' · '+escHtml(c.d)+'</div><ul class="stack t" style="margin-top:6px">'+c.items.map(i=>'<li class="sub">· '+escHtml(i)+'</li>').join('')+'</ul>';});
  h+='<button class="btn btn-pri" data-close>Got it</button>';
  S.whatsNew=APP_VERSION;save();
  openSheet(h);
}

// ── Boot ───────────────────────────────────────────────────────────────────
function boot(){
  load();
  if(typeof _syInit==='function')_syInit();
  if(typeof _ownerLink==='function')_ownerLink();
  const h=(location.hash||'').replace('#','');
  if(h==='owner'||/^owner=/.test(h))V.view='owner';
  else if(VIEW_FOR_HASH[h])V.view=VIEW_FOR_HASH[h];
  render();
  // What's new no longer pops up on its own; it lives in Settings › About
  if(S.onboarded&&S.whatsNew!==APP_VERSION){S.whatsNew=APP_VERSION;save();}
  window.addEventListener('hashchange',()=>{const h2=(location.hash||'').replace('#','');if(VIEW_FOR_HASH[h2]&&VIEW_FOR_HASH[h2]!==V.view){V.view=VIEW_FOR_HASH[h2];render();}});
}
window.render=render;
document.addEventListener('DOMContentLoaded',boot);

// K's logic: the shared prompt pieces every feature is coached from, the
// technique library (tap to learn), and K's line for today on the hub.
// Sources: Kian's book draft, TM Companion's K prompts, the positioning doc.
// ═══════════════════════════════════════════════════════════════════════════
const K_VOICE=`You are K, Kian How's voice as a communication coach. Kian is a creative entrepreneur with more than twenty years across music, creative work, coaching and business, in-house and freelance (his projects include Dishonored, Genshin Impact, Wolf Warrior), and years of coaching speakers. K coaches the way Kian does: firm with the diagnosis, warm with the delivery, direct, a little playful, never preachy. Always make them want to go again. Find what genuinely worked before coaching anything. Teach the idea, not a formula: one principle plus one line to say, never a script to memorize.`;
const K_PLAIN=`PLAIN ENGLISH: many users are not native English speakers. Short sentences, everyday words. No business jargon or idioms (never 'floor', 'anchor', 'leverage', 'concession', 'scope creep', 'bottom line', 'move the needle', 'ballpark'). Say 'lowest price', 'first price', 'give something', 'extra work' instead. American English.`;
const K_JUDGE=`How K judges communication: the question is a door, not a destination. A textbook answer to the literal question is robotic. The best communicators reframe, bridge or redirect so that their answer becomes the point, and still leave the listener satisfied. Judge the quality and skill of the communication, not obedience to a template. Judge the shape the speaker actually used before comparing it with an ideal one. One idea fully committed to beats five half-explored; most of the time the fix is to cut. The line is honesty: a bridge or reframe must stay truthful; never coach inventing facts or misleading anyone, and say so plainly if an answer crosses that line. Small habits worth one line if they recur: opening with "That's a great question", "to be honest" (it implies the rest wasn't), long thank-you warm-ups.`;
const K_CLIENT_VIEW=`How K sees client work (the coach's own view; let it shape the diagnosis without lecturing):
- Client work is a value exchange, and what decides the terms is how much you have to stand on. A newcomer has little to show yet, which is exactly why clients press them on price and terms.
- Never think like a mere service provider. Something about you must stand out from a pool of similarly manufactured talent. Know what you are really selling (the result, the experience of working with you, reliability, peace of mind; not your hours) and say it. Aim to be the standard, not the best: common is common.
- Clients don't care about your technique; they care whether you solve their problem. Talk about their problem, keep it simple.
- Market rate is only a reference: what others agreed was acceptable. Never treat it as a rule you must justify yourself against.
- Never belittle your own value to get the gig: if they know you’ll take less, why would they pay more? Say yes to less only for a reason: you believe in the project, it brings repeat work, or you get a share of the upside.
- A soft no costs more than a firm one. Saying no to cheap work buys time for your own.
- Know three numbers before you talk: your price, your lowest price, and how much of the gap you will defend. Know when to say no and walk away. Not every client is your client; walking away politely is a legitimate result.
- Build a buffer of 10–20% into your price, so a discount doesn't hurt you. When they ask for a discount, give them something: a real 10–20%, or something extra (a free revision, a faster start) instead of money. A flat no can let the deal go cold. But never cut far: going from 100 to 20 makes your price look like a joke, and you with it. A discount request is a test of how far they can push; know where you hold the line.
- If you give something, get something back: a smaller scope, phased payment, a longer timeline, a credit, more work later. Racing to the bottom to "get a foot in the door" teaches the client you are cheap.
- "Do this one free and I'll give you ten paid ones": judge the person. Trustworthy with real potential is a calculated risk; hot air gets a polite no.
- Two valid ways to open on price: name yours first (you take the high ground but might pitch below their budget) or let them name a range first. Neither is wrong. Every client is a new judgment call; for someone without experience, practice is the substitute.
- You are the brand. A consistent position reads as confidence; changing your story under pressure reads as uncertainty. Warm and firm go together.
- There is no perfect project and no perfect client. New requests, approved work rejected later, rude people, unreasonable demands: managing your own emotions is part of the job. Big names can pay little and label you for years; weigh the name against the pay.
If the speaker's situation includes their price or the lowest they will accept, judge whether they kept to it, and say so plainly.`;
const K_INTERVIEW_VIEW=`How K sees interviews and introductions: bring something you did, not your grades (a sold-out student show beat a 4.0 GPA in Kian's first interview). Lead with one story only you can tell. Many interviews are just a conversation: be someone they'd like to work with. Soft skills beat raw talent; the most gifted people who struggle are the ones who can't explain their value.`;
const K_PEOPLE_VIEW=`How K sees talking to people: it's a skill, not a personality (Kian was an introvert who scared customers away and learned to act outgoing). Connection matters as much as content. Answer, add one detail they can pick up, hand it back. Listening beats jumping topics. When you need help, admit it, be courteous, and offer something back. Take criticism with grace: don't defend, ask how to improve; managing your emotions is often worth more than your skills. With someone senior, decide where you stand: near-peers meet as equals, real veterans get your curiosity. No question is stupid, but think it through and ask what you genuinely want to know. Starting out, enthusiasm and a willingness to take direction are your biggest assets. Never coach pickup lines, tricks or pressure; coach curiosity and being comfortably yourself.`;
const K_CONFLICT_VIEW=`How K sees disagreement (Kian’s view; let it shape the diagnosis without lecturing): Read the leverage first: what to do depends on the stakes and who holds the power. You are hired to do a job, not to win the creative argument, unless you own the outcome. Pick your moment with a boss: push back only when they are open to options; praise first, frame it as a discussion, and let them make the call. A lot of nitpicking is a show for their own boss; don’t take it personally. Never be a pushover: push back just enough. Whatever happens, don’t let it happen twice. If money fixes it and you can afford it, pay; if not, offer something real instead (like future work). Argue from the greater good, not your ego. A professional gets paid, is reliable and communicates with respect. When instructions are vague, confirm them in writing; if you are blamed anyway, tell an honest mistake (sort it out privately) from a power play (show the record, take it higher if needed). Extra hours early in a career can be training, within reason; mid-career, protect your health and boundaries. Stay honest: never coach lying, blaming others or threatening people.`;
const K_RULES='If the transcript is very short (under 15 words, mostly silence, or clearly incomplete) reply with exactly: "No worries, let\'s give it another go." Nothing else.';

// ── Techniques (tap to learn). Each: title · summary · how · watch · from · outcome ──
const TECHNIQUES={
  'warm-then-firm':{title:'Warm, then firm',sum:'Start warm, so the no that follows doesn’t feel like a fight.',how:'One real sentence of warmth first ("I’m glad the concepts landed"). Then the firm part, plainly, with a reason. No apology between them.',watch:'Warmth without the firm part is just agreeing. The firm part without warmth reads as cold, and the deal goes quiet.',from:'Kian’s principle: warm and firm go together. A consistent, friendly position reads as confidence.',out:'The no doesn’t feel like a fight.'},
  'give-to-get':{title:'Give to get',sum:'If you give something, get something back. Never just drop the price.',how:'When they ask for less, trade: a smaller scope, two payments, a later deadline, a credit, more work later. Say what you give and what you get in the same sentence.',watch:'Racing to the bottom to "get a foot in the door" teaches the client you’re cheap. A gift is remembered as the new normal.',from:'Kian’s rule from twenty years of being pressed on price: a lower price buys less work.',out:'You never just drop the price.'},
  'two-good-options':{title:'Two good options',sum:'Give them two ways to say yes, not a yes-or-no.',how:'Offer the full scope at your price, and a smaller scope at theirs. Then ask: "Which works better?" Both are deals you’re happy with.',watch:'Never make one option a fake. If you wouldn’t be glad to do it, don’t offer it.',from:'Kian’s practice: clients like a good deal; let them pick one, not argue one.',out:'They choose between two yeses.'},
  'know-your-lowest':{title:'Know your lowest',sum:'Know your price, your lowest, and how much of the gap you’ll defend, before you talk.',how:'Write three numbers down before the conversation. Above your lowest, trade. At it, hold. Below it, a polite no, or walk away.',watch:'Deciding your lowest in the conversation means they decide it for you. Not every client is your client.',from:'Kian: "Know your lowest price, how much to defend, and when to say no and walk away."',out:'You don’t agree to a bad deal.'},
  'buffer':{title:'The 10–20% buffer',sum:'Build 10–20% into your price so a discount never hurts you.',how:'Quote with the buffer in. When they ask for a discount, give it from the buffer, or give something extra (a free revision, a faster start) instead of money.',watch:'A discount bigger than 20% makes your first price look like a joke, and you with it. Everyone likes a good deal; nobody likes a joke.',from:'Kian’s discount policy, from the book: give 10–20% right away, or a perceived discount through value added.',out:'You can say yes to a discount and still get paid.'},
  'anchoring':{title:'Anchoring',sum:'The first number said becomes the one everyone argues around.',how:'Say your price first, with a reason. Then talk about what changes (scope, timing), never the number.',watch:'A high number with no reason costs you trust. Always give the why. And if you name first, you might pitch below their budget: it’s a judgment call.',from:'Tversky and Kahneman’s research on judgment (1974). Now a staple of negotiation training.',out:'Your number stays the reference point.'},
  'walk-away':{title:'Know your walk-away',sum:'Know what you’ll do if there is no deal, before you need to.',how:'Name your other option to yourself: another client, a smaller project, waiting. Then you can say no calmly, because no isn’t the end of the world.',watch:'Bluffing a walk-away you don’t have gets called. Have a real one, even a small one.',from:'Called BATNA in negotiation books (Fisher and Ury, Getting to Yes). Kian: not every client is your client.',out:'You don’t cave under pressure.'},
  'labeling':{title:'Labeling',sum:'Say out loud what they seem to feel, before you answer.',how:'"It sounds like the budget is the real worry." Then pause. People relax when they feel understood, and often tell you more.',watch:'Guess gently ("it sounds like", "it seems"). A wrong label stated as fact annoys people.',from:'Chris Voss calls it tactical empathy (Never Split the Difference).',out:'Calms a skeptical room.'},
  'monroe':{title:'Monroe’s Motivated Sequence',sum:'Attention, Need, Satisfaction, Visualization, Action. The oldest pitch structure that still works.',how:'Open with something that gets attention. Name the need they feel. Show your answer. Help them picture it working. Ask for one clear action.',watch:'Most pitches skip Visualization and jump to the ask. The picture is what makes people say yes.',from:'Alan Monroe, Purdue University, 1930s. Still taught in every persuasion course.',out:'Moves people from interest to action.'},
  'bottom-line-first':{title:'Bottom line first',sum:'Say your point in the first 30 seconds. Then the reasons.',how:'First sentence: what you want and why it matters to them. Then two or three reasons. Then the ask again.',watch:'Busy people stop listening if the point hasn’t arrived in 30 seconds. Background first is for essays, not pitches.',from:'Military briefings (BLUF) and newsroom writing (the inverted pyramid).',out:'Busy people get your point in 30 seconds.'},
  'rule-of-3':{title:'Rule of 3',sum:'Three points. Not two, not five.',how:'Pick the three things that matter most to this listener. Say them, number them, come back to them at the end.',watch:'Three vague points are worse than one sharp one. Each point needs one proof.',from:'Classical rhetoric; people remember threes.',out:'They remember your points.'},
  'star':{title:'STAR stories',sum:'Situation, Task, Action, Result. Proof that sounds real, not like bragging.',how:'One line of situation. What you had to do. What you actually did (say "I", not "we"). What happened, with a number if you have one.',watch:'Most people skip the Result. The result is the proof.',from:'Behavioral interviewing, used by most large employers.',out:'Proof sounds real, not like bragging.'},
  'pppp':{title:'Pace, pitch, power, pause',sum:'Four dials in your voice. Change one and people listen again.',how:'Slow down for the line that matters. Drop your pitch at the end of a sentence to sound sure. Add power on the one word that counts. Then pause and let it land.',watch:'Pausing feels long to you and short to the room. Double what feels natural.',from:'Classic vocal variety training.',out:'Keeps attention, key lines land.'},
  'aab':{title:'Acknowledge, answer, bridge',sum:'Name the worry, answer it straight, then bring it back to your point.',how:'"That’s a fair worry (acknowledge). Here’s what happens if it doesn’t work (answer). That’s why month one is a test (bridge)."',watch:'Bridging without answering sounds like dodging. Answer first, every time.',from:'Standard in media and spokesperson training.',out:'Handle hard questions without getting defensive.'},
  'prep':{title:'PREP',sum:'Point, Reason, Example, Point. A clear answer in under a minute.',how:'Say your answer first. Give one reason. Prove it with a real example. Say your point again.',watch:'The example is the part people skip, and it’s what makes you believable.',from:'A common structure in public-speaking and business-communication training.',out:'A clear answer in under a minute.'},
  'pivot':{title:'The pivot',sum:'The question is a door, not a destination.',how:'Answer the core of the question in one line, then move to the ground you want to stand on: a story, a principle, a result. Make your answer the point.',watch:'It must stay true. Steering a conversation is a skill; dodging it is obvious, and inventing facts is off limits.',from:'Kian’s view: the best communicators reframe or bridge so that their answer becomes the point, and the asker still leaves satisfied.',out:'You answer what matters, not just what was asked.'},
  'subtraction':{title:'Subtraction over addition',sum:'One idea fully committed to beats five half-explored.',how:'Before you speak, pick the one thing they should remember. Cut everything that doesn’t serve it.',watch:'Adding points feels safer and lands weaker. Most of the time the fix is to cut.',from:'A lesson from Kian’s Berklee mixing professor that stuck for life.',out:'They remember the one thing.'},
  'good-question':{title:'Ask a good question',sum:'A good question shows you listened, and can’t be answered by a search engine.',how:'Think it through first. Pick one thing you are genuinely curious about, tie it to something they said, and ask it short and open: “How did you decide…?”, “Why that over…?”',watch:'Don’t ask for the sake of asking, and don’t ask what you could look up in a minute. Everyone’s time is valuable.',from:'Kian: no question is stupid; the fear of asking is. But think it through, and ask only what you really want to know.',out:'People remember you as someone who listens.'},
  'their-problem':{title:'Talk about their problem',sum:'Clients don’t care about your technique. They care whether you solve their problem.',how:'Lead with what changes for them: more orders, a launch on time, fewer headaches. Mention your method only if they ask.',watch:'Listing skills, software and credentials sounds like every other freelancer.',from:'Kian, "Keep things simple": the people who pay us mostly don’t know our craft and prefer things simple.',out:'They hear value, not a résumé.'}
};

function _nb(){if(!S.nb||!Array.isArray(S.nb.entries))S.nb={entries:[],notes:[],unseen:false,mig:1};if(!Array.isArray(S.nb.notes))S.nb.notes=[];return S.nb;}

function _nbClean(t){return String(t||'').replace(/<[^>]+>/g,' ').replace(/\*+/g,'');}
function _nbSec(fb,re){const t=_nbClean(fb);const m=t.match(re);if(!m)return '';return m[1].split(/\n/)[0].replace(/\s+/g,' ').trim();}

// Add a session. e: {cat,title,sub,elapsed,words,wpm,tmin,tmax,fb,tr,fol,iso,fix,worked,extra}
function nbAdd(e){

  const en={id:e.id||_nbId(),iso:e.iso||new Date().toISOString(),cat:e.cat,title:String(e.title||'').slice(0,160),sub:String(e.sub||'').slice(0,60),
    elapsed:Math.round(e.elapsed||0),words:e.words||0,wpm:e.wpm||0,tmin:e.tmin||0,tmax:e.tmax||0,fol:e.fol||0,
    fix:String(fix||'').slice(0,260),worked:String(worked||'').slice(0,220),tags:_nbTags(fix),fb:String(fb).slice(0,4000)};

function _nbRel(iso){const d=new Date(iso);if(isNaN(d))return '';const t0=new Date();t0.setHours(0,0,0,0);const d0=new Date(d);d0.setHours(0,0,0,0);const n=Math.round((t0-d0)/864e5);if(n<=0)return 'Today';if(n===1)return 'Yesterday';if(n<7)return d.toLocaleDateString('en-US',{weekday:'short'});return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

// ── K's notes renderer: the four sections become cards ────────────────────
const KN_SECTIONS=[
  {key:'worked',re:/^(?:✅\s*)?WHAT WORKED/i,label:'What worked',sign:'+'},
  {key:'thread',re:/^(?:🎯\s*)?THE THREAD/i,label:'The thread'},
  {key:'struct',re:/^(?:🏗\s*)?STRUCTURE/i,label:'Structure'},
  {key:'fu',re:/^(?:↪\s*)?UNDER FOLLOW-?UP/i,label:'Under follow-up'},
  {key:'one',re:/^(?:💡\s*)?ONE (?:THING|FIX)/i,label:'One thing',sign:'−'}

function renderKNotes(raw){
  if(!raw)return '';
  if(/^<div class="g-card ai-err"/.test(raw))return raw;
  const text=String(raw).replace(/\*\*|__|^#+\s*/gm,'');
  if(_nbRetry(text))return '<div class="g-card"><div class="g-q">No worries, let’s give it another go.</div><p class="sub">K didn’t catch enough words to say anything useful.</p></div>';
  const buckets={};let cur=null;const other=[];
  text.split('\n').forEach(line=>{const t=line.trim();if(!t)return;
    const s=KN_SECTIONS.find(x=>x.re.test(t));
    if(s){cur=s.key;buckets[cur]=t.replace(/^[^:：]*[:：]\s*/,'');return;}
    if(cur)buckets[cur]+=' '+t;else other.push(t);});
  let h='<div class="kn">';
  KN_SECTIONS.forEach(s=>{if(!buckets[s.key])return;
    h+='<div class="kn-card"><div class="kn-h">'+(s.sign==='+'?'<span class="g-plus">+</span>':s.sign==='−'?'<span class="g-minus">−</span>':'')+escHtml(s.label)+'</div><p>'+escHtml(buckets[s.key].trim())+'</p></div>';});
  if(!Object.keys(buckets).length)h+='<div class="kn-card"><p>'+escHtml(other.join(' '))+'</p></div>';
  return h+'</div>';
}

// SYNC ACROSS DEVICES — one notebook on phone and computer, no accounts.
// A 16-character sync code is the only key. The notebook is encrypted on the
// device (AES-GCM, key from PBKDF2 of the code) before it leaves; the server
// stores scrambled data under SHA-256(code) and can't read it.
// Synced: K's notebook and practice history (replies, practice, pitches, quick answers). Deletions travel as tombstones;
// "Clear notebook"
// travels as a cut-off date.
// ═══════════════════════════════════════════════════════════════════════════

function _syPayload(){
  const nb=_nb();
  const sess={};SY_KEYS.forEach(k=>{if(S.sessions&&S.sessions[k])sess[k]=S.sessions[k];});
  const dev=Object.assign({},(S.sync&&S.sync.devs)||{});
  if(S.sync)dev[S.sync.dev]={name:_syDevice(),last:new Date().toISOString()};
  return {v:1,nb:{entries:nb.entries,notes:nb.notes,del:nb.del||[],clearedAt:nb.clearedAt||''},sess,dev,prefs:{goals:S.goals||[],rwField:S.rwField||''}};
}
function _sySig(){
  const nb=_nb();
  const ss=SY_KEYS.map(k=>((S.sessions||{})[k]||[]).map(x=>x.iso).join(',')).join('|');
  return [nb.entries.map(e=>e.id).join(','),nb.notes.map(n=>n.iso).join(','),(nb.del||[]).length,nb.clearedAt||'',ss,(S.goals||[]).join(','),S.rwField||''].join('#');
}
// Combine what's here with what came down. Nothing is lost unless deleted.
function _syMerge(r){
  if(!r||!r.nb)return false;
  const before=_sySig();
  const nb=_nb();
  const clr=[nb.clearedAt||'',r.nb.clearedAt||''].sort().pop();
  const after=iso=>!clr||String(iso||'')>clr;
  const del=new Set([...(nb.del||[]),...(r.nb.del||[])]);
  const byId=new Map();
  (r.nb.entries||[]).forEach(e=>{if(e&&e.id)byId.set(e.id,e);});
  nb.entries.forEach(e=>byId.set(e.id,e));
  nb.entries=[...byId.values()].filter(e=>!del.has(e.id)&&after(e.iso))
    .sort((a,b)=>new Date(b.iso)-new Date(a.iso)).slice(0,NB_MAX);
  const newestHere=nb.notes[0]&&nb.notes[0].iso||'';
  const notes=new Map();(r.nb.notes||[]).concat(nb.notes).forEach(n=>{if(n&&n.iso)notes.set(n.iso,n);});
  nb.notes=[...notes.values()].filter(n=>after(n.iso)).sort((a,b)=>new Date(b.iso)-new Date(a.iso)).slice(0,12);
  if(nb.notes[0]&&nb.notes[0].iso>newestHere&&newestHere)nb.unseen=true;
  nb.del=[...del].slice(-500);nb.clearedAt=clr;
  if(!S.sessions)S.sessions={};
  SY_KEYS.forEach(k=>{
    const m=new Map();((r.sess||{})[k]||[]).concat(S.sessions[k]||[]).forEach(s=>{if(s&&s.iso)m.set(s.iso,s);});
    const arr=[...m.values()].filter(s=>after(s.iso)).sort((a,b)=>new Date(b.iso)-new Date(a.iso)).slice(0,10);
    if(arr.length)S.sessions[k]=arr;else delete S.sessions[k];
  });
  if(S.sync){const d=Object.assign({},S.sync.devs||{},r.dev||{});S.sync.devs=d;}
  if(r.prefs){if(!(S.goals||[]).length&&Array.isArray(r.prefs.goals))S.goals=r.prefs.goals;if(!S.rwField&&r.prefs.rwField)S.rwField=r.prefs.rwField;}
  return _sySig()!==before;
}

// One round: pull, merge, push if anything is new. Retries when another device wins the race.
async function syncNow(opts){
  opts=opts||{};
  if(!S.sync||!S.sync.code||S.sync.gone)return;
  if(syncNow._busy){syncNow._again=true;return;}
  if(navigator.onLine===false){S.sync.err='offline';return;}
  syncNow._busy=true;
  const viewBefore=V.view;
  let changed=false;
  try{
    const {id,key}=await _syKeys(S.sync.code);
    for(let attempt=0;attempt<4;attempt++){
      const g=await _syFetch('GET','id='+id+(S.sync.rev&&!opts.full?'&have='+S.sync.rev:''));
      let rev=0;
      if(g.status===200){
        rev=g.j.rev;
        if(!g.j.same){changed=_syMerge(await _syDecrypt(key,g.j.data))||changed;}
      }else if(g.status===404&&g.j.error==='not_found'){
        if(S.sync.rev>0){S.sync.gone=true;S.sync.err=null;save();break;} // the synced copy was deleted
      }else throw new Error('get '+g.status);
      const sig=_sySig();
      if(rev&&rev===S.sync.rev&&sig===S.sync.sig&&!opts.push){S.sync.at=new Date().toISOString();break;}
      const p=await _syFetch('POST','',{id,base:rev,data:await _syEncrypt(key,_syPayload())});
      if(p.status===200){S.sync.rev=p.j.rev;S.sync.sig=sig;S.sync.at=new Date().toISOString();S.sync.err=null;
        if(S.sync.devs)S.sync.devs[S.sync.dev]={name:_syDevice(),last:S.sync.at};break;}
      if(p.status!==409)throw new Error('post '+p.status);
      S.sync.rev=0; // someone synced first: pull theirs, merge, try again
    }
    S.sync.err=null;S.sync.errCode=null;
  }catch(e){
    S.sync.errCode=String(e&&e.message||'').replace(/^(get|post) /,'').slice(0,12);
    S.sync.err=/OperationError|decrypt/i.test(String(e&&e.name)+String(e&&e.message))?'key':(navigator.onLine===false?'offline':'server');
  }
  save();
  syncNow._busy=false;
  if(changed&&V.view===viewBefore&&/^(hub|notebook|sync|settings)$/.test(V.view))render();
  else if(V.view==='sync')render();
  if(syncNow._again){syncNow._again=false;setTimeout(()=>syncNow(),300);}
}
// Push soon after anything synced changes (called from save)
function _sySoon(){
  if(!S.sync||!S.sync.code||S.sync.gone||syncNow._busy)return;
  clearTimeout(_sySoon._t);
  _sySoon._t=setTimeout(()=>{if(S.sync&&_sySig()!==S.sync.sig)syncNow();},4000);
}
async function syncStart(){
  if(!window.crypto||!crypto.subtle){V._syErr='Sync needs a secure (https) connection.';return;}
  const code=_syGenCode();
  S.sync={code,dev:_nbId(),rev:0,devs:{},at:null,err:null};
  save();
  await syncNow({push:true});
}
async function syncJoin(raw){
  if(!window.crypto||!crypto.subtle)return 'Sync needs a secure (https) connection.';
  const code=_syNorm(raw);
  if(!code)return 'That code doesn’t look right. It has 16 letters and numbers.';
  try{
    const {id,key}=await _syKeys(code);
    const g=await _syFetch('GET','id='+id);
    if(g.status===404&&g.j.error==='not_found')return 'No synced notebook uses that code. Check it, or start syncing on your other device first.';
    if(g.status!==200)return 'Can’t reach sync right now ('+g.status+'). Try again in a moment.';
    let data;try{data=await _syDecrypt(key,g.j.data);}catch(e){return 'That code doesn’t open this notebook. Check it and try again.';}
    S.sync={code,dev:(S.sync&&S.sync.dev)||_nbId(),rev:0,devs:{},at:null,err:null};
    _syMerge(data);S.sync.rev=g.j.rev;save();
    await syncNow({push:true});
    return null;
  }catch(e){return 'Can’t reach sync right now. Try again in a moment.';}
}
async function syncDeleteCloud(){
  try{const {id}=await _syKeys(S.sync.code);const r=await _syFetch('DELETE','id='+id);if(r.status!==200)return false;}catch(e){return false;}
  S.sync=null;save();return true;
}
function _syAgo(iso){
  if(!iso)return 'not yet';const s=Math.round((Date.now()-new Date(iso))/1000);
  if(s<45)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return _nbRel(iso);
}
function _syStatus(){
  const y=S.sync;
  if(!y)return {on:false,st:'off',lab:'Off',line:'Use your notebook on your phone and computer'};
  if(y.gone)return {on:true,st:'bad',lab:'Stopped',line:'The synced copy was deleted on another device'};
  if(y.err==='key')return {on:true,st:'bad',lab:'Problem',line:'This code no longer opens the synced notebook'};
  if(y.err==='offline')return {on:true,st:'warn',lab:'Offline',line:'Will sync when you’re back online'};
  if(y.err)return {on:true,st:'warn',lab:'Retrying',line:'Can’t reach sync right now'+(y.errCode?' ('+y.errCode+')':'')};
  const others=Object.keys(y.devs||{}).filter(k=>k!==y.dev).length;
  return {on:true,st:'ok',lab:'On',line:'This '+(_syIsPhone()?'phone':'device')+(others?' + '+others+' other'+(others===1?'':'s'):'')+' · synced '+_syAgo(y.at)};
}
function _syQR(text){
  try{const q=_QR(0,'M');q.addData(text);q.make();
    const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
    return '<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" aria-label="Sync QR code"><path d="'+d+'" fill="#000"/></svg>';
  }catch(e){return '';}
}

}
function _syInit(){
  if(S.sync&&S.sync.code)setTimeout(()=>syncNow(),1200);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.sync)syncNow();});
  window.addEventListener('online',()=>{if(S.sync)syncNow();});
  const m=(location.hash||'').match(/sync=([A-Za-z0-9-]{16,24})/);
  if(m){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}const code=_syNorm(m[1]);if(code&&!(S.sync&&S.sync.code===code)){if(S.sync)S.sync=null;V._syJoinCode=code;V.view='sync';}else if(code)V.view='sync';}
}

// Audio: one recorder for every feature (MediaRecorder + Web Speech captions,
// Whisper fallback on the server when captions caught little), and the other
// side's voice through the browser's text-to-speech (Take turns mode).
// ═══════════════════════════════════════════════════════════════════════════
const REC={active:false,elapsed:0,transcript:'',words:0,chunks:[],mr:null,stream:null,sr:null,_iv:null,mime:'audio/webm',onTick:null,maxSecs:0,level:0,_ac:null,_an:null};
function _recordSfx(starting){
  try{if(navigator.vibrate)navigator.vibrate(starting?[15,30,15]:20);}catch(e){}
  try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ac=new Ctx();const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
    if(starting){o.frequency.setValueAtTime(660,ac.currentTime);o.frequency.linearRampToValueAtTime(990,ac.currentTime+0.18);}else{o.frequency.setValueAtTime(740,ac.currentTime);o.frequency.linearRampToValueAtTime(440,ac.currentTime+0.2);}
    g.gain.setValueAtTime(0.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.18,ac.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.28);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.3);setTimeout(()=>{try{ac.close();}catch(e){}},500);}catch(e){}
}
async function recStart(opts){
  opts=opts||{};
  if(REC.active)await recStop();
  Object.assign(REC,{active:true,elapsed:0,transcript:'',words:0,chunks:[],mr:null,stream:null,sr:null,onTick:opts.onTick||null,maxSecs:opts.maxSecs||0,level:0,micOk:false});
  let stream=null;
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      REC.stream=stream;REC.micOk=true;
      try{const mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4';const mr=new MediaRecorder(stream,{mimeType:mime});mr.ondataavailable=e=>{if(e.data&&e.data.size>0)REC.chunks.push(e.data);};mr.start(1000);REC.mr=mr;REC.mime=mr.mimeType||mime;}
      catch(e){try{const mr=new MediaRecorder(stream);mr.ondataavailable=e=>{if(e.data&&e.data.size>0)REC.chunks.push(e.data);};mr.start(1000);REC.mr=mr;REC.mime=mr.mimeType||'audio/webm';}catch(e2){}}
      // level meter for the waveform
      try{const Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx){const ac=new Ctx();const src=ac.createMediaStreamSource(stream);const an=ac.createAnalyser();an.fftSize=256;src.connect(an);REC._ac=ac;REC._an=an;}}catch(e){}
    }catch(e){REC.micOk=false;}
  }
  _recordSfx(true);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR&&stream){
    try{const sr=new SR();sr.continuous=true;sr.interimResults=false;sr.lang=_recLang();
      sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const t=(e.results[i][0].transcript||'').trim();if(t){REC.transcript+=(REC.transcript?' ':'')+t;REC.words+=_wc(t);if(REC.onTick)REC.onTick(REC);}}};
      sr.onend=()=>{if(REC.active&&REC.sr===sr){try{sr.start();}catch(e){}}};
      sr.start();REC.sr=sr;}catch(e){}
  }
  REC._iv=setInterval(()=>{REC.elapsed++;
    if(REC._an){try{const a=new Uint8Array(REC._an.frequencyBinCount);REC._an.getByteTimeDomainData(a);let s=0;for(let i=0;i<a.length;i++){const v=(a[i]-128)/128;s+=v*v;}REC.level=Math.min(1,Math.sqrt(s/a.length)*4);}catch(e){}}
    if(REC.onTick)REC.onTick(REC);
    if(REC.maxSecs&&REC.elapsed>=REC.maxSecs&&opts.onMax)opts.onMax();},1000);
  return REC.micOk;
}
function recLevelLoop(el){
  // animates a .g-wave while recording
  if(!el)return;const bars=el.querySelectorAll('i');
  (function tick(){if(!REC.active||!document.body.contains(el))return;
    let lv=REC.level;if(REC._an){try{const a=new Uint8Array(REC._an.frequencyBinCount);REC._an.getByteTimeDomainData(a);let s=0;for(let i=0;i<a.length;i++){const v=(a[i]-128)/128;s+=v*v;}lv=Math.min(1,Math.sqrt(s/a.length)*5);}catch(e){}}
    bars.forEach((b,i)=>{const h=4+Math.round((lv*(0.5+Math.abs(Math.sin(i*1.3+Date.now()/180))))*26);b.style.height=h+'px';});
    requestAnimationFrame(tick);})();
}
function recStop(){
  return new Promise(resolve=>{
    if(!REC.active){resolve({elapsed:REC.elapsed,transcript:REC.transcript,words:REC.words,blob:null});return;}
    REC.active=false;_recordSfx(false);
    clearInterval(REC._iv);REC._iv=null;
    if(REC.sr){try{REC.sr.onend=null;REC.sr.stop();}catch(e){}REC.sr=null;}
    const finish=()=>{
      if(REC.stream){REC.stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});REC.stream=null;}
      if(REC._ac){try{REC._ac.close();}catch(e){}REC._ac=null;REC._an=null;}
      const blob=REC.chunks.length?new Blob(REC.chunks,{type:REC.mime||'audio/webm'}):null;
      REC.mr=null;
      resolve({elapsed:REC.elapsed,transcript:REC.transcript,words:REC.words,blob});
    };
    if(REC.mr&&REC.mr.state!=='inactive'){REC.mr.onstop=finish;try{REC.mr.stop();}catch(e){finish();}}else finish();
  });
}
// If live captions caught little, send the recording to the server (Whisper)
async function recWhisper(r){
  if(!r||!r.blob||r.blob.size<5000||(r.transcript&&r.transcript.length>=20)||!_aiOn())return r;
  const cfg=S.aiConfig||{};
  const endpoint=(cfg.endpoint||'/.netlify/functions/ai').replace(/\/ai$/,'/transcribe');
  try{const res=await fetch(endpoint,{method:'POST',headers:_aiHeaders({'content-type':r.blob.type||'audio/webm','x-lang':_coachLang().id}),body:r.blob});
    if(res.ok){const d=await res.json();if(d.transcript&&d.transcript.length>5){r.transcript=d.transcript;r.words=_wc(d.transcript);}}}catch(e){}
  return r;
