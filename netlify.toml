[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Art: let phones keep it, so pictures show at once on return visits
[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# PAYPAL_ENV is just the word "live", which appears all over the app: don't treat it as a leaked secret
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PAYPAL_ENV"
